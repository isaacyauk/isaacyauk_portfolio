<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Networks Final Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F0EA; --surface:#FFFFFF; --surface-2:#F8F6F1; --ink:#1B1F24; --muted:#656B72;
  --line:rgba(27,31,36,.12); --line-2:rgba(27,31,36,.2);
  --good:#2C7A4B; --good-soft:rgba(44,122,75,.12); --bad:#B0402E; --bad-soft:rgba(176,64,46,.11);
  --osi:#2A6C72; --ports:#9C6210; --proto:#6B4789; --accent:var(--osi);
  --l7:#B4553E; --l6:#A8781F; --l5:#7F8126; --l4:#3A8258; --l3:#2A7680; --l2:#3E5FA0; --l1:#674C98;
  --sans:"Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --spring:cubic-bezier(.34,1.3,.5,1); --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141619; --surface:#1D2024; --surface-2:#181B1E; --ink:#ECEAE4; --muted:#9CA1A8;
    --line:rgba(236,234,228,.1); --line-2:rgba(236,234,228,.2);
    --good:#5DBA84; --good-soft:rgba(93,186,132,.14); --bad:#E3806B; --bad-soft:rgba(227,128,107,.13);
    --osi:#62B4B9; --ports:#E0A548; --proto:#B592D8;
  }
}
:root[data-theme="dark"]{
  --bg:#141619; --surface:#1D2024; --surface-2:#181B1E; --ink:#ECEAE4; --muted:#9CA1A8;
  --line:rgba(236,234,228,.1); --line-2:rgba(236,234,228,.2);
  --good:#5DBA84; --good-soft:rgba(93,186,132,.14); --bad:#E3806B; --bad-soft:rgba(227,128,107,.13);
  --osi:#62B4B9; --ports:#E0A548; --proto:#B592D8;
}
body[data-sec="osi"]{--accent:var(--osi)}
body[data-sec="ports"]{--accent:var(--ports)}
body[data-sec="proto"]{--accent:var(--proto)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 70%, transparent);padding:calc(10px + env(safe-area-inset-top)) 16px 14px}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top h1{font-size:15px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{color:var(--muted);font-weight:500;margin-left:6px}
.icon{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;transition:transform .18s var(--spring)}
.icon:active{transform:scale(.9)}
.icon svg{width:18px;height:18px}
.icon[hidden]{display:none}

main{max-width:760px;margin:0 auto;padding:0 16px calc(48px + env(safe-area-inset-bottom))}

/* ---------- home ---------- */
.hero{padding:8px 0 18px}
.hero .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.hero h2{font-size:clamp(28px,6vw,40px);line-height:1.08;margin:6px 0 10px;letter-spacing:-.02em}
.hero p{margin:0;color:var(--muted);max-width:56ch}
.rules{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pill{font-size:12.5px;padding:4px 10px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted);background:var(--surface-2)}
.secs{display:grid;gap:12px;margin-top:10px}
.sec-card{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:start;text-align:left;padding:18px;border-radius:18px;border:1px solid var(--line);background:var(--surface);transition:transform .2s var(--spring), box-shadow .2s}
.sec-card:hover{transform:translateY(-2px);box-shadow:0 12px 26px -18px rgba(0,0,0,.45)}
.sec-card:active{transform:scale(.985)}
.sec-card .num{grid-row:span 3;font-family:var(--mono);font-weight:700;font-size:15px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--c)}
.sec-card h3{margin:0;font-size:19px;letter-spacing:-.01em}
.sec-card p{margin:0;color:var(--muted);font-size:14.5px}
.meter{display:flex;gap:14px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--c, var(--accent));border-radius:99px;transition:width .6s cubic-bezier(.3,.9,.25,1)}
.foot{margin-top:26px;font-size:13px;color:var(--muted)}
.foot button{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0}

/* ---------- section ---------- */
.sec-head{padding:4px 0 14px}
.sec-head .eyebrow{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.sec-head h2{margin:4px 0 0;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.sec-head p{margin:6px 0 0;color:var(--muted);font-size:14.5px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;border:0;background:transparent;padding:8px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line), 0 2px 8px -4px rgba(0,0,0,.25)}
.pane{padding-top:16px;animation:rise .28s cubic-bezier(.3,.8,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.note{font-size:13.5px;color:var(--muted);margin:0 0 12px}
h4{margin:22px 0 10px;font-size:13px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:500}
h4:first-child{margin-top:0}

/* buttons */
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:500;font-size:15px;transition:transform .16s var(--spring), background .15s}
.btn:active{transform:scale(.95)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
:root[data-theme="dark"] .btn.primary{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#111}}
.btn.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.spread{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:5px 11px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:transparent;color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#111}}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);margin:2px 4px 2px 0;white-space:nowrap}
.tag.mono{font-size:11.5px}

/* ---------- OSI stack reference ---------- */
.layer{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.layer:first-of-type{border-top:0;padding-top:0}
.badge{width:44px;height:44px;border-radius:11px;background:var(--lc);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:18px}
.layer h5{margin:0;font-size:17px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.pdu{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:6px;background:color-mix(in srgb, var(--lc) 14%, transparent);color:var(--lc);font-weight:700}
.layer .one{margin:4px 0 6px;font-size:14.5px}
.layer ul{margin:0 0 6px;padding-left:18px;font-size:14px;color:var(--muted)}
.layer ul li{margin:2px 0}
.encap{display:grid;gap:4px;font-family:var(--mono);font-size:12px}
.encap .r{display:flex;align-items:stretch;gap:4px}
.encap .lbl{width:88px;flex:none;color:var(--muted);display:flex;align-items:center}
.encap .h{padding:7px 8px;border-radius:6px;color:#fff;white-space:nowrap}
.encap .d{padding:7px 8px;border-radius:6px;background:var(--surface-2);border:1px dashed var(--line-2);flex:1;min-width:0}
.encap .n{margin-left:auto;color:var(--ink);font-weight:700;display:flex;align-items:center;padding-left:6px}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:0 8px 8px}
td{padding:10px 8px;border-top:1px solid var(--line);vertical-align:top}
td.port{font-family:var(--mono);font-weight:700;font-size:16px;color:var(--accent);white-space:nowrap}
.tp{font-family:var(--mono);font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:5px}
.tp.TCP{background:rgba(62,95,160,.13);color:var(--l2)}
.tp.UDP{background:rgba(180,85,62,.13);color:var(--l7)}
.star{color:var(--accent);font-size:12px}
.facts{margin:0;padding-left:18px;font-size:14.5px}
.facts li{margin:5px 0}

/* protocol details */
details.proto{border-top:1px solid var(--line)}
details.proto:first-of-type{border-top:0}
details.proto summary{list-style:none;display:flex;gap:10px;align-items:baseline;padding:12px 0;cursor:pointer}
details.proto summary::-webkit-details-marker{display:none}
details.proto summary b{font-size:16px;color:var(--ink)}
details.proto summary .tag{flex:none;max-width:45%;white-space:normal;text-align:right}
details.proto summary .muted{font-size:13.5px;flex:1;min-width:0}
details.proto summary .chev{transition:transform .2s;color:var(--muted);font-size:12px}
details.proto[open] summary .chev{transform:rotate(90deg)}
.proto-body{padding:0 0 14px}
.proto-body .def{margin:0 0 8px;font-size:15px}
.lay-group{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 2px}
.lay-group:first-child{margin-top:0}

/* ---------- flashcards ---------- */
.deck-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.deck-bar .count{font-family:var(--mono);font-size:13px;color:var(--muted);margin-left:auto}
.flip{perspective:1400px;cursor:pointer;user-select:none}
.flip-in{position:relative;min-height:320px;transition:transform .55s cubic-bezier(.3,1.25,.45,1);transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;overflow:auto}
.face.front{align-items:center;justify-content:center;text-align:center;gap:14px}
.face.back{transform:rotateY(180deg)}
.face .corner{position:absolute;top:14px;left:16px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.face .known{position:absolute;top:12px;right:14px;font-size:12px;color:var(--good)}
.big-n{font-family:var(--mono);font-weight:700;font-size:84px;line-height:1;color:var(--lc, var(--accent))}
.big-t{font-weight:700;font-size:clamp(32px,8vw,48px);letter-spacing:-.02em;line-height:1.1}
.big-p{font-family:var(--mono);font-weight:700;font-size:72px;line-height:1;color:var(--accent)}
.hint{color:var(--muted);font-size:14px;max-width:34ch}
.fq{font-size:20px;font-weight:600;max-width:30ch;line-height:1.3}
.back h5{margin:0 0 2px;font-size:22px;letter-spacing:-.01em}
.back .sub{color:var(--muted);font-size:14px;margin-bottom:10px}
.back ul{margin:6px 0;padding-left:18px;font-size:14.5px}
.back li{margin:3px 0}
.back p{margin:6px 0;font-size:15px}
.ans{font-size:22px;font-weight:700;letter-spacing:-.01em}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.card-actions .btn{padding:13px}
.nav-mini{display:flex;justify-content:space-between;margin-top:10px}
.nav-mini button{background:none;border:0;color:var(--muted);font-size:14px;padding:6px 2px}

/* ---------- quiz ---------- */
.prog{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .4s cubic-bezier(.3,.9,.25,1)}
.qmeta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:8px}
.qtext{font-size:19px;font-weight:600;line-height:1.35;margin:0 0 16px}
.qtext em{font-style:normal;color:var(--accent)}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:13px 15px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:15.5px;display:flex;gap:12px;align-items:flex-start;transition:transform .15s var(--spring), background .15s, border-color .15s}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt:not(:disabled):active{transform:scale(.985)}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px;flex:none;margin-top:2px}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.5}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;font-size:14.5px;animation:rise .25s ease}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
.result{text-align:center;padding:26px 16px}
.result .score{font-family:var(--mono);font-size:56px;font-weight:700;color:var(--accent);line-height:1}
.result p{color:var(--muted)}
.missed{text-align:left;margin-top:14px}
.missed li{margin:8px 0;font-size:14.5px}
.missed li span{color:var(--good);font-weight:600}

/* ---------- stack drill ---------- */
.stack{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:6px;border-radius:12px;border:1.5px dashed var(--line-2);min-height:52px;background:transparent;text-align:left;transition:background .2s, border-color .2s, transform .2s var(--spring)}
.slot .badge{width:38px;height:38px;font-size:15px;background:var(--line);color:var(--muted);border-radius:9px}
.slot.filled{border-style:solid;border-color:transparent;background:color-mix(in srgb, var(--lc) 12%, var(--surface))}
.slot.filled .badge{background:var(--lc);color:#fff}
.slot.filled .nm{font-weight:600;font-size:16px}
.slot.next{border-color:var(--accent)}
.slot.hit{background:var(--good-soft);transform:scale(1.02)}
.slot.miss{background:var(--bad-soft)}
.slot.reveal{box-shadow:0 0 0 2px var(--good)}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tile{padding:10px 14px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;transition:transform .15s var(--spring)}
.tile:active{transform:scale(.93)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.prompt{padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:12px;font-size:17px;font-weight:600;min-height:56px}
.prompt small{display:block;font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}

/* ---------- write-it sheet ---------- */
.sheet-row{display:grid;grid-template-columns:40px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.sheet-row:first-child{border-top:0}
.sheet-row .badge{width:38px;height:38px;font-size:15px}
.sheet-row input,.sheet-row textarea{width:100%;border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:15px}
.sheet-row textarea{margin-top:6px;min-height:64px;resize:vertical;font-size:14.5px}
.sheet-row input.ok{border-color:var(--good);background:var(--good-soft)}
.sheet-row input.no{border-color:var(--bad);background:var(--bad-soft)}
.keypts{margin-top:8px;display:grid;gap:4px}
.keypts label{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:4px 6px;border-radius:8px}
.keypts input{width:auto;margin-top:4px;accent-color:var(--good)}
.keypts .corr{font-size:13.5px;color:var(--bad);font-weight:600}
.tally{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.tally b{font-family:var(--mono)}

/* ---------- rapid fire / sort ---------- */
.rf{text-align:center;padding:24px 16px}
.rf .big-p,.rf .big-t{margin:8px 0 18px}
.rf-q{font-size:26px;font-weight:700;margin:10px 0 18px;letter-spacing:-.01em}
.rf input{width:100%;max-width:340px;text-align:center;font-size:20px;padding:12px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface-2);font-family:var(--mono)}
.rf input.ok{border-color:var(--good);background:var(--good-soft)}
.rf input.no{border-color:var(--bad);background:var(--bad-soft)}
.rf .fbline{min-height:48px;margin-top:12px;font-size:15px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;margin:0 auto}
.duo .btn,.quad .btn{padding:16px;font-size:17px;font-weight:600}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:480px;margin:0 auto}
.btn.flash-ok{background:var(--good);color:#fff;border-color:transparent}
.btn.flash-no{background:var(--bad);color:#fff;border-color:transparent}
.streak{font-family:var(--mono);font-size:12.5px;color:var(--muted)}

@media (min-width:640px){
  .flip-in{min-height:360px}
  .secs{gap:14px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body data-sec="">
<header class="top">
  <div class="top-in">
    <button class="icon" id="backBtn" aria-label="Back to sections" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="topTitle">CSCI 466 <small>Final review</small></h1>
    <button class="icon" id="themeBtn" aria-label="Toggle dark mode">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>
<main id="app"></main>

<script>
/* =====================================================================
   DATA — pulled from Pearsall's CSCI 466 (Fall 2025) slides.
   Scope is limited to the three final-exam questions:
   I. OSI layers + responsibilities, II. TCP/UDP port services, III. protocols.
   ===================================================================== */

const LAYERS = [
  { n:7, name:"Application", pdu:"Message",
    one:"Provides the protocols for sending and receiving data between services / applications.",
    resp:[
      "Interacts directly with applications like web browsers and email",
      "Provides the protocols and services apps use to send and receive data",
      "Where the network application creates the message"
    ],
    protos:["HTTP","HTTPS","DNS","SMTP","FTP","SSH"], qp:["HTTP","DNS","SMTP","FTP"], extra:"Runs on hosts (end systems)" },
  { n:6, name:"Presentation", pdu:"Message",

function cardsFor(sec) {
  if (sec === "osi") {
    const c = LAYERS.map(L => ({
      id:"osi-" + L.n, tag:"Layer",

    }));
    c.push({ id:"osi-encap", tag:"Encapsulation", front:`<div class="fq">Going down the stack, what does each layer add, and what is the result called?</div>`, back:`<h5>Encapsulation</h5><div class="sub">Header added at each layer</div>${ENCAP}` });
    c.push({ id:"osi-order", tag:"Order", front:`<div class="fq">All seven layers, top to bottom?</div>`, back:`<h5>7 → 1</h5><p>Application · Presentation · Session · Transport · Network · Data Link · Physical</p><p class="muted">All People Seem To Need Data Processing</p>` });
    return c;
  }
  if (sec === "ports") {
    const c = PORTS.map(p => ({
      id:"port-" + p.p, tag:"Port",
      front:`<div class="big-p">${p.p}</div><div class="hint">Which service, and TCP or UDP?</div>`,
      back:`<div class="ans">${esc(p.svc)}</div><div class="sub">${esc(p.full)}</div><p><span class="tp ${p.t}">${p.t}</span></p>`
    }));
    PORT_FACTS.forEach((f, i) => c.push({ id:"pf-" + i, tag:"Fact", front:`<div class="fq">${f.q}</div>`, back:`<div class="ans" style="font-size:19px">${f.a}</div><p class="muted">${f.exp}</p>` }));
    return c;
  }
  return PROTOS.map(p => ({

function renderCards(pane, sec) {
  const all = cardsFor(sec);
  let onlyUnknown = false, order = all.map((_, i) => i), i = 0;
  const bar = el(`<div class="deck-bar">
    <button class="chip" data-a="unk" aria-pressed="false">Unknown only</button>
    <button class="chip" data-a="shuf">Shuffle</button>
    <span class="count"></span></div>`);
  const card = el(`<div class="flip" tabindex="0" role="button" aria-label="Flip card"><div class="flip-in"><div class="face front"></div><div class="face back"></div></div></div>`);
  const acts = el(`<div class="card-actions"><button class="btn bad" data-a="again">Again</button><button class="btn good" data-a="got">Got it</button></div>`);
  const nav = el(`<div class="nav-mini"><button data-a="prev">← Prev</button><button data-a="next">Next →</button></div>`);
  const empty = el(`<div class="panel result" hidden><div class="score">✓</div><p>Every card here is marked known.</p><button class="btn" data-a="resetdeck">Unmark all in this section</button></div>`);
  pane.append(bar, card, acts, nav, empty);

  const list = () => order.filter(k => !onlyUnknown || !S.known[all[k].id]);
  function show() {
    const L = list();
    const none = L.length === 0;
    empty.hidden = !none; card.hidden = acts.hidden = nav.hidden = none;
    const known = all.filter(c => S.known[c.id]).length;
    $(".count", bar).textContent = none ? `${known}/${all.length} known` : `${i + 1} / ${L.length} · ${known} known`;
    if (none) return;
    if (i >= L.length) i = 0;
    const c = all[L[i]];
    card.classList.remove("on");
    $(".front", card).innerHTML = `<span class="corner">${c.tag}</span>${S.known[c.id] ? '<span class="known">✓ known</span>' : ""}${c.front}`;
    $(".back", card).innerHTML = `<span class="corner">${c.tag}</span><div class="back" style="margin-top:14px">${c.back}</div>`;
    fit();
  }
  function fit() {
    const inner = $(".flip-in", card);
    inner.style.minHeight = "";
    const h = Math.max(inner.offsetHeight, ...$$(".face", card).map(f => f.scrollHeight));
    inner.style.minHeight = h + "px";
  }
  addEventListener("resize", fit);
  const flip = () => card.classList.toggle("on");
  card.addEventListener("click", flip);
  const step = (d) => { const n = list().length; if (!n) return; i = (i + d + n) % n; show(); };
  function mark(v) {
    const L = list(); if (!L.length) return;
    const c = all[L[i]];
    if (v) S.known[c.id] = true; else delete S.known[c.id];
    save();
    if (v && onlyUnknown) show(); else step(1);
  }
  bar.addEventListener("click", e => {
    const a = e.target.dataset.a;
    if (a === "unk") { onlyUnknown = !onlyUnknown; e.target.setAttribute("aria-pressed", onlyUnknown); i = 0; show(); }
    if (a === "shuf") { order = shuffle(order); i = 0; show(); }
  });
  acts.addEventListener("click", e => { const a = e.target.dataset.a; if (a === "got") mark(true); if (a === "again") mark(false); });
  nav.addEventListener("click", e => { const a = e.target.dataset.a; if (a === "prev") step(-1); if (a === "next") step(1); });
  empty.addEventListener("click", e => { if (e.target.dataset.a === "resetdeck") { all.forEach(c => delete S.known[c.id]); save(); show(); } });
  const key = (e) => {
    if (e.target.matches("input,textarea,button")) return;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "1") mark(false);
    else if (e.key === "2") mark(true);
  };
  document.addEventListener("keydown", key);
  cleanup = () => { document.removeEventListener("keydown", key); removeEventListener("resize", fit); };
  show();
}

/* =====================================================================
   QUIZ (multiple choice, generated from the data)
   ===================================================================== */
function mc(q, a, pool, exp) {
  const d = shuffle([...new Set(pool.filter(x => x !== a))]).slice(0, 3);
  return { q, a, opts: shuffle([a, ...d]), exp };
}
function quizPool(sec) {
  const G = [];
  if (sec === "osi") {
    const names = LAYERS.map(l => l.name);
    const nums = LAYERS.map(l => String(l.n));
    const pdus = ["Message","Segment","Datagram","Frame","Bits"];
    LAYERS.forEach(L => {
      L.resp.forEach(r => G.push(() => mc(`Which layer is responsible for: <em>${r}</em>?`, L.name, names, `Layer ${L.n}, ${L.name}: ${L.one}`)));
      G.push(() => mc(`What is the unit of data at the <b>${L.name}</b> layer?`, L.pdu, pdus, `${L.name} → ${L.pdu}.`));
      G.push(() => mc(`Layer <b>${L.n}</b> of the OSI model is…`, L.name, names, `7 → 1: Application, Presentation, Session, Transport, Network, Data Link, Physical.`));
      G.push(() => mc(`The <b>${L.name}</b> layer is layer number…`, String(L.n), nums, `All People Seem To Need Data Processing (7 → 1).`));
      L.qp.forEach(p => G.push(() => mc(`<b>${p}</b> belongs to which layer?`, L.name, names, `${p} is a ${L.name} layer protocol.`)));
    });
    OSI_STATIC.forEach(s => G.push(() => mc(s.q, s.a, s.opts, s.exp)));
  } else if (sec === "ports") {
    const core = PORTS.filter(p => p.core);
    const svcs = PORTS.map(p => p.svc), nums = PORTS.map(p => p.p);
    core.forEach(p => {
      G.push(() => mc(`Port <b class="mono">${p.p}</b> is used by…`, p.svc, svcs, `${p.p} → ${p.full} (${p.t}).`));
      G.push(() => mc(`<b>${p.svc}</b> uses which port?`, p.p, nums, `${p.svc} → ${p.p}/${p.t}.`));
    });
    ["HTTP","HTTPS","SSH","SMTP","FTP (control)","DNS","DHCP (server)"].forEach(sv => {
      const p = PORTS.find(x => x.svc === sv);
      G.push(() => ({ q:`<b>${sv.replace(" (control)","").replace(" (server)","")}</b> normally runs over…`, a:p.t, opts:["TCP","UDP"], exp:p.t === "UDP" ? `${sv} uses UDP — no handshake needed.` : `${sv} needs reliable delivery, so TCP.` }));
    });
    PORT_FACTS.forEach(f => G.push(() => mc(f.q, f.a, f.opts, f.exp)));
  } else {
    const names = PROTOS.map(p => p.name);
    PROTOS.forEach(p => {
      const same = PROTOS.filter(x => x.layer === p.layer && x.id !== p.id).map(x => x.name);
      const pool = same.length >= 3 ? same : names;
      G.push(() => mc(`Which protocol: <em>${p.def}</em>`, p.name, pool, `${p.name} — ${p.full}.`));
      p.facts.forEach(f => {
        if (f.includes(p.name.split(" ")[0])) return;
        G.push(() => mc(`Which protocol fits: <em>${f}</em>`, p.name, pool, `${p.name} — ${p.full}.`));
      });
      if (p.sort) G.push(() => mc(`<b>${p.name}</b> belongs to which layer?`, p.layer, SORT_LAYERS, p.note || `${p.name} is ${p.layer} layer.`));
    });
    PROTO_STATIC.forEach(s => G.push(() => mc(s.q, s.a, s.opts, s.exp)));
  }
  return G;
}

function renderQuiz(pane, sec) {
  const N = 10;
  let qs, i, score, missed, locked;
  function start() {
    const seen = new Set(); qs = [];
    for (const g of shuffle(quizPool(sec))) {
      const q = g(); if (seen.has(q.q)) continue;
      seen.add(q.q); qs.push(q); if (qs.length === N) break;
    }
    i = 0; score = 0; missed = []; draw();
  }
  function draw() {
    locked = false;
    const q = qs[i];
    pane.innerHTML = "";
    pane.appendChild(el(`<div class="prog"><i style="width:${i / N * 100}%"></i></div>`));
    pane.appendChild(el(`<div class="qmeta"><span>Question ${i + 1} of ${N}</span><span>${score} correct</span></div>`));
    pane.appendChild(el(`<p class="qtext">${q.q}</p>`));
    const opts = el(`<div class="opts"></div>`);
    q.opts.forEach((o, k) => {
      const b = el(`<button class="opt"><span class="k">${k + 1}</span><span>${o}</span></button>`);
      b.addEventListener("click", () => answer(k));
      opts.appendChild(b);
    });
    pane.appendChild(opts);
  }
  function answer(k) {
    if (locked) return; locked = true;
    const q = qs[i], chosen = q.opts[k], ok = chosen === q.a;
    if (ok) score++; else missed.push(q);
    $$(".opt", pane).forEach((b, j) => {
      b.disabled = true;
      if (q.opts[j] === q.a) b.classList.add("right");
      else if (j === k) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    $(".qmeta span:last-child", pane).textContent = `${score} correct`;
    pane.appendChild(el(`<div class="fb ${ok ? "ok" : "no"}"><b>${ok ? "Correct" : "Not quite — " + q.a}</b>${q.exp || ""}</div>`));
    const nx = el(`<div class="row end" style="margin-top:12px"><button class="btn primary">${i + 1 === N ? "See results" : "Next"} →</button></div>`);
    $("button", nx).addEventListener("click", next);
    pane.appendChild(nx);
    $("button", nx).focus({ preventScroll:true });
  }
  function next() { i++; if (i < N) draw(); else finish(); }
  function finish() {
    const prev = S.best[sec];
    if (prev == null || score > prev) { S.best[sec] = score; save(); }
    pane.innerHTML = "";
    const r = el(`<div class="panel result">
      <div class="score">${score}/${N}</div>
      <p>${score === N ? "Clean sweep." : score >= 8 ? "Solid. Review the misses below." : "Worth another pass through the cards."}${prev != null ? ` Best: ${Math.max(prev, score)}/${N}.` : ""}</p>
      <div class="row" style="justify-content:center"><button class="btn primary" data-a="again">New quiz</button><button class="btn" data-a="cards">Go to cards</button></div>
      ${missed.length ? `<ol class="missed">${missed.map(m => `<li>${m.q}<br><span>${m.a}</span></li>`).join("")}</ol>` : ""}
    </div>`);
    r.addEventListener("click", e => { if (e.target.dataset.a === "again") start(); if (e.target.dataset.a === "cards") go(sec, "cards"); });
    pane.appendChild(r);
  }
  const key = (e) => {
    if (!qs || e.target.matches("input,textarea")) return;
    const n = parseInt(e.key, 10);
    if (!locked && n >= 1 && n <= (qs[i]?.opts.length || 0)) answer(n - 1);
  };
  document.addEventListener("keydown", key);
  cleanup = () => document.removeEventListener("keydown", key);
  start();
}

/* =====================================================================
   OSI — STACK DRILL (build the stack, then tap the right layer)
   ===================================================================== */
function renderStack(pane) {
  let placed, pool, mistakes, phase, prompts, pi, pscore, busy;
  function start() { placed = 0; pool = shuffle(LAYERS); mistakes = 0; phase = 1; busy = false; draw(); }
  function buildPrompts() {
    const P = [];
    LAYERS.forEach(L => P.push({ kind:"Responsibility", text:pick(L.resp), ok:[L.n] }));
    [["Segment",[4]],["Datagram",[3]],["Frame",[2]],["Bits",[1]],["Message",[5,6,7]]].forEach(([u, ok]) => P.push({ kind:"Unit of data", text:u, ok }));
    P.push({ kind:"Addressing", text:"Uses MAC addresses", ok:[2] }, { kind:"Addressing", text:"Uses IP addresses", ok:[3] }, { kind:"Addressing", text:"Uses port numbers", ok:[4] });
    P.push({ kind:"Device", text:"Routers operate here", ok:[3] }, { kind:"Device", text:"Switches operate here", ok:[2] });
    LAYERS.forEach(L => L.qp.forEach(p => P.push({ kind:"Protocol", text:p, ok:[L.n] })));
    return shuffle(P).slice(0, 12);
  }
  function draw() {
    pane.innerHTML = "";
    if (phase === 1) {
      pane.appendChild(el(`<p class="note">Round 1 — build the stack from the top. Tap the layer that goes in the highlighted slot. <span class="streak">${mistakes ? mistakes + " miss" + (mistakes > 1 ? "es" : "") : ""}</span></p>`));
    } else if (phase === 2) {
      const pr = prompts[pi];
      pane.appendChild(el(`<p class="note">Round 2 — tap the layer that matches. ${pi + 1} of ${prompts.length} · ${pscore} right</p>`));
      pane.appendChild(el(`<div class="prompt"><small>${pr.kind}</small>${pr.text}</div>`));
    }
    const stack = el(`<div class="stack"></div>`);
    LAYERS.forEach((L, idx) => {
      const filled = phase > 1 || idx < placed;
      const s = el(`<button class="slot ${filled ? "filled" : ""} ${phase === 1 && idx === placed ? "next" : ""}" style="--lc:var(--l${L.n})" data-n="${L.n}" ${phase === 1 ? "tabindex='-1'" : ""}>
        <span class="badge">${L.n}</span><span class="nm">${filled ? L.name + ` <span class="pdu">${L.pdu}</span>` : ""}</span></button>`);
      if (phase === 2) s.addEventListener("click", () => tapLayer(L.n, s));
      stack.appendChild(s);
    });
    pane.appendChild(stack);
    if (phase === 1) {
      const pl = el(`<div class="pool"></div>`);
      pool.forEach(L => {
        const t = el(`<button class="tile">${L.name}</button>`);
        t.addEventListener("click", () => {
          if (L.n === LAYERS[placed].n) { placed++; pool = pool.filter(x => x !== L); if (placed === 7) { phase = 1.5; } draw(); }
          else { mistakes++; t.classList.remove("shake"); void t.offsetWidth; t.classList.add("shake"); $(".streak", pane).textContent = mistakes + " miss" + (mistakes > 1 ? "es" : ""); }
        });
        pl.appendChild(t);
      });
      pane.appendChild(pl);
    }
    if (phase === 1.5) {
      const c = el(`<div class="panel" style="margin-top:14px;text-align:center"><p style="margin:0 0 10px"><b>Stack built</b> ${mistakes ? `with ${mistakes} miss${mistakes > 1 ? "es" : ""}` : "with no misses"}.</p><button class="btn primary">Round 2: match responsibilities →</button></div>`);
      $("button", c).addEventListener("click", () => { phase = 2; prompts = buildPrompts(); pi = 0; pscore = 0; draw(); });
      pane.appendChild(c);
    }
    if (phase === 3) {
      const c = el(`<div class="panel result" style="margin-top:14px"><div class="score">${pscore}/${prompts.length}</div><p>Round 1: ${mistakes} miss${mistakes === 1 ? "" : "es"} building the stack.</p><button class="btn primary">Run it again</button></div>`);
      $("button", c).addEventListener("click", start);
      pane.appendChild(c);
    }
  }
  function tapLayer(n, slot) {
    if (busy) return; busy = true;
    const pr = prompts[pi], ok = pr.ok.includes(n);
    if (ok) { pscore++; slot.classList.add("hit"); }
    else {
      slot.classList.add("miss");
      $$(".slot", pane).forEach(s => { if (pr.ok.includes(+s.dataset.n)) s.classList.add("reveal"); });
    }
    setTimeout(() => { busy = false; pi++; if (pi >= prompts.length) phase = 3; draw(); }, ok ? 550 : 1500);
  }
  start();
}

/* =====================================================================
   OSI — WRITE IT (exam simulation, self-graded)
   ===================================================================== */
function renderWrite(pane) {
  let checked = false;
  pane.innerHTML = "";
  pane.appendChild(el(`<p class="note">Exam simulation. Name each layer and jot its responsibilities from memory, then check. Names are auto-graded; tick the key points you actually covered.</p>`));
  const panel = el(`<div class="panel"></div>`);
  LAYERS.forEach(L => {
    panel.appendChild(el(`<div class="sheet-row" style="--lc:var(--l${L.n})" data-n="${L.n}">
      <div class="badge">${L.n}</div>
      <div><input type="text" placeholder="Layer ${L.n} name" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Layer ${L.n} name">
      <textarea placeholder="Responsibilities, unit of data…" aria-label="Layer ${L.n} responsibilities"></textarea>
      <div class="keypts" hidden></div></div></div>`));
  });
  pane.appendChild(panel);
  const tally = el(`<div class="tally"><span>Names <b class="tn">–/7</b> · Points <b class="tp2">–</b></span><button class="btn primary">Check answers</button></div>`);
  pane.appendChild(tally);
  const btn = $("button", tally);

  function recount() {
    const names = $$(".sheet-row input[type=text].ok", panel).length;
    const boxes = $$(".keypts input", panel), got = boxes.filter(b => b.checked).length;
    $(".tn", tally).textContent = `${names}/7`;
    $(".tp2", tally).textContent = `${got}/${boxes.length}`;
  }
  btn.addEventListener("click", () => {
    if (checked) { renderWrite(pane); return; }
    checked = true;
    $$(".sheet-row", panel).forEach(row => {
      const n = +row.dataset.n, L = LAYER_BY_N[n];
      const inp = $("input", row), ok = NAME_ALIASES[n].includes(norm(inp.value));
      inp.classList.add(ok ? "ok" : "no"); inp.readOnly = true;
      $("textarea", row).readOnly = true;
      const kp = $(".keypts", row);
      kp.hidden = false;
      kp.innerHTML = (ok ? "" : `<div class="corr">→ ${L.name}</div>`) +
        [...L.resp, `Unit of data: ${L.pdu}`].map(r => `<label><input type="checkbox"><span>${r}</span></label>`).join("");
    });
    btn.textContent = "Start over";
    panel.addEventListener("change", recount);
    recount();
  });
}

/* =====================================================================
   PORTS — RAPID FIRE
   ===================================================================== */
function renderRapid(pane) {
  let mode = "p2s", queue, i, score, state;
  const LEN = 12;
  const core = PORTS.filter(p => p.core);
  function start() {
    if (mode === "tu") queue = shuffle(TU_ITEMS).slice(0, LEN);
    else queue = shuffle([...core, ...shuffle(core)]).slice(0, LEN);
    i = 0; score = 0; draw();
  }
  function head() {
    const h = el(`<div class="chips" style="justify-content:center;margin-bottom:6px">
      <button class="chip" data-m="p2s" aria-pressed="${mode === "p2s"}">Port → service</button>
      <button class="chip" data-m="s2p" aria-pressed="${mode === "s2p"}">Service → port</button>
      <button class="chip" data-m="tu" aria-pressed="${mode === "tu"}">TCP or UDP?</button></div>`);
    h.addEventListener("click", e => { const m = e.target.dataset.m; if (m && m !== mode) { mode = m; start(); } });
    return h;
  }
  function draw() {
    state = "ask";
    pane.innerHTML = "";
    pane.appendChild(head());
    pane.appendChild(el(`<div class="prog" style="margin-top:12px"><i style="width:${i / LEN * 100}%"></i></div>`));
    if (i >= LEN) {
      const r = el(`<div class="panel result"><div class="score">${score}/${LEN}</div><p>${score === LEN ? "Perfect round." : "Run it again until it’s automatic."}</p><button class="btn primary">Another round</button></div>`);
      $("button", r).addEventListener("click", start);
      pane.appendChild(r);
      return;
    }
    const it = queue[i];
    const box = el(`<div class="panel rf"></div>`);
    box.appendChild(el(`<div class="qmeta"><span>${i + 1} / ${LEN}</span><span>${score} right</span></div>`));
    if (mode === "tu") {
      box.appendChild(el(`<div class="rf-q">${esc(it.t)}</div>`));
      const duo = el(`<div class="duo"><button class="btn" data-v="TCP">TCP</button><button class="btn" data-v="UDP">UDP</button></div>`);
      duo.addEventListener("click", e => { const v = e.target.dataset.v; if (v && state === "ask") judge(v === it.a, it.a, e.target); });
      box.appendChild(duo);
      box.appendChild(el(`<div class="fbline muted">Keys: T or U</div>`));
    } else {
      if (mode === "p2s") box.appendChild(el(`<div class="big-p">${it.p}</div>`));
      else box.appendChild(el(`<div class="rf-q">${esc(it.svc)}</div>`));
      const inp = el(`<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" ${mode === "s2p" ? 'inputmode="numeric"' : ""} placeholder="${mode === "p2s" ? "service" : "port"}" aria-label="Your answer">`);
      box.appendChild(inp);
      box.appendChild(el(`<div class="fbline muted">Enter to submit</div>`));
      inp.addEventListener("keydown", e => {
        if (e.key !== "Enter") return;
        e.preventDefault();
        if (state === "ask") {
          const v = norm(inp.value); if (!v) return;
          const ok = mode === "p2s" ? (it.ans.includes(v) || v === norm(it.svc)) : v === it.p;
          const answer = mode === "p2s" ? `${it.svc} · ${it.t}` : `${it.p} · ${it.t}`;
          judge(ok, answer, inp);
        } else if (state === "wait") advance();
      });
      setTimeout(() => inp.focus(), 30);
    }
    pane.appendChild(box);
  }
  function judge(ok, answer, target) {
    state = ok ? "done" : "wait";
    if (ok) score++;
    const fb = $(".fbline", pane);
    if (target.tagName === "INPUT") { target.classList.add(ok ? "ok" : "no"); }
    else target.classList.add(ok ? "flash-ok" : "flash-no");
    $(".qmeta span:last-child", pane).textContent = `${score} right`;
    if (ok) { fb.innerHTML = `<b style="color:var(--good)">✓ ${esc(answer)}</b>`; setTimeout(advance, 650); }
    else {
      fb.innerHTML = `<b style="color:var(--bad)">✗ ${esc(answer)}</b><br><button class="btn" style="margin-top:8px">Next →</button>`;
      $("button", fb).addEventListener("click", advance);
    }
  }
  function advance() { if (state === "ask") return; i++; draw(); }
  const key = (e) => {
    if (mode !== "tu" || e.target.matches("input,textarea")) return;
    const k = e.key.toLowerCase();
    if (state === "ask" && (k === "t" || k === "u")) { const b = $(`.duo [data-v="${k === "t" ? "TCP" : "UDP"}"]`, pane); b && b.click(); }
    else if (state === "wait" && k === "enter") advance();
  };
  document.addEventListener("keydown", key);
  cleanup = () => document.removeEventListener("keydown", key);
  start();
}

/* =====================================================================
   PROTOCOLS — LAYER SORT
   ===================================================================== */
function renderSort(pane) {
  let queue, i, score, state, missed;
  function start() { queue = shuffle(PROTOS.filter(p => p.sort)); i = 0; score = 0; missed = []; draw(); }
  function draw() {
    state = "ask";
    pane.innerHTML = "";
    pane.appendChild(el(`<div class="prog"><i style="width:${i / queue.length * 100}%"></i></div>`));
    if (i >= queue.length) {
      const r = el(`<div class="panel result"><div class="score">${score}/${queue.length}</div><p>Sorted by the course’s layer grouping.</p><button class="btn primary">Sort again</button>
        ${missed.length ? `<ol class="missed">${missed.map(p => `<li><b>${esc(p.name)}</b> → <span>${p.layer}</span></li>`).join("")}</ol>` : ""}</div>`);
      $("button", r).addEventListener("click", start);
      pane.appendChild(r);
      return;
    }
    const p = queue[i];
    const box = el(`<div class="panel rf">
      <div class="qmeta"><span>${i + 1} / ${queue.length}</span><span>${score} right</span></div>
      <div class="big-t">${esc(p.name)}</div><div class="muted" style="margin:-8px 0 18px">${esc(p.full)}</div>
      <div class="quad">${SORT_LAYERS.map((l, k) => `<button class="btn" data-l="${l}">${l}</button>`).join("")}</div>
      <div class="fbline"></div></div>`);
    $(".quad", box).addEventListener("click", e => {
      const l = e.target.dataset.l; if (!l || state !== "ask") return;
      state = "wait";
      const ok = l === p.layer;
      if (ok) score++; else missed.push(p);
      e.target.classList.add(ok ? "flash-ok" : "flash-no");
      if (!ok) $(`.quad [data-l="${p.layer}"]`, box).classList.add("flash-ok");
      const fb = $(".fbline", box);
      fb.innerHTML = `<p style="margin:0 0 8px;font-size:14.5px">${p.def}</p>${p.note ? `<p class="muted" style="margin:0 0 8px;font-size:13px">${p.note}</p>` : ""}<button class="btn primary">Next →</button>`;
      $("button", fb).addEventListener("click", () => { i++; draw(); });
      $("button", fb).focus({ preventScroll:true });
    });
    pane.appendChild(box);
  }
  start();
}

render();
