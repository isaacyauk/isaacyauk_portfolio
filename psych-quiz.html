{sub:"Freud & Psychodynamic",q:"Fixation in Freudian theory means:",opts:["Successfully resolving the conflict of a psychosexual stage","Progressing unusually rapidly through a developmental stage","Psychological energy remaining caught at a stage due to unresolved conflict","Repressing memories of a particular stage"],c:2,e:"Fixation occurs when a psychosexual stage is not fully resolved (through either excessive deprivation or overindulgence). Libidinal energy remains invested in that stage, influencing adult personality."},
{sub:"Freud & Psychodynamic",q:"In Freud's iceberg metaphor of the mind:",opts:["The tip represents the unconscious (largest, most influential)","The submerged portion represents the unconscious (largest and most powerful)","The conscious and unconscious are equal in size","The preconscious is the submerged, inaccessible portion"],c:1,e:"Freud used the iceberg to show that the unconscious (submerged, huge, inaccessible) drives most behavior, while the conscious mind (the visible tip) is only a small fraction of mental life."},
{sub:"Freud & Psychodynamic",q:"Which stage of Freud's psychosexual development is characterized by latent or dormant sexuality?",opts:["Anal","Phallic","Latency","Genital"],c:2,e:"The latency period (age 6 to puberty) is characterized by reduced sexuality and increased focus on social and academic skills. Freud believed sexual impulses are repressed and redirected during this stage."},
{sub:"Freud & Psychodynamic",q:"The Electra complex, Freud's female parallel to the Oedipus complex, involves:",opts:["Girls' desire for the mother and fear of the father","Girls experiencing 'penis envy' and unconscious desire for the father, with identification with the mother","Girls developing an over-attachment to both parents","Girls rejecting parental influence during the phallic stage"],c:1,e:"Freud proposed girls experience penis envy, develop unconscious desire for the father (who has the desired organ), and resolve the complex through identification with the mother. This aspect of Freud's theory is heavily criticized."},
{sub:"Freud & Psychodynamic",q:"A major criticism of Freud's psychodynamic theory is that:",opts:["It is the only theory that accounts for childhood experience","His concepts like unconscious motivation are empirically unverifiable and therefore unfalsifiable","He placed too much emphasis on learning and environment","The theory has been completely replicated in modern research"],c:1,e:"Falsifiability is a scientific requirement — theories must be testable and potentially disprovable. Many Freudian concepts (like unconscious repression of Oedipal conflicts) cannot be tested with empirical methods, violating scientific standards."},
{sub:"Freud & Psychodynamic",q:"Freud's oral stage occurs during:",opts:["Ages 3-6, centered on the genitals","Ages 1-3, focused on toilet training","Puberty onward, with mature sexuality","Infancy (0-18 months), with feeding as the central focus"],c:3,e:"The oral stage: from birth to ~18 months, all libidinal pleasure is focused on oral activities — sucking, feeding. Fixation at this stage (from overindulgence or deprivation) is associated with dependency, oral habits, or pessimism."},
{sub:"Freud & Psychodynamic",q:"The ego-ideal component of the superego represents:",opts:["A person's drives and instincts","The punishing, guilt-inducing part of the superego","Standards of behavior to aspire to — the 'ideal self'","Reality-based constraints on impulsive behavior"],c:2,e:"The superego has two parts: the conscience (produces guilt for violations) and the ego-ideal (produces pride and shame — positive standards the person strives to meet, internalized from admired figures)."},
{sub:"Freud & Psychodynamic",q:"According to psychodynamic theory, anxiety most commonly arises from:",opts:["Conscious awareness of a difficult problem","Conflicts between the demands of the id, ego, and superego","Poor cognitive appraisal of environmental stressors","Low levels of serotonin in the brain"],c:1,e:"Freudian anxiety arises from intrapsychic conflict — usually the ego feeling threatened by the id's unacceptable impulses or the superego's harsh judgments. Defense mechanisms reduce this anxiety."},
// ── Defense Mechanisms ────────────────────────────────────────────────────
{sub:"Defense Mechanisms",q:"Repression is considered the most fundamental defense mechanism because:",opts:["It is the most consciously controlled defense","It is the basis of all other defenses — it pushes threatening material into the unconscious","It can permanently eliminate unwanted impulses","It is used only in response to major trauma"],c:1,e:"Freud saw repression as the cornerstone defense: pushing anxiety-provoking thoughts, memories, or desires into the unconscious. Other defenses (projection, reaction formation, etc.) rely on repression first."},
{sub:"Defense Mechanisms",q:"Which defense mechanism is illustrated by a person who, when caught cheating, argues they had no choice because 'everyone cheats, and the system is unfair anyway'?",opts:["Projection","Repression","Regression","Rationalization"],c:3,e:"Rationalization: constructing plausible-sounding but false justifications for behaviors driven by unconscious motives. The person isn't consciously lying — they genuinely believe their rationalizations."},
{sub:"Defense Mechanisms",q:"A person who is deeply hostile toward someone but becomes excessively kind and attentive to them is likely using:",opts:["Displacement","Sublimation","Reaction formation","Projection"],c:2,e:"Reaction formation: behaving in the opposite way of the unacceptable unconscious impulse. The excessive, somewhat unnatural quality of the behavior is a clue — genuine kindness is more proportionate."},
{sub:"Defense Mechanisms",q:"Projection as a defense mechanism involves:",opts:["Channeling unacceptable impulses into socially valuable activities","Attributing your own unacceptable thoughts or feelings to another person","Reverting to earlier childlike behaviors under stress","Redirecting negative emotions toward a safer target"],c:1,e:"Projection: 'If I have the feeling but attribute it to you, I don't have to own it.' A jealous person sees jealousy in their partner; an angry person perceives others as hostile."},
{sub:"Defense Mechanisms",q:"A person who takes their work frustrations home and yells at their family instead of their boss is demonstrating:",opts:["Projection","Rationalization","Sublimation","Displacement"],c:3,e:"Displacement: redirecting emotional energy from the true (threatening) target to a safer substitute. The anger is real — only the target changes. The family is a safer outlet than the boss."},
{sub:"Defense Mechanisms",q:"An athlete who channels aggressive impulses into competitive sports, gaining social recognition, is using:",opts:["Repression","Displacement","Sublimation","Regression"],c:2,e:"Sublimation is the healthiest defense — transforming unacceptable impulses into socially valued activities. Freud saw art, science, and athletic competition as sublimated expressions of drives."},
{sub:"Defense Mechanisms",q:"A young adult who starts sucking their thumb and demanding to be fed during a period of extreme stress is showing:",opts:["Projection","Regression","Displacement","Reaction formation"],c:1,e:"Regression: reverting to behaviors characteristic of an earlier developmental stage when current challenges are overwhelming. It is a retreat to a time that felt safer and less demanding."},
{sub:"Defense Mechanisms",q:"Denial differs from repression in that denial involves:",opts:["Pushing memories into the unconscious","Consciously refusing to acknowledge an unpleasant reality","Replacing unacceptable feelings with their opposite","Attributing one's feelings to someone else"],c:1,e:"Denial is a refusal to acknowledge an external painful reality ('My biopsy couldn't be cancer'). Repression pushes internal threatening material into the unconscious. Both reduce anxiety but through different processes."},
{sub:"Defense Mechanisms",q:"Identification as a defense mechanism occurs when a person:",opts:["Blames others for their own unacceptable traits","Adopts the characteristics of an admired or feared person","Redirects impulses into physical activity","Forgets traumatic experiences through repression"],c:1,e:"Identification: incorporating qualities of another (usually a threatening or admired figure) into one's own identity. Freud believed the Oedipus complex is resolved through identification with the same-sex parent."},
{sub:"Defense Mechanisms",q:"Defense mechanisms serve which primary psychological function?",opts:["They permanently resolve intrapsychic conflicts","They help individuals consciously process difficult emotions","They protect the ego from anxiety by distorting or denying aspects of reality","They strengthen the superego's moral control"],c:2,e:"Defense mechanisms are ego-protective: they reduce anxiety by keeping threatening material out of consciousness or distorting reality. Overuse is pathological, but moderate use is normal and adaptive."},
{sub:"Defense Mechanisms",q:"A person who was deeply hurt by a romantic breakup but claims 'I was never really that attached to them anyway' is most likely using:",opts:["Projection","Repression","Denial","Rationalization"],c:3,e:"Rationalization: retroactively explaining the painful event in a way that minimizes hurt ('I didn't want it that much anyway'). The person invents a false belief that protects them from acknowledging the pain."},
{sub:"Defense Mechanisms",q:"Which defense mechanism is healthiest and most socially adaptive?",opts:["Repression","Denial","Reaction formation","Sublimation"],c:3,e:"Sublimation channels unacceptable impulses into socially valued creative or productive activities. Unlike other defenses, it doesn't distort reality — it transforms the energy into something genuinely constructive."},
// ── Neo-Freudians ─────────────────────────────────────────────────────────
{sub:"Neo-Freudians",q:"Jung's concept of the 'collective unconscious' refers to:",opts:["The shared unconscious material created by society's media","Repressed memories shared between therapist and patient","An inherited unconscious containing universal symbols (archetypes) shared across all humans","The cultural stereotypes stored in long-term memory"],c:2,e:"Jung proposed the collective unconscious — a layer of the unconscious beneath the personal unconscious that all humans share, containing archetypes (the Hero, the Shadow, the Anima/Animus) manifested across cultures in myths and dreams."},
{sub:"Neo-Freudians",q:"Archetypes, in Jungian theory, are:",opts:["Defense mechanisms that protect against the shadow","Universal symbols and themes inherited in the collective unconscious","Individual repressed memories unique to each person","Characters developed through childhood experience"],c:1,e:"Archetypes are inherited psychological templates — the Hero, the Trickster, the Shadow (one's dark side), the Anima/Animus (one's opposite-sex inner aspect), the Self. They appear universally across cultures in myths and dreams."},
{sub:"Neo-Freudians",q:"Alfred Adler proposed that human behavior is primarily motivated by:",opts:["Sexual and aggressive drives (as Freud argued)","Feelings of inferiority and the striving for superiority/mastery","The need for unconditional positive regard","Achieving homeostasis and reducing biological drives"],c:1,e:"Adler's individual psychology: we are primarily motivated by our feelings of inferiority (which begin in childhood) and our striving to overcome them and achieve mastery — not sexual drives."},
{sub:"Neo-Freudians",q:"Karen Horney proposed 'womb envy' as a response to Freud's 'penis envy.' This was Horney's way of:",opts:["Agreeing that biological factors determine personality differences between men and women","Arguing that men may envy women's reproductive capacity — challenging Freud's male-centered theory","Proposing that gender differences in personality don't exist","Extending Freud's theory to female development"],c:1,e:"Horney challenged Freud's androcentric (male-centered) view, arguing that if anything, men might envy women's capacity to create life — inverting the power dynamic Freud assumed in his penis envy concept."},
{sub:"Neo-Freudians",q:"Horney's concept of 'basic anxiety' refers to:",opts:["Fear of castration in boys during the phallic stage","A generalized feeling of helplessness and isolation in a potentially hostile world, arising from cold or indifferent parenting","The anxiety created by the conflict between id and superego","Normal anxiety experienced during transitions between Erikson's stages"],c:1,e:"Basic anxiety (Horney): children who don't receive warmth and security develop a generalized anxiety about the world. Ten neurotic needs (for affection, power, independence, etc.) arise as coping strategies for basic anxiety."},
{sub:"Neo-Freudians",q:"Jung introduced the terms introversion and extraversion, defining extraversion as:",opts:["A defensive avoidance of emotional intimacy","Directing psychological energy primarily toward the external world and other people","Excessive repression of the shadow self","Identifying too strongly with the collective unconscious"],c:1,e:"Jung's extraversion: psychological energy (libido, in his broader sense) directed outward toward people and the external world. Introverts direct energy inward toward ideas and inner experience. This became foundational for modern personality theory."},
{sub:"Neo-Freudians",q:"Where did neo-Freudians like Jung, Adler, and Horney most significantly disagree with Freud?",opts:["They rejected all psychodynamic principles","They argued there was no unconscious mind","They deemphasized sexuality and biological drives, emphasizing social, cultural, and cognitive factors instead","They rejected the concept of defense mechanisms entirely"],c:2,e:"Neo-Freudians accepted unconscious motivation but rejected Freud's overemphasis on sex and aggression. They emphasized social relationships, culture, power, self-esteem, and current interpersonal dynamics more than instinctual drives."},
{sub:"Neo-Freudians",q:"Adler's notion of 'birth order' proposed that which position in the family is associated with responsibility, high achievement, and anxiety about losing status?",opts:["Youngest child","Middle child","Only child","Firstborn"],c:3,e:"Adler proposed firstborns — briefly the center of attention until a sibling arrives — develop characteristics of responsibility, leadership, and anxiety about maintaining status. Research finds modest but inconsistent birth order effects."},
{sub:"Neo-Freudians",q:"Jung's 'shadow' archetype represents:",opts:["The female aspect within a male's unconscious","One's persona — the face presented to the world","The dark side of the self — unacknowledged, repressed, 'uncivilized' impulses","The inherited collective wisdom of humanity"],c:2,e:"The shadow is the archetype representing all the unacknowledged, dark, or 'inferior' aspects of the self that we refuse to consciously accept. Integrating the shadow is part of Jungian individuation (self-actualization)."},
{sub:"Neo-Freudians",q:"Which neo-Freudian emphasized that neurosis results from cultural and social factors more than from biological instincts?",opts:["Jung","Adler","Freud","Horney"],c:3,e:"Horney strongly emphasized that neurosis and personality development are shaped by culture, current relationships, and early social environments — not primarily by instinctual sexual and aggressive drives as Freud insisted."},
{sub:"Neo-Freudians",q:"The concept of 'striving for superiority' in Adler's theory does NOT mean:",opts:["Working toward self-improvement and mastery","Compensating for feelings of inferiority","Trying to dominate or defeat others in competition","Overcoming challenges and developing competence"],c:2,e:"Adler's 'striving for superiority' means striving toward self-improvement, excellence, and mastery — not dominance over others. It is fundamentally positive and social, contrasting with Freud's competitive, aggressive drive model."},
{sub:"Neo-Freudians",q:"Jungian 'individuation' refers to:",opts:["The process of separating from the collective unconscious","The integration of all aspects of the self (including shadow, anima/animus) into a unified, coherent whole","The development of introversion over time","The reinforcement of archetypes through cultural myths"],c:1,e:"Individuation is Jung's equivalent of self-actualization — the lifelong process of integrating unconscious aspects (shadow, anima/animus, persona) into a balanced, unified self (the archetype of wholeness)."},
// ── Humanistic Theories ───────────────────────────────────────────────────
{sub:"Humanistic Theories",q:"Maslow's hierarchy of needs proposes that __________ needs must be satisfied before higher-level needs become motivating.",opts:["Social","Lower-level (physiological, safety)","Esteem","Cognitive"],c:1,e:"Maslow's hierarchy is sequential: physiological → safety → belonging → esteem → self-actualization. Lower-tier needs must be met before higher-level growth needs become motivating forces."},
{sub:"Humanistic Theories",q:"Self-actualization, at the top of Maslow's hierarchy, refers to:",opts:["High social status and achievement recognition","Fulfilling one's unique potential and becoming the most that one can be","Having close, supportive relationships","Freedom from anxiety and mental illness"],c:1,e:"Self-actualization: the drive to realize one's fullest potential, express one's true nature, pursue meaningful goals, and achieve peak experiences — the ultimate expression of psychological health."},
{sub:"Humanistic Theories",q:"Rogers' concept of 'unconditional positive regard' refers to:",opts:["Accepting someone fully regardless of their behavior — without attaching conditions to love and acceptance","Providing exclusively positive feedback to avoid criticism","Allowing people to behave however they want without consequences","Believing that all people are basically good regardless of their actions"],c:0,e:"Unconditional positive regard: accepting and valuing a person unconditionally — not contingent on their behavior or beliefs. Rogers saw this as essential in therapy and healthy development, preventing distorted self-concepts."},
{sub:"Humanistic Theories",q:"According to Rogers, 'conditions of worth' develop when:",opts:["Parents provide too much unconditional positive regard","A child receives love and acceptance only when meeting others' standards — 'I love you IF you behave'","A person becomes self-actualized and sets high standards for themselves","A person has an accurate self-concept that matches their ideal self"],c:1,e:"Conditions of worth: when positive regard is conditional, we distort our self-concept to match what earns acceptance rather than what we truly experience. This creates incongruence and anxiety."},
{sub:"Humanistic Theories",q:"In Rogers' theory, psychological health results from:",opts:["Successfully resolving psychosexual conflicts","Achieving self-actualization through peak experiences","Congruence — when self-concept matches actual experience, without denial or distortion","A well-developed superego controlling id impulses"],c:2,e:"Congruence: when self-concept accurately reflects actual experience (thoughts, feelings, behaviors), the person is psychologically healthy — open to experience and fully functioning."},
{sub:"Humanistic Theories",q:"Humanistic psychology is sometimes called the 'third force' in psychology because it emerged as an alternative to:",opts:["Structuralism and functionalism","Psychoanalysis and behaviorism","Cognitive and biological psychology","Social and evolutionary psychology"],c:1,e:"Humanistic psychology (1950s-60s) explicitly positioned itself as a third way — rejecting psychoanalysis's pessimistic determinism AND behaviorism's mechanical view, emphasizing conscious experience, free will, and human potential."},
{sub:"Humanistic Theories",q:"According to Rogers, an 'incongruent' person experiences:",opts:["Too much positive self-regard","Excessive self-actualization tendency","Anxiety from the gap between self-concept and actual experience","Difficulty forming any self-concept"],c:2,e:"Incongruence: the gap between who we think we are (self-concept) and what we actually experience. Defending against acknowledging this gap creates anxiety, defensiveness, and limits growth."},
{sub:"Humanistic Theories",q:"Maslow described 'peak experiences' as:",opts:["The highest levels of physical athletic performance","Moments of profound happiness, transcendence, and intense well-being associated with self-actualization","Periods of extreme stress that lead to personal growth","The resolution of long-standing psychological conflicts"],c:1,e:"Peak experiences are transcendent moments of intense joy, wonder, and meaning — often described as mystical, oceanic, or awe-inspiring. Maslow found they were especially common among self-actualizing people."},
{sub:"Humanistic Theories",q:"A key criticism of Maslow's hierarchy is that:",opts:["It underestimates the role of physiological needs","The hierarchy may be culturally biased — some cultures prioritize belonging over safety, or esteem differently","It places too much emphasis on unconscious motivation","The model has too many stages to be practical"],c:1,e:"Cross-cultural research shows the order is not universal. Collectivist cultures may prioritize belonging over individual esteem. Even Maslow acknowledged that hierarchy can be flexible — some people pursue art while hungry."},
{sub:"Humanistic Theories",q:"Rogers' 'fully functioning person' is characterized by:",opts:["Perfect achievement of all life goals","Absence of any negative emotional experiences","Openness to experience, living in the present moment, and trusting one's own feelings","Detachment from social relationships to pursue individual growth"],c:2,e:"The fully functioning person (Rogers' ideal of psychological health) is open to experience, lives in the present, trusts organismic valuing, has freedom of choice, and is creative — not perfect or free of pain, but growing."},
{sub:"Humanistic Theories",q:"The humanistic perspective's greatest contribution to psychology has been its emphasis on:",opts:["Biological bases of personality","Unconscious determinants of behavior","Human dignity, free will, conscious experience, and the drive toward growth","Rigorous scientific methodology"],c:2,e:"Humanistic psychology shifted focus toward the positive — human potential, meaning, dignity, and subjective experience. It influenced therapy (client-centered), education, and positive psychology, though it is sometimes criticized for lacking empirical rigor."},
// ── Trait Theories & Big Five ─────────────────────────────────────────────
{sub:"Trait Theories & Big Five",q:"Which Big Five trait is the best single predictor of job performance across most occupations?",opts:["Openness to experience","Extraversion","Agreeableness","Conscientiousness"],c:3,e:"Conscientiousness — being organized, reliable, disciplined, and goal-directed — is the most consistent predictor of job performance, academic achievement, and health behaviors across cultures and occupations."},
{sub:"Trait Theories & Big Five",q:"A person who scores HIGH on Neuroticism would most likely be characterized as:",opts:["Creative, curious, and open to new ideas","Cooperative, warm, and trusting","Emotionally unstable, anxious, and prone to negative emotions","Quiet, reflective, and energized by solitude"],c:2,e:"High Neuroticism = emotional instability, anxiety, moodiness, and tendency toward negative emotions (depression, hostility, self-consciousness). Low Neuroticism = emotional stability and resilience."},
{sub:"Trait Theories & Big Five",q:"Introversion (low Extraversion in the Big Five) is best described as:",opts:["Shyness and social anxiety","Being antisocial or unfriendly","Preferring solitude and quieter environments; being energized by alone time","A clinical condition requiring treatment"],c:2,e:"Introversion (low extraversion) is a normal personality dimension — introverts prefer solitude, find large social gatherings draining, and are energized by quiet reflection. It is NOT shyness (fear of social situations) or misanthropy."},
{sub:"Trait Theories & Big Five",q:"A person who scores LOW on Agreeableness would most likely be described as:",opts:["Disorganized and impulsive","Emotionally reactive and anxious","Competitive, suspicious, or manipulative","Conventional and resistant to change"],c:2,e:"Low agreeableness: skeptical, competitive, critical, and willing to use others for personal gain. Not necessarily 'bad' — in negotiations or leadership, some disagreeableness can be adaptive."},
{sub:"Trait Theories & Big Five",q:"Which Big Five trait involves imagination, artistic interest, curiosity, and preference for variety?",opts:["Conscientiousness","Neuroticism","Agreeableness","Openness to experience"],c:3,e:"Openness to experience: high scorers are creative, curious, aesthetically sensitive, and open to novel ideas and experiences. Low scorers prefer familiarity, routine, and practical/conventional approaches."},
{sub:"Trait Theories & Big Five",q:"Gordon Allport distinguished 'cardinal traits' from other traits. A cardinal trait is:",opts:["One of 5-10 traits that characterize a person's general personality","A trait shared by all people in a culture","A single, dominant trait that pervades and organizes almost all of a person's behavior","A situational preference like food choice"],c:2,e:"Cardinal traits are so dominant they define an entire personality — relatively rare. Allport used terms like 'Machiavellianism' or 'narcissism' as examples. Most people are better described by central traits."},
{sub:"Trait Theories & Big Five",q:"The Big Five personality model (OCEAN) was developed using which statistical technique?",opts:["Clinical case study analysis","Psychoanalytic free association","Factor analysis — finding clusters of correlated traits","Signal detection theory"],c:2,e:"Factor analysis identifies underlying dimensions (factors) by finding clusters of items that correlate with each other. Applied to personality ratings, this consistently produces the five broad factors of the OCEAN model."},
{sub:"Trait Theories & Big Five",q:"A highly extraverted person is most likely to:",opts:["Prefer working alone and have a small close-knit social circle","Thrive in social situations, seek out stimulation, and be assertive and talkative","Show high emotional reactivity to negative events","Score high on openness and prefer novel intellectual experiences"],c:1,e:"High extraversion: sociable, assertive, talkative, energized by social interaction, and stimulation-seeking. Extraverts generally prefer lively, action-oriented environments."},
{sub:"Trait Theories & Big Five",q:"Research on the heritability of Big Five traits consistently finds:",opts:["Traits are entirely determined by genetics with no environmental influence","Traits are moderate to highly heritable (~30-60%) with both genetic and environmental contributions","Environment accounts for virtually all personality variation","Only neuroticism and extraversion have heritable components"],c:1,e:"Twin and adoption studies show Big Five traits are moderately to highly heritable (30-60%). But heritability is not 100%, and environment (especially non-shared) contributes substantially to individual differences."},
{sub:"Trait Theories & Big Five",q:"Eysenck's personality model proposed that personality could be described by three major dimensions. Which combination is correct?",opts:["Openness, conscientiousness, and neuroticism","Extraversion, neuroticism, and psychoticism","Introversion, agreeableness, and dominance","Emotional stability, sociability, and impulse control"],c:1,e:"Eysenck's Gigantic Three: Extraversion-Introversion, Neuroticism-Stability (emotional reactivity), and Psychoticism (tough-minded, antisocial vs. empathetic, socialized). These influenced the development of the Big Five."},
{sub:"Trait Theories & Big Five",q:"Big Five personality traits are considered 'relatively stable' across adulthood, meaning:",opts:["They never change after age 30","They are completely fixed at birth","General patterns persist while some gradual change occurs (conscientiousness and agreeableness tend to increase with age)","They change dramatically with each major life event"],c:2,e:"Traits are relatively stable — especially after age 30 — but show systematic change: conscientiousness and agreeableness tend to increase (the 'maturity principle'), while neuroticism tends to decrease, across adulthood."},
{sub:"Trait Theories & Big Five",q:"A person who scores HIGH on Openness to Experience would most likely:",opts:["Prefer familiar routines and established procedures","Score high on conscientiousness as well","Enjoy exploring new ideas, appreciate art, and seek out novel experiences","Show high emotional stability and resilience to stress"],c:2,e:"High Openness: creative, imaginative, intellectually curious, aesthetically sensitive, and open to trying new things and unconventional ideas. They tend to excel in creative fields and value intellectual exploration."},
// ── Social-Cognitive & Behavioral ────────────────────────────────────────
{sub:"Social-Cognitive & Behavioral",q:"Bandura's concept of 'reciprocal determinism' proposes that:",opts:["Environment alone determines behavior","Behavior, personal factors (cognition), and environment mutually influence one another in continuous interaction","Personal traits determine how people interpret their environments","Consequences alone shape future behavior"],c:1,e:"Reciprocal determinism: person (P), behavior (B), and environment (E) continuously influence each other in a triadic, bidirectional relationship — not a one-way causal chain."},
{sub:"Social-Cognitive & Behavioral",q:"Self-efficacy, as defined by Bandura, refers to:",opts:["One's general intelligence or ability","Belief in one's capacity to organize and execute behaviors required to produce specific outcomes","The tendency to attribute outcomes to luck or external factors","Confidence in one's social and interpersonal skills only"],c:1,e:"Self-efficacy is situation-specific: it's the belief that you CAN do a specific task. High self-efficacy predicts greater effort, persistence, and resilience. It's not general confidence — you can have high SE in cooking but low SE in public speaking."},
{sub:"Social-Cognitive & Behavioral",q:"Which of the following would be MOST likely to increase someone's self-efficacy?",opts:["Watching a very skilled expert perform the task flawlessly","Experiencing success on similar tasks through personal mastery (mastery experiences)","Reading about the importance of the task","Being told by a stranger that you can do it"],c:1,e:"Mastery experiences — actually succeeding at related tasks — are the most powerful source of self-efficacy. Vicarious learning (watching similar others) and verbal persuasion also help, but personal success is most impactful."},
{sub:"Social-Cognitive & Behavioral",q:"Mischel's 'situationism' argued that:",opts:["Behavior is primarily driven by stable internal personality traits","Situational factors are more important determinants of behavior than internal traits","Both traits and situations contribute equally to behavior","Personality doesn't exist — only situational responses exist"],c:1,e:"Mischel reviewed personality research and found behavior was often more consistent within situations than across situations — challenging trait theory. He argued that situational variables predict behavior better than traits."},
{sub:"Social-Cognitive & Behavioral",q:"The current scientific consensus on the person-situation debate is best described as:",opts:["Situationism: behavior is entirely determined by the environment","Trait theory: behavior is entirely determined by internal personality traits","Interactionism: both personal traits AND situational factors influence behavior","Psychodynamic theory: unconscious factors override both traits and situations"],c:2,e:"Interactionism is the consensus: personality traits predict behavior significantly, especially when aggregated across many situations, but situational demands also powerfully shape behavior. Person × situation interactions matter most."},
{sub:"Social-Cognitive & Behavioral",q:"Rotter's locus of control refers to:",opts:["The brain's control centers for personality regulation","Beliefs about whether outcomes are determined by one's own actions (internal) or by luck/fate/others (external)","The degree to which a person can resist peer influence","A measure of self-regulation and impulse control"],c:1,e:"Internal locus of control: 'my actions determine what happens to me.' External locus: 'luck, fate, or powerful others control outcomes.' Internal LOC is associated with better health behaviors, academic achievement, and lower depression."},
{sub:"Social-Cognitive & Behavioral",q:"Learned helplessness (Seligman) refers to:",opts:["Difficulty learning new skills due to cognitive impairment","Giving up and becoming passive after repeated experiences of uncontrollable negative outcomes","A child's inability to learn without parental scaffolding","The tendency to rely on habits rather than active problem-solving"],c:1,e:"Learned helplessness: after repeated inescapable negative events, organisms stop trying even when escape/control becomes possible. Seligman's animal model showed direct parallels to human depression."},
{sub:"Social-Cognitive & Behavioral",q:"An individual who attributes failing an exam to 'bad luck' and passing to 'an easy test' most likely has:",opts:["High self-efficacy","Internal locus of control","External locus of control","High conscientiousness"],c:2,e:"Attributing failures to external causes (luck, test difficulty) rather than internal effort suggests an external locus of control — a belief that outcomes are determined by forces outside the self."},
{sub:"Social-Cognitive & Behavioral",q:"Bandura distinguished social-cognitive theory from radical behaviorism by emphasizing:",opts:["The role of unconscious motivation","The role of cognition — what people think, believe, and expect — in determining behavior","Biological drives as primary motivators","The importance of punishment over reinforcement"],c:1,e:"Social-cognitive theory: cognitive factors (beliefs, expectancies, self-efficacy, observational learning) mediate the relationship between environment and behavior — moving beyond simple S-R (stimulus-response) behaviorism."},
{sub:"Social-Cognitive & Behavioral",q:"Research on learned helplessness found that animals who had previously experienced inescapable shocks later failed to escape when escape became possible. This supports which concept?",opts:["Self-efficacy — they lacked confidence","External locus of control — they attributed outcomes to external factors","Learned helplessness — prior uncontrollability produced passivity even in a controllable situation","Reciprocal determinism — their environment had shaped their learning"],c:2,e:"Seligman and colleagues showed dogs who couldn't escape shocks later didn't try to escape even when they could — they had learned that their behavior had no effect. This directly models human depression's cognitive features."},
{sub:"Social-Cognitive & Behavioral",q:"A student who says 'I'm not naturally smart at math, so there's no point in studying' is demonstrating:",opts:["High academic self-efficacy","An internal locus of control","Low academic self-efficacy for math","Learned industriousness"],c:2,e:"Low self-efficacy for math: believing you cannot successfully perform math tasks predicts less effort, lower persistence, and ultimately worse performance — a self-fulfilling prophecy that Bandura extensively studied."},
// ── Personality Assessment ────────────────────────────────────────────────
{sub:"Personality Assessment",q:"The Rorschach Inkblot Test is classified as a projective test because:",opts:["It measures unconscious motivations through objective scoring alone","Ambiguous stimuli allow people to 'project' unconscious feelings and thoughts onto the material","It provides highly reliable and valid personality profiles","It measures all five Big Five dimensions simultaneously"],c:1,e:"Projective tests present ambiguous stimuli, allowing unconscious material to surface in responses. The Rorschach requires people to describe what they see in inkblots — theoretically revealing unconscious content."},
{sub:"Personality Assessment",q:"A key limitation of projective tests like the Rorschach is:",opts:["They take too long to administer","They only measure one personality dimension at a time","Variable interpretation across clinicians raises questions about reliability and validity","They are only valid for populations without formal education"],c:2,e:"Projective tests have reliability and validity concerns — different clinicians may interpret the same responses differently (reliability), and the link between responses and actual personality/psychopathology is not always strong (validity)."},
{sub:"Personality Assessment",q:"The MMPI (Minnesota Multiphasic Personality Inventory) is considered an objective personality test because:",opts:["It is free from all cultural bias","It uses structured items with fixed response formats and standardized scoring norms","Clinicians interpret responses based on subjective judgment","It measures only conscious personality traits"],c:1,e:"Objective tests use standardized, structured formats (true/false, Likert scales) with established norms for comparison. Scoring is algorithmic, not reliant on clinician interpretation — contrasting with projective tests."},
{sub:"Personality Assessment",q:"Validity scales in the MMPI are designed to:",opts:["Measure personality traits more accurately than standard scales","Detect response biases — like faking good, faking bad, or inconsistent responding","Ensure the test has equal validity across all demographic groups","Replace the clinical scales for diagnostic purposes"],c:1,e:"MMPI validity scales (L = 'lying'/faking good, F = random/faking bad, K = subtle defensiveness) detect invalid response patterns that would compromise the clinical scale scores' accuracy."},
{sub:"Personality Assessment",q:"The Thematic Apperception Test (TAT) requires participants to:",opts:["Sort inkblots into categories based on emotional response","Complete a series of true/false personality statements","Tell stories about ambiguous pictures, revealing underlying motivations and themes","Rate themselves on a series of personality adjective scales"],c:2,e:"In the TAT, participants tell stories about ambiguous pictures of people. Story themes — achievement, affiliation, power, aggression — presumably reflect the person's own motives and personality dynamics."},
{sub:"Personality Assessment",q:"Social desirability bias in self-report personality tests refers to:",opts:["The tendency for tests to measure social skills better than other traits","The tendency for respondents to portray themselves in an unrealistically positive light","The influence of cultural background on interpretation of test items","The bias introduced by having clinicians score test responses"],c:1,e:"Social desirability: people tend to rate themselves according to what they believe is socially acceptable rather than what is truly accurate, inflating scores on valued traits and deflating scores on stigmatized traits."},
{sub:"Personality Assessment",q:"Test-retest reliability in personality assessment refers to:",opts:["Whether the test measures what it claims to measure","Consistency of scores when the same test is administered to the same person on different occasions","Whether the test is appropriate for people from different cultural backgrounds","Whether different clinicians score the test the same way"],c:1,e:"Test-retest reliability assesses temporal consistency. Since personality is assumed to be relatively stable, a reliable personality test should produce similar scores if administered again within a reasonable time period."},
{sub:"Personality Assessment",q:"The NEO-PI is a self-report personality inventory specifically designed to measure:",opts:["Psychopathology and clinical conditions","Intelligence and cognitive abilities","The Big Five personality traits (Openness, Conscientiousness, Extraversion, Agreeableness, Neuroticism)","Unconscious motivations through projective techniques"],c:2,e:"The NEO-PI (Neuroticism-Extraversion-Openness Personality Inventory, now extended to include Agreeableness and Conscientiousness) is the standard research tool for measuring Big Five traits."},
{sub:"Personality Assessment",q:"A potential concern about using personality tests developed in Western cultures with non-Western populations is:",opts:["Non-Western individuals score lower on conscientiousness","The Big Five structure may not be universal; translations may alter meaning; and norms may not apply","Self-report methods are always less valid than projective methods","Western cultures have better standardized assessments"],c:1,e:"Cultural validity is a concern: construct meanings may differ across cultures, direct translation may not capture equivalent meanings, and normative data from Western populations may not apply to other cultural groups."},
{sub:"Personality Assessment",q:"Projective tests assume that:",opts:["Personality can be accurately measured through self-report alone","Unconscious material surfaces when people respond to ambiguous stimuli","Behavior is more important than inner experience for personality assessment","All aspects of personality are consciously accessible"],c:1,e:"Projective tests are built on psychodynamic assumptions: the unconscious contains important personality-relevant material that can only be accessed indirectly through ambiguous stimuli that bypass conscious defenses."},
{sub:"Personality Assessment",q:"Inter-rater reliability in personality assessment refers to:",opts:["Consistency of scores over time","Whether different observers/scorers produce similar scores for the same individual","Whether the test measures what it claims to measure","Consistency across different versions of the same test"],c:1,e:"Inter-rater reliability measures the consistency between different people scoring the same test — crucial for projective tests, where subjective interpretation is involved. Low inter-rater reliability limits a test's usefulness."},
{sub:"Personality Assessment",q:"Which of the following best summarizes the advantage of objective (self-report) personality tests over projective tests?",opts:["They access unconscious material that projective tests miss","They have higher reliability and validity, are more efficient, and allow statistical comparison to normative data","They are better at assessing personality in clinical populations","They eliminate all forms of bias in personality measurement"],c:1,e:"Objective tests like the MMPI and NEO-PI have well-established psychometric properties (reliability and validity), efficient administration, and allow comparison to large normative samples — advantages projective tests generally lack."}
] // END PERSONALITY
}; // END QUESTION_BANK

// ── CONFIG ─────────────────────────────────────────────────────────
const TOPIC_META = {
  biopsychology: { label:'Biopsychology', color:'#a78bfa' },
  sensation:     { label:'Sensation & Perception', color:'#34d399' },
  lifespan:      { label:'Lifespan Development', color:'#fb923c' },
  personality:   { label:'Personality', color:'#f472b6' }
};

const ALL_TOPICS = Object.keys(TOPIC_META);

// ── STATE ───────────────────────────────────────────────────────────
let currentTopic = 'all';
let correct = 0, wrong = 0, total = 0;
let answered = false;

// Per-topic shuffled queues (non-repeating until exhausted)
const queues = {};
ALL_TOPICS.forEach(t => {
  queues[t] = shuffle([...QUESTION_BANK[t]]);
});
const queueIndices = { biopsychology:0, sensation:0, lifespan:0, personality:0 };

// For 'all' mode: interleave topics
let allCursor = 0;

function shuffle(arr) {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getNextQuestion(topicKey) {
  const q = queues[topicKey];
  let idx = queueIndices[topicKey];
  if (idx >= q.length) {
    // Exhausted — reshuffle and restart
    queues[topicKey] = shuffle([...QUESTION_BANK[topicKey]]);
    queueIndices[topicKey] = 0;
    idx = 0;
  }
  const item = queues[topicKey][queueIndices[topicKey]];
  queueIndices[topicKey]++;
  return { item, topicKey };
}

function pickTopic() {
  if (currentTopic !== 'all') return currentTopic;
  const t = ALL_TOPICS[allCursor % ALL_TOPICS.length];
  allCursor++;
  return t;
}

// ── UI HELPERS ──────────────────────────────────────────────────────
function setTopic(t) {
  currentTopic = t;
  document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-'+t).classList.add('active');
  nextQ();
}

function toggleHistory() {
  const p = document.getElementById('hist-panel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
}

function updateStats() {
  document.getElementById('sc').textContent = correct;
  document.getElementById('sw').textContent = wrong;
  document.getElementById('st').textContent = total;
  const pct = total > 0 ? (correct/total)*100 : 0;
  document.getElementById('prog').style.width = pct + '%';
}

function addHistory(q, topicLabel, sub, ok) {
  const list = document.getElementById('hist-list');
  const d = document.createElement('div');
  d.className = 'h-item';
  d.innerHTML = `<div class="h-dot ${ok?'c':'w'}"></div><div>
    <div class="h-q">${q.substring(0,88)}${q.length>88?'…':''}</div>
    <div class="h-tag">${topicLabel} › ${sub}</div></div>`;
  if (list.firstChild) list.insertBefore(d, list.firstChild);
  else list.appendChild(d);
}

// ── QUESTION RENDERING ──────────────────────────────────────────────
function nextQ() {
  answered = false;
  const topicKey = pickTopic();
  const { item } = getNextQuestion(topicKey);
  const meta = TOPIC_META[topicKey];

  total++;
  updateStats();

  // Subtopic bar
  document.getElementById('sub-name').textContent = item.sub;
  const remaining = QUESTION_BANK[topicKey].length - queueIndices[topicKey];
  document.getElementById('sub-count').textContent = `${queueIndices[topicKey]}/${QUESTION_BANK[topicKey].length} done`;

  const labels = ['A','B','C','D'];
  const optsHTML = item.opts.map((o,i) => `
    <button class="opt-btn" onclick="answer(${i},${item.c})" id="o${i}">
      <span class="opt-lbl">${labels[i]}</span><span>${o}</span>
    </button>`).join('');

  document.getElementById('qa').innerHTML = `
    <div class="question-card">
      <div class="q-meta">
        <span class="q-num">Q${total}</span>
        <span class="q-tag" style="background:${meta.color}22;color:${meta.color}">${meta.label}</span>
        <span class="q-sub-tag">${item.sub}</span>
      </div>
      <div class="q-text">${item.q}</div>
      <div class="options">${optsHTML}</div>
      <div id="fb"></div>
      <button class="next-btn" id="nxt" onclick="nextQ()" disabled>Next Question →</button>
    </div>`;

  window._item = item;
  window._meta = meta;
}

function answer(sel, corr) {
  if (answered) return;
  answered = true;
  const labels = ['A','B','C','D'];
  const ok = sel === corr;
  if (ok) correct++; else wrong++;
  updateStats();
  addHistory(window._item.q, window._meta.label, window._item.sub, ok);

  for (let i=0;i<4;i++) {
    const b = document.getElementById('o'+i);
    b.disabled = true;
    if (i===corr) b.classList.add(ok && i===sel ? 'correct' : 'reveal');
    if (i===sel && !ok) b.classList.add('wrong');
  }

  document.getElementById('fb').innerHTML = `
    <div class="feedback ${ok?'cf':'wf'}">
      ${ok
        ? `<strong>✓ Correct!</strong> ${window._item.e}`
        : `<strong>✗ Incorrect.</strong> The correct answer was <strong>${labels[corr]}: ${window._item.opts[corr]}</strong>. ${window._item.e}`
      }
    </div>`;

  document.getElementById('nxt').disabled = false;
}

// Start
nextQ();
</script>
</body>
</html>
