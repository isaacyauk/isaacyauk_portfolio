<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psych 100 @ MSU - Practice Exam 2</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161921;
    --surface2: #1e2230;
    --border: #2a2f42;
    --accent: #7c6af7;
    --accent2: #c084fc;
    --green: #4ade80;
    --red: #f87171;
    --text: #e8eaf6;
    --muted: #7c8099;
    --gold: #f9c74f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; line-height: 1.6; }

  header {
    background: linear-gradient(135deg, #161921 0%, #1a1040 100%);
    border-bottom: 1px solid var(--border);
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.35rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-right { display: flex; align-items: center; gap: 1.5rem; }

  .score-badge { display: flex; gap: 1.25rem; align-items: center; }
  .stat { text-align: center; }
  .stat-num { font-size: 1.35rem; font-weight: 700; font-family: 'Playfair Display', serif; }
  .stat-num.green { color: var(--green); }
  .stat-num.red { color: var(--red); }
  .stat-num.gold { color: var(--gold); }
  .stat-label { color: var(--muted); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; }

  .history-toggle {
    color: var(--muted); background: none; border: 1px solid var(--border);
    padding: 0.45rem 0.9rem; border-radius: 8px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 0.78rem; font-weight: 500; transition: all 0.2s;
  }
  .history-toggle:hover { border-color: var(--accent); color: var(--text); }

  main { max-width: 860px; margin: 0 auto; padding: 1.75rem 1.5rem 4rem; }

  /* Topic selector */
  .topic-section { margin-bottom: 1.75rem; }
  .topic-section h2 {
    font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--muted);
    margin-bottom: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 400;
  }
  .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 0.65rem; }

  .topic-btn {
    background: var(--surface); border: 2px solid var(--border);
    color: var(--text); padding: 0.85rem 1rem; border-radius: 12px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500;
    text-align: left; transition: all 0.2s;
  }
  .topic-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .topic-btn.active { border-color: var(--accent); background: rgba(124,106,247,0.15); }
  .topic-icon { font-size: 1.2rem; display: block; margin-bottom: 0.25rem; }
  .topic-name { display: block; font-weight: 600; }
  .topic-sub { display: block; color: var(--muted); font-size: 0.72rem; margin-top: 0.1rem; }

  /* Subtopic indicator */
  .subtopic-bar {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 0.75rem 1.1rem; margin-bottom: 1.4rem;
    display: flex; align-items: center; gap: 0.65rem; font-size: 0.78rem; flex-wrap: wrap;
  }
  .sub-label { color: var(--muted); flex-shrink: 0; }
  .sub-name { color: var(--accent2); font-weight: 600; flex: 1; min-width: 120px; }
  .sub-count { color: var(--muted); font-size: 0.72rem; white-space: nowrap; }

  /* Progress bar */
  .progress-bar { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 1.75rem; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width 0.4s ease; }

  /* Question card */
  .question-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 1.9rem 1.9rem 1.5rem; margin-bottom: 1.5rem;
    position: relative; overflow: hidden; animation: slideIn 0.28s ease;
  }
  @keyframes slideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .question-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .q-meta { display:flex; align-items:center; gap:0.55rem; margin-bottom:1.1rem; flex-wrap:wrap; }
  .q-num { font-size:0.72rem; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:0.1em; }
  .q-tag {
    font-size:0.68rem; padding:0.18rem 0.55rem; border-radius:20px; font-weight:600; letter-spacing:0.04em;
  }
  .q-sub-tag { font-size:0.68rem; background:rgba(255,255,255,0.05); color:var(--muted); padding:0.18rem 0.55rem; border-radius:20px; }

  .q-text { font-size:1.08rem; font-weight:500; line-height:1.65; margin-bottom:1.6rem; }

  .options { display:flex; flex-direction:column; gap:0.6rem; }
  .opt-btn {
    background:var(--surface2); border:2px solid var(--border); color:var(--text);
    padding:0.85rem 1.2rem; border-radius:10px; cursor:pointer;
    font-family:'DM Sans',sans-serif; font-size:0.93rem; font-weight:400;
    text-align:left; transition:all 0.17s; display:flex; align-items:flex-start; gap:0.7rem; line-height:1.5;
  }
  .opt-btn:hover:not(:disabled) { border-color:var(--accent); background:rgba(124,106,247,0.08); transform:translateX(3px); }
  .opt-btn:disabled { cursor:default; }
  .opt-btn.correct { border-color:var(--green); background:rgba(74,222,128,0.1); color:var(--green); }
  .opt-btn.wrong { border-color:var(--red); background:rgba(248,113,113,0.1); color:var(--red); }
  .opt-btn.reveal { border-color:var(--green); background:rgba(74,222,128,0.06); opacity:0.7; }
  .opt-lbl { font-weight:700; font-size:0.82rem; min-width:1.4rem; color:var(--muted); flex-shrink:0; transition:color 0.17s; }
  .opt-btn.correct .opt-lbl { color:var(--green); }
  .opt-btn.wrong .opt-lbl { color:var(--red); }

  .feedback {
    margin-top:1.1rem; padding:0.9rem 1.1rem; border-radius:10px;
    font-size:0.88rem; line-height:1.6; animation:fadeIn 0.22s ease;
  }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  .feedback.cf { background:rgba(74,222,128,0.08); border:1px solid rgba(74,222,128,0.3); color:#a7f3d0; }
  .feedback.wf { background:rgba(248,113,113,0.08); border:1px solid rgba(248,113,113,0.3); color:#fecaca; }
  .feedback strong { font-weight:700; }

  .next-btn {
    display:flex; align-items:center; gap:0.45rem;
    background:linear-gradient(135deg, var(--accent), var(--accent2)); color:white; border:none;
    padding:0.85rem 1.65rem; border-radius:10px; cursor:pointer;
    font-family:'DM Sans',sans-serif; font-size:0.93rem; font-weight:600;
    margin-top:1.1rem; transition:all 0.2s; box-shadow:0 4px 18px rgba(124,106,247,0.3);
  }
  .next-btn:hover { transform:translateY(-2px); box-shadow:0 6px 26px rgba(124,106,247,0.4); }
  .next-btn:disabled { opacity:0.38; cursor:not-allowed; transform:none; box-shadow:none; }

  /* History panel */
  .history-panel {
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:1.4rem; margin-bottom:1.4rem; max-height:320px; overflow-y:auto;
  }
  .history-panel h3 {
    font-family:'Playfair Display',serif; font-size:0.9rem; margin-bottom:0.9rem;
    color:var(--muted); text-transform:uppercase; letter-spacing:0.08em;
  }
  .h-item { display:flex; align-items:flex-start; gap:0.7rem; padding:0.55rem 0; border-bottom:1px solid var(--border); font-size:0.82rem; line-height:1.4; }
  .h-item:last-child { border-bottom:none; }
  .h-dot { width:7px; height:7px; border-radius:50%; margin-top:0.3rem; flex-shrink:0; }
  .h-dot.c { background:var(--green); }
  .h-dot.w { background:var(--red); }
  .h-q { color:var(--text); }
  .h-tag { color:var(--muted); font-size:0.72rem; }

  /* Error */
  .err-card { background:rgba(248,113,113,0.08); border:1px solid rgba(248,113,113,0.3); border-radius:12px; padding:1.4rem; color:var(--red); font-size:0.88rem; }

  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  @media(max-width:600px){
    header{padding:1rem;}
    .score-badge{gap:0.9rem;}
    .stat-num{font-size:1.1rem;}
    main{padding:1rem 1rem 3rem;}
    .question-card{padding:1.4rem 1.1rem 1.1rem;}
    .topic-grid{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="logo">Psych Exam 2 ✦</div>
  <div class="header-right">
    <div class="score-badge">
      <div class="stat">
        <div class="stat-num green" id="sc">0</div>
        <div class="stat-label">Correct</div>
      </div>
      <div class="stat">
        <div class="stat-num red" id="sw">0</div>
        <div class="stat-label">Wrong</div>
      </div>
      <div class="stat">
        <div class="stat-num gold" id="st">0</div>
        <div class="stat-label">Total</div>
      </div>
    </div>
    <button class="history-toggle" onclick="toggleHistory()">History</button>
  </div>
</header>

<main>
  <div class="history-panel" id="hist-panel" style="display:none">
    <h3>Question History</h3>
    <div id="hist-list"></div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>

  <div class="topic-section">
    <h2>Choose a Topic</h2>
    <div class="topic-grid">
      <button class="topic-btn active" onclick="setTopic('all')" id="btn-all">
        <span class="topic-icon">🧠</span>
        <span class="topic-name">All Topics</span>
        <span class="topic-sub">Random mix</span>
      </button>
      <button class="topic-btn" onclick="setTopic('biopsychology')" id="btn-biopsychology">
        <span class="topic-icon">🔬</span>
        <span class="topic-name">Biopsychology</span>
        <span class="topic-sub">Ch. 3 · 101 questions</span>
      </button>
      <button class="topic-btn" onclick="setTopic('sensation')" id="btn-sensation">
        <span class="topic-icon">👁️</span>
        <span class="topic-name">Sensation &amp; Perception</span>
        <span class="topic-sub">Ch. 5 · 91 questions</span>
      </button>
      <button class="topic-btn" onclick="setTopic('lifespan')" id="btn-lifespan">
        <span class="topic-icon">🌱</span>
        <span class="topic-name">Lifespan Dev.</span>
        <span class="topic-sub">Ch. 9 · 92 questions</span>
      </button>
      <button class="topic-btn" onclick="setTopic('personality')" id="btn-personality">
        <span class="topic-icon">🎭</span>
        <span class="topic-name">Personality</span>
        <span class="topic-sub">Ch. 11 · 90 questions</span>
      </button>
    </div>
  </div>

  <div class="subtopic-bar" id="sub-bar">
    <span class="sub-label">Subtopic:</span>
    <span class="sub-name" id="sub-name">—</span>
    <span class="sub-count" id="sub-count"></span>
  </div>

  <div id="qa"></div>
</main>

<script>
const QUESTION_BANK = {
biopsychology: [
// ── Neuron Structure ─────────────────────────────────────────────────────
{sub:"Neuron Structure",q:"Which part of the neuron receives incoming signals from other neurons?",opts:["Axon","Terminal buttons","Dendrites","Myelin sheath"],c:2,e:"Dendrites are branching extensions that receive signals. The axon carries signals away from the cell body toward terminal buttons."},
{sub:"Neuron Structure",q:"The myelin sheath is produced by which type of cell?",opts:["Neurons","Glial cells","Red blood cells","Stem cells"],c:1,e:"Glial cells form the fatty myelin sheath that wraps around axons, insulating them and speeding conduction. Neurons are the signal-carrying cells themselves."},
{sub:"Neuron Structure",q:"Gaps in the myelin sheath where depolarization regenerates are called:",opts:["Synaptic clefts","Terminal buttons","Nodes of Ranvier","Action potentials"],c:2,e:"Nodes of Ranvier are the small gaps between myelin segments. The action potential 'jumps' between them in saltatory conduction, greatly speeding transmission."},
{sub:"Neuron Structure",q:"Neurotransmitters are stored inside the terminal buttons in structures called:",opts:["Dendrites","Nodes of Ranvier","Receptor proteins","Synaptic vesicles"],c:3,e:"Synaptic vesicles are tiny sacs in terminal buttons that store and release neurotransmitters into the synaptic cleft."},
{sub:"Neuron Structure",q:"Multiple sclerosis is caused by the progressive loss of:",opts:["Dopamine receptors","Synaptic vesicles","The myelin sheath","Dendritic branches"],c:2,e:"MS is an autoimmune disorder that destroys the myelin sheath, disrupting neural signal transmission and causing symptoms like fatigue and loss of motor control."},
{sub:"Neuron Structure",q:"Which neuron structure integrates all incoming signals before sending them down the axon?",opts:["Dendrites","Soma (cell body)","Terminal buttons","Synaptic cleft"],c:1,e:"The soma (cell body) sums all excitatory and inhibitory signals from dendrites. If the net signal exceeds the threshold, an action potential is triggered."},
{sub:"Neuron Structure",q:"The primary function of the axon is to:",opts:["Receive signals from other neurons","Release hormones into the bloodstream","Carry the action potential away from the soma","Store neurotransmitters"],c:2,e:"The axon transmits the electrical signal (action potential) away from the soma to the terminal buttons, which then release neurotransmitters."},
{sub:"Neuron Structure",q:"The space between the terminal button of one neuron and the dendrite of the next is called the:",opts:["Refractory period","Synaptic cleft","Node of Ranvier","Axon hillock"],c:1,e:"The synaptic cleft is the tiny gap where chemical communication between neurons occurs. Neurotransmitters are released across this cleft."},
{sub:"Neuron Structure",q:"The 'lock-and-key' model of neurotransmission refers to:",opts:["The action potential firing threshold","Neurotransmitters binding to specific receptor proteins","Myelin segments fitting between Nodes of Ranvier","The refractory period following an action potential"],c:1,e:"Neurotransmitters are shaped to fit only specific receptors — like a key fits a lock — ensuring chemical messages are received only by appropriate target neurons."},
{sub:"Neuron Structure",q:"Which of the following best describes a glial cell's primary role?",opts:["Generate action potentials","Process sensory information","Support and insulate neurons","Produce hormones"],c:2,e:"Glial cells support neurons structurally, form myelin, supply nutrients, and clean up cellular waste. They do not generate action potentials themselves."},
{sub:"Neuron Structure",q:"Myelinated axons conduct signals faster than unmyelinated axons because:",opts:["They have more dendrites","The signal jumps between Nodes of Ranvier (saltatory conduction)","They contain more neurotransmitters","The synaptic cleft is larger"],c:1,e:"Saltatory conduction — where the signal leaps from node to node — is much faster than the continuous, step-by-step conduction in unmyelinated axons."},
{sub:"Neuron Structure",q:"Which direction does information travel within a single neuron?",opts:["Terminal buttons → soma → dendrites","Dendrites → soma → axon → terminal buttons","Axon → soma → dendrites","Myelin sheath → synaptic cleft → dendrites"],c:1,e:"Within a neuron, signals travel in one direction: dendrites receive the signal, the soma integrates it, the axon carries it, and terminal buttons release neurotransmitters."},
{sub:"Neuron Structure",q:"A student learns that a disease destroys the nodes between myelin segments. The most likely effect would be:",opts:["The neuron produces excess neurotransmitters","Neural signal transmission slows dramatically","The soma stops integrating signals","Dendrites can no longer receive inputs"],c:1,e:"Nodes of Ranvier are essential for saltatory conduction. Without them, the electrical signal cannot jump efficiently, causing dramatically slowed transmission — similar to MS."},
// ── Action Potential ──────────────────────────────────────────────────────
{sub:"Action Potential",q:"The resting membrane potential of a neuron is approximately:",opts:["-55 mV","-70 mV","0 mV","+40 mV"],c:1,e:"At rest the inside of the neuron is about -70 mV relative to the outside. This charge difference is maintained by ion pumps keeping Na+ outside and K+ inside."},
{sub:"Action Potential",q:"Which ion rushes into the neuron during depolarization?",opts:["Potassium (K+)","Chloride (Cl-)","Sodium (Na+)","Calcium (Ca2+)"],c:2,e:"During depolarization, voltage-gated Na+ channels open and Na+ floods into the cell, making the inside more positive and driving the charge toward +40 mV."},
{sub:"Action Potential",q:"The 'all-or-nothing' principle of action potentials means:",opts:["Neurons fire at varying strengths depending on stimulus intensity","A neuron fires fully or not at all — there is no partial action potential","Stronger stimuli cause longer refractory periods","Only certain neurons are capable of firing"],c:1,e:"The all-or-nothing principle states that once threshold is reached, the action potential fires at full magnitude every time. Stimulus intensity is coded by frequency of firing, not size of the action potential."},
{sub:"Action Potential",q:"What happens during the repolarization phase of an action potential?",opts:["Na+ rushes into the cell","K+ rushes out of the cell","The neuron reaches threshold","Neurotransmitters are released"],c:1,e:"After depolarization, K+ channels open and K+ rushes out of the cell, driving the membrane potential back toward its negative resting state."},
{sub:"Action Potential",q:"The threshold of excitation for most neurons is approximately:",opts:["-70 mV","-90 mV","-55 mV","0 mV"],c:2,e:"When a neuron's membrane potential reaches about -55 mV, an action potential is triggered. Stimuli that don't push the membrane to this threshold cause no action potential."},
{sub:"Action Potential",q:"During the absolute refractory period, a neuron:",opts:["Fires action potentials more easily","Cannot fire another action potential no matter how strong the stimulus","Fires but with reduced strength","Requires less stimulus to reach threshold"],c:1,e:"During the absolute refractory period, Na+ channels are inactivated and cannot open again — making it physically impossible to fire another action potential temporarily."},
{sub:"Action Potential",q:"In a myelinated axon, the action potential travels via 'saltatory conduction.' This means:",opts:["The signal flows continuously along the entire membrane","The signal jumps from one Node of Ranvier to the next","The signal is carried by hormones rather than ions","The action potential gradually weakens as it travels"],c:1,e:"Saltatory (from the Latin 'to jump') conduction allows the electrical signal to leap between Nodes of Ranvier, making conduction much faster than in unmyelinated axons."},
{sub:"Action Potential",q:"If a second stimulus is applied during the relative refractory period, what occurs?",opts:["No action potential can fire under any circumstances","An action potential can fire, but only if the stimulus is stronger than usual","An action potential fires normally with no change","The neuron immediately hyperpolarizes further"],c:1,e:"During the relative refractory period (after the absolute), firing is possible but requires a stronger-than-normal stimulus because K+ channels are still open, making the membrane more negative."},
{sub:"Action Potential",q:"Increasing the intensity of a stimulus causes a neuron to:",opts:["Generate a larger action potential","Generate action potentials more frequently","Reduce the size of the synaptic cleft","Decrease the refractory period permanently"],c:1,e:"Because of the all-or-nothing law, action potential size doesn't change. Instead, a stronger stimulus increases the frequency (rate) of action potentials — this is called rate coding."},
{sub:"Action Potential",q:"At resting potential, sodium (Na+) is most concentrated:",opts:["Inside the neuron","Inside the axon hillock","Outside the neuron","Inside the synaptic vesicles"],c:2,e:"At rest, Na+ is held at higher concentrations outside the neuron by active Na+/K+ pumps. When an action potential fires, Na+ rushes inward down its concentration gradient."},
{sub:"Action Potential",q:"What is the first event that triggers an action potential?",opts:["K+ rushes out of the cell","The membrane potential reaches the threshold of excitation","Neurotransmitters are released into the synaptic cleft","The refractory period ends"],c:1,e:"An action potential begins when the membrane potential depolarizes sufficiently to reach the threshold (~-55 mV), causing voltage-gated Na+ channels to snap open."},
{sub:"Action Potential",q:"Which property ensures that neural signals travel in only one direction along an axon?",opts:["The concentration of K+ in the soma","The absolute refractory period behind the moving signal","The myelin sheath preventing backward flow","The lock-and-key nature of neurotransmitters"],c:1,e:"The absolute refractory period makes just-fired membrane sections temporarily unable to fire again. This means only the membrane ahead of the signal can depolarize, ensuring one-way travel."},
{sub:"Action Potential",q:"A neurotoxin blocks voltage-gated Na+ channels. The most likely effect would be:",opts:["Greatly increased action potential frequency","No action potentials can be generated","Larger but slower action potentials","Continuous, uncontrolled firing"],c:1,e:"Voltage-gated Na+ channels are necessary for depolarization. Blocking them prevents Na+ from entering, so no action potential can be generated — this is the mechanism of some local anesthetics."},
// ── Synaptic Transmission & Neurotransmitters ─────────────────────────────
{sub:"Synaptic Transmission & NTs",q:"Reuptake in synaptic transmission refers to:",opts:["The postsynaptic neuron producing a new action potential","Neurotransmitters being reabsorbed by the sending (presynaptic) neuron","Receptor proteins activating the next neuron","Neurotransmitters breaking down in the synaptic cleft"],c:1,e:"Reuptake is the mechanism by which the sending neuron recycles neurotransmitters by pulling them back out of the synapse. SSRIs, for example, block serotonin reuptake."},
{sub:"Synaptic Transmission & NTs",q:"A drug that mimics a neurotransmitter by binding to and activating its receptors is called:",opts:["An antagonist","An inhibitor","An agonist","A reuptake blocker"],c:2,e:"Agonists bind to receptors and activate them, producing the same effect as the natural neurotransmitter. Heroin, for example, acts as an agonist at opioid (endorphin) receptors."},
{sub:"Synaptic Transmission & NTs",q:"An antagonist drug works by:",opts:["Flooding the synapse with excess neurotransmitters","Blocking receptors without activating them","Speeding up reuptake of neurotransmitters","Increasing production of neurotransmitters"],c:1,e:"Antagonists occupy receptor binding sites without activating them, blocking the natural neurotransmitter from binding. Antipsychotics are dopamine antagonists."},
{sub:"Synaptic Transmission & NTs",q:"Which neurotransmitter is most strongly associated with reward, motivation, and movement?",opts:["Serotonin","Acetylcholine","GABA","Dopamine"],c:3,e:"Dopamine is released in reward circuits (nucleus accumbens) and plays a key role in motivation and movement. It's low in Parkinson's disease and implicated in addiction and schizophrenia."},
{sub:"Synaptic Transmission & NTs",q:"SSRIs (selective serotonin reuptake inhibitors) are used to treat depression because they:",opts:["Increase dopamine production","Block serotonin reuptake, leaving more serotonin in the synapse","Mimic norepinephrine at receptor sites","Enhance GABA activity"],c:1,e:"SSRIs prevent the reabsorption of serotonin by the presynaptic neuron, increasing serotonin availability in the synapse and enhancing its mood-regulating effects."},
{sub:"Synaptic Transmission & NTs",q:"Which neurotransmitter is the primary inhibitory transmitter in the brain?",opts:["Glutamate","Dopamine","GABA","Acetylcholine"],c:2,e:"GABA (gamma-aminobutyric acid) is the main inhibitory neurotransmitter. Alcohol enhances GABA activity, explaining its sedative effects. Anxiolytic drugs like benzodiazepines also enhance GABA."},
{sub:"Synaptic Transmission & NTs",q:"Which neurotransmitter is the main excitatory transmitter in the brain?",opts:["GABA","Endorphins","Serotonin","Glutamate"],c:3,e:"Glutamate is the principal excitatory neurotransmitter — it drives neural activity throughout the brain. Excessive glutamate can cause excitotoxicity (cell death)."},
{sub:"Synaptic Transmission & NTs",q:"Low levels of acetylcholine (ACh) are associated with:",opts:["Schizophrenia","Parkinson's disease","Alzheimer's disease","Depression"],c:2,e:"Alzheimer's disease is associated with the degeneration of ACh-producing neurons, leading to memory and cognitive impairment. ACh is critical for memory and attention."},
{sub:"Synaptic Transmission & NTs",q:"Endorphins are released during intense exercise and are classified as natural:",opts:["Stimulants","Pain relievers (analgesics)","Mood destabilizers","Appetite suppressants"],c:1,e:"Endorphins are endogenous opioid neurotransmitters that bind to opioid receptors, reducing pain and producing feelings of pleasure — the basis of the 'runner's high.'"},
{sub:"Synaptic Transmission & NTs",q:"Parkinson's disease is characterized by a deficiency of which neurotransmitter?",opts:["Serotonin","Acetylcholine","Norepinephrine","Dopamine"],c:3,e:"Parkinson's results from the death of dopamine-producing neurons in the substantia nigra, causing the characteristic motor symptoms: tremors, rigidity, and bradykinesia."},
{sub:"Synaptic Transmission & NTs",q:"Norepinephrine is most closely associated with:",opts:["Sleep and appetite regulation","Arousal, attention, and the fight-or-flight response","Memory consolidation","Movement and reward"],c:1,e:"Norepinephrine is released by the locus coeruleus and adrenal medulla during stress/arousal, increasing alertness and heart rate. It's also involved in attention (targeted by some ADHD medications)."},
{sub:"Synaptic Transmission & NTs",q:"Which neurotransmitter is directly targeted by curare, causing paralysis?",opts:["Dopamine","Serotonin","Acetylcholine","Norepinephrine"],c:2,e:"Curare is an ACh antagonist at neuromuscular junctions — it blocks ACh from binding, preventing muscle contraction and causing paralysis. This proves ACh's role in voluntary movement."},
{sub:"Synaptic Transmission & NTs",q:"A patient is given a drug that blocks dopamine receptors. The most likely outcome is:",opts:["Increased feelings of pleasure","Relief from Parkinson's tremors","Reduced symptoms of schizophrenia","Improved memory and learning"],c:2,e:"Many antipsychotic drugs treat schizophrenia by blocking dopamine receptors, since excess dopamine activity is linked to the positive symptoms of schizophrenia (hallucinations, delusions)."},
// ── Nervous System Divisions ──────────────────────────────────────────────
{sub:"Nervous System Divisions",q:"Which of the following correctly describes the central nervous system (CNS)?",opts:["All nerves outside the brain and spinal cord","The brain, spinal cord, and peripheral nerves","The brain and spinal cord only","The autonomic and somatic nervous systems"],c:2,e:"The CNS consists solely of the brain and spinal cord. Everything else — the nerves traveling to muscles, organs, and sensory receptors — belongs to the PNS."},
{sub:"Nervous System Divisions",q:"Which division of the nervous system controls voluntary skeletal muscle movement?",opts:["Autonomic nervous system","Sympathetic nervous system","Parasympathetic nervous system","Somatic nervous system"],c:3,e:"The somatic NS controls voluntary, consciously-directed movements via motor neurons to skeletal muscles. It also carries sensory info from the body to the CNS."},
{sub:"Nervous System Divisions",q:"During a near-car-accident, your heart races and your pupils dilate. Which system is responsible?",opts:["Parasympathetic nervous system","Somatic nervous system","Sympathetic nervous system","Central nervous system"],c:2,e:"The sympathetic NS orchestrates fight-or-flight responses: heart rate increases, pupils dilate, digestion slows, and stress hormones flood the body to prepare for action."},
{sub:"Nervous System Divisions",q:"After the danger passes, your heart rate returns to normal and digestion resumes. Which system is active?",opts:["Sympathetic nervous system","Somatic nervous system","Reticular formation","Parasympathetic nervous system"],c:3,e:"The parasympathetic NS promotes 'rest and digest,' reversing the sympathetic response: slowing heart rate, constricting pupils, stimulating digestion, and conserving energy."},
{sub:"Nervous System Divisions",q:"The autonomic nervous system regulates:",opts:["Voluntary limb movements","Involuntary functions like heart rate and digestion","Conscious perception of pain","Skeletal muscle contractions"],c:1,e:"Autonomic means 'self-governing' — this division operates largely without conscious control, managing heart rate, breathing rate, digestion, glandular secretions, and smooth muscle."},
{sub:"Nervous System Divisions",q:"Which statement best describes the relationship between sympathetic and parasympathetic divisions?",opts:["They operate on different organs with no overlap","They generally have opposing effects on the same organs","The sympathetic activates only during extreme emergencies","The parasympathetic is only active during sleep"],c:1,e:"Most organs receive both sympathetic and parasympathetic inputs with opposing effects — like a gas pedal and brake. The balance between them determines organ function at any moment."},
{sub:"Nervous System Divisions",q:"Epinephrine (adrenaline) is released into the bloodstream by which structure during sympathetic activation?",opts:["Hippocampus","Thalamus","Thyroid gland","Adrenal medulla"],c:3,e:"The adrenal medulla (inner adrenal gland) releases epinephrine (adrenaline) and norepinephrine in response to sympathetic nervous system activation, sustaining the fight-or-flight response."},
{sub:"Nervous System Divisions",q:"A person with damage to their somatic nervous system would most likely have difficulty with:",opts:["Regulating blood pressure","Digesting food","Controlling fear responses","Picking up a coffee cup voluntarily"],c:3,e:"The somatic NS controls voluntary skeletal muscle movements, like picking up objects. Damage would impair voluntary motor control and sensory feedback from the limbs."},
{sub:"Nervous System Divisions",q:"Which nervous system division includes the nerves that travel to and from your limbs and organs, outside the brain and spinal cord?",opts:["Central nervous system","Somatic nervous system","Peripheral nervous system","Sympathetic nervous system"],c:2,e:"The peripheral NS encompasses all neural structures outside the CNS — including the somatic and autonomic divisions, with their nerves reaching muscles, skin, and internal organs."},
{sub:"Nervous System Divisions",q:"The sympathetic nervous system slows digestion during stress because:",opts:["Energy is better directed to muscles and vital organs","Stress hormones break down food faster","The parasympathetic system compensates by speeding up digestion","Digestion is controlled by the somatic NS"],c:0,e:"Fight-or-flight is metabolically expensive. The body prioritizes muscles and the brain by diverting blood away from digestion. This is why stress can cause GI issues over time."},
{sub:"Nervous System Divisions",q:"Which division of the nervous system would be most active during meditation or sleep?",opts:["Sympathetic nervous system","Central nervous system","Somatic nervous system","Parasympathetic nervous system"],c:3,e:"Meditation and sleep activate the parasympathetic system (rest-and-digest): heart rate and blood pressure drop, digestion is promoted, and the body restores itself."},
{sub:"Nervous System Divisions",q:"Both the somatic and autonomic nervous systems are subdivisions of the:",opts:["Central nervous system","Peripheral nervous system","Sympathetic nervous system","Reticular formation"],c:1,e:"The peripheral NS (everything outside CNS) is divided into the somatic NS (voluntary) and the autonomic NS (involuntary), which itself splits into sympathetic and parasympathetic."},
// ── Brain Lobes & Cortex ──────────────────────────────────────────────────
{sub:"Brain Lobes & Cortex",q:"Damage to Broca's area in the left frontal lobe would most likely cause:",opts:["Difficulty understanding spoken language","Inability to recognize faces","Difficulty producing fluent speech","Loss of long-term memories"],c:0,e:"Broca's aphasia results in non-fluent, effortful speech production while comprehension remains relatively intact. Patients know what they want to say but cannot produce it fluently."},
{sub:"Brain Lobes & Cortex",q:"The primary somatosensory cortex, which processes touch and body position, is located in the:",opts:["Frontal lobe","Temporal lobe","Occipital lobe","Parietal lobe"],c:3,e:"The parietal lobe houses the somatosensory cortex (just behind the central sulcus), which receives and processes touch, pain, temperature, and proprioceptive inputs from the body."},
{sub:"Brain Lobes & Cortex",q:"Wernicke's aphasia, where a patient speaks fluently but meaninglessly and cannot understand language, results from damage to the:",opts:["Left frontal lobe","Left temporal lobe","Right parietal lobe","Occipital lobe"],c:1,e:"Wernicke's area in the left temporal lobe is essential for language comprehension. Damage produces fluent but nonsensical speech — patients don't realize their speech is garbled."},
{sub:"Brain Lobes & Cortex",q:"A patient suffers a stroke in the occipital lobe. Which ability is most likely to be impaired?",opts:["Understanding speech","Voluntary movement of the right hand","Processing visual information","Feeling touch on the left side of the body"],c:2,e:"The occipital lobe is exclusively devoted to visual processing. Damage can cause cortical blindness — the eyes are intact but the brain cannot process visual input."},
{sub:"Brain Lobes & Cortex",q:"Impulsive decision-making, dramatic personality changes, and poor planning are most consistent with damage to the:",opts:["Temporal lobe","Cerebellum","Parietal lobe","Prefrontal cortex"],c:3,e:"The prefrontal cortex handles executive functions — planning, impulse control, and personality expression. The famous case of Phineas Gage (frontal damage) showed personality can change dramatically."},
{sub:"Brain Lobes & Cortex",q:"Which brain structure connects the left and right cerebral hemispheres?",opts:["Hippocampus","Corpus callosum","Thalamus","Cerebellum"],c:1,e:"The corpus callosum is a large bundle of myelinated fibers allowing communication between hemispheres. When cut (as in split-brain surgery), the hemispheres largely operate independently."},
{sub:"Brain Lobes & Cortex",q:"The primary motor cortex controls voluntary movement and is located in the:",opts:["Parietal lobe","Occipital lobe","Temporal lobe","Frontal lobe"],c:3,e:"The primary motor cortex runs along the rear edge of the frontal lobe (precentral gyrus). It sends commands to skeletal muscles, with each body part mapped contralaterally."},
{sub:"Brain Lobes & Cortex",q:"In most people, which hemisphere is dominant for language production?",opts:["Right","Left","Both equally","It varies per person with no general rule"],c:1,e:"Language production (Broca's area) is typically localized to the left hemisphere in about 95% of right-handed people and ~70% of left-handed people. Right hemisphere handles prosody and context."},
{sub:"Brain Lobes & Cortex",q:"The temporal lobe is most directly involved in which of the following functions?",opts:["Visual processing","Motor coordination","Auditory processing and language comprehension","Touch and body position"],c:2,e:"The temporal lobe houses the primary auditory cortex and Wernicke's area (language comprehension). It's also involved in face recognition and aspects of memory."},
{sub:"Brain Lobes & Cortex",q:"'Contralateral control' in the motor and sensory cortex means:",opts:["The left brain controls the left side of the body","The right brain controls the right side of the body","Each hemisphere primarily controls the opposite side of the body","Motor and sensory functions are equally distributed across both hemispheres"],c:2,e:"Contralateral means 'opposite side.' The left motor cortex controls the right hand, and the right somatosensory cortex receives input from the left foot, for example."},
{sub:"Brain Lobes & Cortex",q:"The homunculus (cortical map) shows that the hands and mouth have disproportionately large representations in the motor and somatosensory cortex because:",opts:["These areas require more blood flow","They need more precise neural control than the back or legs","They evolved last in human development","They are closer to the brain stem"],c:1,e:"The size of cortical representation corresponds to the precision of motor control or sensitivity needed, not physical size. Hands and lips require fine control, so they have large cortical real estate."},
{sub:"Brain Lobes & Cortex",q:"A researcher studying spatial reasoning and navigation would most likely focus on which brain region?",opts:["Left Broca's area","Wernicke's area in the left temporal lobe","The right parietal lobe","The occipital lobe's V1 region"],c:2,e:"The right parietal lobe is especially important for spatial processing, navigation, and attention to the right side of space. Damage causes hemispatial neglect — ignoring one side of space."},
{sub:"Brain Lobes & Cortex",q:"Which lobe processes all visual information from the eyes?",opts:["Frontal lobe","Parietal lobe","Temporal lobe","Occipital lobe"],c:3,e:"All visual processing occurs in the occipital lobe, starting with V1 (primary visual cortex). Visual signals from the retina travel via the optic nerve and thalamus to the occipital lobe."},
// ── Subcortical Brain Structures ──────────────────────────────────────────
{sub:"Subcortical Structures",q:"The thalamus is often described as the brain's 'sensory relay station' because it:",opts:["Stores long-term memories","Routes all sensory information (except smell) to appropriate cortical areas","Generates all conscious experience","Controls the fight-or-flight response"],c:1,e:"Almost all sensory signals pass through the thalamus before reaching the cortex. Smell is the only sense with a direct pathway to the cortex — explaining why smells evoke powerful memories."},
{sub:"Subcortical Structures",q:"Patient H.M. had his hippocampus removed to treat epilepsy and could no longer form new long-term memories. This is called:",opts:["Retrograde amnesia","Semantic amnesia","Anterograde amnesia","Korsakoff syndrome"],c:2,e:"Anterograde amnesia means inability to form NEW memories after an injury or surgery. H.M. retained memories formed before surgery but couldn't create new declarative memories."},
{sub:"Subcortical Structures",q:"The amygdala is most strongly associated with:",opts:["Coordinating balance and motor movements","Relaying sensory signals to the cortex","Emotional processing, especially fear responses","Regulating hunger and body temperature"],c:2,e:"The amygdala is central to emotional processing — especially detecting threats and forming fear memories. It responds rapidly to stimuli before conscious awareness occurs."},
{sub:"Subcortical Structures",q:"The hypothalamus plays a crucial role in:",opts:["Coordinating voluntary motor movements","Maintaining homeostasis (hunger, thirst, temperature, sleep/wake cycles)","Processing language comprehension","Relaying visual signals to the cortex"],c:1,e:"The hypothalamus is the body's master regulator of homeostasis. It controls hunger, thirst, body temperature, circadian rhythms, and links the nervous system to the endocrine system via the pituitary."},
{sub:"Subcortical Structures",q:"The cerebellum primarily contributes to:",opts:["Emotional memory and fear conditioning","Declarative memory formation","Balance, coordination, and fine motor movements","Regulating sleep and wakefulness"],c:2,e:"The cerebellum (Latin for 'little brain') coordinates smooth movement, balance, and timing. Cerebellar damage causes ataxia — uncoordinated, staggering movements."},
{sub:"Subcortical Structures",q:"Which brain structure, if damaged bilaterally, would most likely result in complete inability to form new declarative memories?",opts:["Amygdala","Cerebellum","Thalamus","Hippocampus"],c:3,e:"The hippocampus is essential for memory consolidation — converting short-term memories into long-term declarative (explicit) memories. Bilateral hippocampal damage causes severe anterograde amnesia."},
{sub:"Subcortical Structures",q:"The reticular activating system (RAS) runs through the brainstem and regulates:",opts:["Appetite and sexual behavior","Alertness, arousal, and the sleep-wake cycle","Fine motor coordination","The body's immune response"],c:1,e:"The RAS filters incoming sensory stimulation and modulates consciousness/arousal. Damage can cause coma. Stimulants like caffeine work partly by activating this system."},
{sub:"Subcortical Structures",q:"Which brainstem structure controls life-sustaining functions like breathing rate and heart rate?",opts:["Pons","Reticular formation","Medulla oblongata","Basal ganglia"],c:2,e:"The medulla oblongata controls autonomic vital functions — breathing, heart rate, blood pressure, and swallowing. Damage to the medulla is often fatal."},
{sub:"Subcortical Structures",q:"The basal ganglia are most involved in:",opts:["Auditory processing and language","Initiating voluntary movement and habit formation","Processing emotional memories","Regulating hormonal release"],c:1,e:"The basal ganglia are involved in initiating and regulating voluntary movements and the formation of procedural habits. Their malfunction is central to Parkinson's disease and Huntington's disease."},
{sub:"Subcortical Structures",q:"Why does the smell of baking bread powerfully evoke old childhood memories, more than other senses?",opts:["Smell bypasses the thalamus and projects directly to the hippocampus and amygdala","Smell signals are processed faster than other senses","The occipital lobe specifically links smell to visual memories","The somatosensory cortex integrates smell with touch"],c:0,e:"Olfactory signals uniquely project directly to the amygdala and hippocampus (emotion and memory centers) without routing through the thalamus — explaining strong smell-memory and smell-emotion associations."},
{sub:"Subcortical Structures",q:"The hypothalamus links the nervous system to the endocrine system primarily through its control of the:",opts:["Amygdala","Adrenal medulla","Pituitary gland","Thyroid gland"],c:2,e:"The hypothalamus sends hormonal and neural signals to the pituitary gland, which then releases hormones that control other endocrine glands throughout the body — making this connection crucial."},
{sub:"Subcortical Structures",q:"A patient with severe bilateral amygdala damage would most likely have difficulty:",opts:["Forming new procedural memories","Experiencing or recognizing fear","Maintaining balance and coordination","Understanding spoken language"],c:1,e:"The amygdala is essential for fear responses and emotional memory. Patients with bilateral damage (like patient S.M.) fail to show fear even in objectively dangerous situations."},
{sub:"Subcortical Structures",q:"Which subcortical structure is especially critical for converting short-term memories into long-term memories?",opts:["Amygdala","Cerebellum","Hippocampus","Hypothalamus"],c:2,e:"The hippocampus acts as a 'memory gateway,' consolidating information from short-term storage into long-term declarative memory. This is why hippocampal damage causes profound amnesia."},
// ── Endocrine System ─────────────────────────────────────────────────────
{sub:"Endocrine System",q:"Which of the following best distinguishes hormones from neurotransmitters?",opts:["Hormones act faster and more locally","Neurotransmitters are released into the bloodstream; hormones into the synapse","Hormones travel through the bloodstream and have slower, longer-lasting, body-wide effects","Neurotransmitters affect organs; hormones only affect neurons"],c:2,e:"Hormones are released into the bloodstream and reach distant target cells throughout the body — slower to act but longer lasting. Neurotransmitters act locally in the synaptic cleft with rapid, brief effects."},
{sub:"Endocrine System",q:"The pituitary gland is often called the 'master gland' because:",opts:["It produces all hormones in the body","It is the largest endocrine gland","It releases hormones that regulate other endocrine glands","It directly controls the sympathetic nervous system"],c:2,e:"The pituitary produces hormones (TSH, ACTH, LH, FSH, GH, etc.) that regulate the thyroid, adrenal glands, and gonads. It is itself controlled by the hypothalamus above it."},
{sub:"Endocrine System",q:"In the HPA axis, the correct sequence of activation is:",opts:["Pituitary → Hypothalamus → Adrenal cortex","Adrenal cortex → Hypothalamus → Pituitary","Hypothalamus → Pituitary → Adrenal cortex","Hypothalamus → Adrenal cortex → Pituitary"],c:2,e:"HPA stands for Hypothalamic-Pituitary-Adrenal. The hypothalamus releases CRH → pituitary releases ACTH → adrenal cortex releases cortisol — the primary chronic stress response."},
{sub:"Endocrine System",q:"Cortisol is released by the adrenal cortex during prolonged stress. A key function of cortisol is to:",opts:["Reduce blood sugar to slow the nervous system","Mobilize energy and suppress the immune system","Enhance long-term memory formation","Increase parasympathetic activity"],c:1,e:"Cortisol mobilizes glucose for energy and temporarily suppresses immune activity during stress. Chronic cortisol elevation is harmful, impeding immune function, memory, and cardiovascular health."},
{sub:"Endocrine System",q:"The 'organizational' effects of androgens like testosterone refer to:",opts:["Temporary behavioral changes in adults triggered by hormone levels","Permanent structural changes to the brain and body during prenatal development","The organization of testosterone production across the lifespan","The classification of androgens within the hormonal hierarchy"],c:1,e:"Organizational effects occur during sensitive developmental periods (often prenatally), permanently shaping brain structure and body anatomy. These are contrasted with activational effects in adulthood."},
{sub:"Endocrine System",q:"The 'activational' effects of androgens refer to:",opts:["Permanent prenatal changes to brain structure","Temporary, reversible behavioral effects triggered by current hormone levels in adults","The permanent organization of the endocrine system","Changes to testosterone receptor density over time"],c:1,e:"Activational effects are temporary — they depend on current circulating hormone levels. For example, testosterone can temporarily increase sexual motivation or aggression, but these effects reverse if hormone levels drop."},
{sub:"Endocrine System",q:"Which gland is responsible for regulating the body's overall metabolic rate?",opts:["Pituitary gland","Adrenal gland","Thyroid gland","Pancreas"],c:2,e:"The thyroid gland produces thyroxine, which regulates metabolic rate. Hypothyroidism (too little) causes fatigue and weight gain; hyperthyroidism (too much) causes weight loss and anxiety."},
{sub:"Endocrine System",q:"Insulin, produced by the pancreas, functions to:",opts:["Increase blood glucose levels","Allow cells to take up glucose from the blood","Stimulate the adrenal glands","Regulate cortisol release"],c:1,e:"Insulin acts as a key that unlocks cells to allow glucose entry, reducing blood glucose levels. In Type 1 diabetes, the pancreas doesn't produce insulin; in Type 2, cells become insulin-resistant."},
{sub:"Endocrine System",q:"During the acute stress response, epinephrine (adrenaline) is released from the:",opts:["Adrenal cortex","Thyroid gland","Adrenal medulla","Anterior pituitary"],c:2,e:"The adrenal medulla (inner adrenal gland) rapidly releases epinephrine and norepinephrine in response to direct sympathetic nervous system innervation — the fast fight-or-flight response."},
{sub:"Endocrine System",q:"Which statement about hormones and neurotransmitters is accurate?",opts:["Both act only within the synaptic cleft","Hormones act instantly while neurotransmitters are slower","Some chemicals (like epinephrine) can function as both a hormone and a neurotransmitter","Neurotransmitters are proteins while hormones are lipids"],c:2,e:"Some molecules like epinephrine/norepinephrine serve as NTs in the nervous system and as hormones when released into the bloodstream — demonstrating the overlap between these communication systems."},
{sub:"Endocrine System",q:"Chronic stress leads to sustained cortisol exposure. A long-term consequence would be:",opts:["Enhanced immune function and resistance to disease","Strengthening of the hippocampus","Suppressed immune function and potential hippocampal damage","Increased GABA activity reducing anxiety"],c:2,e:"Prolonged cortisol damages hippocampal neurons (reducing memory capacity) and suppresses immune function, explaining why chronically stressed people get sick more often and have memory difficulties."},
{sub:"Endocrine System",q:"Which endocrine gland is considered the 'master gland' and why?",opts:["Adrenal gland — because it controls fight-or-flight","Hypothalamus — because it directly produces cortisol","Pituitary gland — because it releases hormones regulating other glands","Thyroid gland — because it regulates all metabolic processes"],c:2,e:"The anterior pituitary releases hormones that stimulate the thyroid (TSH), adrenal cortex (ACTH), and gonads (LH, FSH), among others — earning it the 'master gland' title."},
// ── Brain Research Methods & Neuroplasticity ──────────────────────────────
{sub:"Brain Research Methods",q:"Which brain imaging technique measures electrical activity with millisecond precision?",opts:["fMRI","PET scan","EEG","TMS"],c:2,e:"EEG (electroencephalography) records electrical activity from electrodes on the scalp with excellent temporal resolution (milliseconds). Its weakness is poor spatial resolution — hard to pinpoint where signals originate."},
{sub:"Brain Research Methods",q:"fMRI (functional MRI) detects brain activity by measuring:",opts:["Electrical impulses on the scalp","Changes in blood oxygenation (BOLD signal)","Radioactive glucose uptake","Magnetic responses from neurons"],c:1,e:"fMRI uses the BOLD (Blood Oxygen Level Dependent) signal — active neurons demand more oxygen-rich blood. This makes fMRI excellent for spatial resolution but relatively slow (seconds) for temporal resolution."},
{sub:"Brain Research Methods",q:"A researcher wants the best possible spatial resolution to pinpoint exactly which brain region activates during a task. Which tool should they use?",opts:["EEG","TMS","PET scan","fMRI"],c:3,e:"fMRI offers the best spatial resolution among common neuroimaging methods, identifying active areas with millimeter precision, though it sacrifices temporal resolution (captures activity over seconds)."},
{sub:"Brain Research Methods",q:"TMS (Transcranial Magnetic Stimulation) is used in research to:",opts:["Measure blood flow in the cortex","Create a temporary 'virtual lesion' by disrupting a brain region","Record electrical signals over long periods","Visualize structural brain damage"],c:1,e:"TMS delivers a magnetic pulse that temporarily disrupts neural activity in a targeted region, allowing researchers to establish causal relationships between that region and specific functions."},
{sub:"Brain Research Methods",q:"Neuroplasticity refers to the brain's ability to:",opts:["Generate new neurons throughout adulthood at a steady rate","Form new synaptic connections and reorganize in response to experience","Maintain a fixed structure after early development","Repair myelin after damage"],c:1,e:"Neuroplasticity is the brain's capacity to reorganize by forming new connections, strengthening/weakening synapses, and sometimes generating new neurons — especially active during development."},
{sub:"Brain Research Methods",q:"Roger Sperry and Michael Gazzaniga's 'split-brain' research found that after severing the corpus callosum:",opts:["Patients lost all language ability","Each hemisphere could act independently and had different specializations","All conscious experience was lost","Motor function was permanently impaired"],c:1,e:"Split-brain studies revealed that without the corpus callosum, the left hemisphere (language) and right hemisphere (spatial/nonverbal) operate independently — each processing information the other doesn't 'know.'"},
{sub:"Brain Research Methods",q:"The case of Phineas Gage, who survived a tamping iron through his frontal lobe, provided early evidence that:",opts:["The brain cannot recover from severe trauma","The frontal lobe is involved in personality and social behavior","Memory is stored throughout the cortex","Language is processed in the right hemisphere"],c:1,e:"Gage's personality changed dramatically after his frontal lobe injury — from responsible and sociable to impulsive and profane — providing early clinical evidence for the frontal lobe's role in personality."},
{sub:"Brain Research Methods",q:"In behavioral genetics, 'heritability' means:",opts:["The percentage of an individual's trait caused by their genes","The proportion of variance in a trait within a population attributable to genetic differences","All individuals with the gene will show the trait","Traits can be passed to offspring without environmental influence"],c:1,e:"Heritability is a population-level statistic — it estimates what fraction of variation in a trait (across people) is due to genetic differences. It says nothing about what percentage of a specific person's trait is 'genetic.'"},
{sub:"Brain Research Methods",q:"A PET scan differs from an fMRI primarily because PET scans:",opts:["Measure electrical activity while fMRI measures blood flow","Use radioactive glucose tracers to measure metabolic activity","Have far superior spatial resolution","Cannot be used on living subjects"],c:1,e:"PET scans require injection of a radioactive glucose tracer. Active brain areas metabolize more glucose, showing up as 'hot spots.' PET has both lower spatial and temporal resolution than fMRI."},
{sub:"Brain Research Methods",q:"Lesion studies in neuroscience involve:",opts:["Stimulating specific brain areas with magnetic pulses","Injecting tracers to track neural pathways","Observing behavioral deficits after brain areas are damaged or removed","Recording electrical activity from individual neurons"],c:2,e:"Lesion studies (from clinical cases or animal research) identify brain functions by seeing what abilities are lost when specific areas are damaged — showing those areas are necessary for those functions."},
{sub:"Brain Research Methods",q:"Neuroplasticity is generally greatest during:",opts:["Late adulthood","Early childhood and development","The college years","Adulthood with stress exposure"],c:1,e:"The brain is most plastic during early development (critical/sensitive periods), when synaptic connections form at incredible rates. Plasticity continues throughout life but at a lower level."},
{sub:"Brain Research Methods",q:"Which finding from split-brain research demonstrated that the right hemisphere has language limitations?",opts:["Right hemisphere patients lost all motor ability","Objects placed in the left hand (right hemisphere) couldn't be verbally named","EEG showed right hemisphere activity during reading","Split-brain patients had identical performance on all cognitive tasks"],c:1,e:"In split-brain patients, objects shown only to the right hemisphere (left visual field) couldn't be named verbally — because language production (Broca's area) is in the left hemisphere, which didn't perceive the object."}
],// END BIOPSYCHOLOGY

sensation: [
// ── Sensation vs. Perception & Thresholds ────────────────────────────────
{sub:"Sensation vs. Perception & Thresholds",q:"Transduction in the sensory system refers to:",opts:["The conscious interpretation of sensory signals","Converting physical energy (light, sound) into neural signals","The process of sensory adaptation","Filtering irrelevant stimuli through selective attention"],c:1,e:"Transduction is the critical first step in sensation — specialized receptor cells convert physical energy (photons, pressure waves, chemicals) into electrochemical signals the brain can process."},
{sub:"Sensation vs. Perception & Thresholds",q:"The minimum stimulus intensity detectable 50% of the time under ideal conditions is called the:",opts:["Difference threshold","Sensory adaptation point","Absolute threshold","Signal detection criterion"],c:2,e:"The absolute threshold is defined statistically as the intensity detected half the time. It is not a hard line — it's probabilistic and varies with alertness, motivation, and other factors."},
{sub:"Sensation vs. Perception & Thresholds",q:"Weber's Law states that the just noticeable difference (JND) is:",opts:["The same absolute amount regardless of the starting stimulus","A constant proportion of the original stimulus intensity","Determined by the emotional state of the observer","Only applicable to vision and hearing, not touch"],c:1,e:"Weber's Law: ΔI/I = k (a constant). You need ~2% more weight to notice a difference whether comparing 10 lbs vs 100 lbs. The proportion stays constant, not the absolute amount."},
{sub:"Sensation vs. Perception & Thresholds",q:"Sensory adaptation occurs when:",opts:["A stimulus gradually increases in intensity","Neural response diminishes after prolonged exposure to an unchanging stimulus","A person becomes unable to detect any stimuli","The brain increases sensitivity to compensate for reduced input"],c:1,e:"Sensory adaptation is the decrease in receptor firing after sustained exposure to a constant stimulus (e.g., no longer noticing a watch on your wrist). It focuses our attention on changes."},
{sub:"Sensation vs. Perception & Thresholds",q:"Signal detection theory proposes that the ability to detect a stimulus depends on:",opts:["Only the physical intensity of the stimulus","The absolute threshold being exceeded","Both the signal's intensity AND individual factors like alertness and motivation","Only internal factors like attention, not the signal itself"],c:2,e:"Signal detection theory recognizes that perception is not just about stimulus intensity — it also depends on observer factors like fatigue, expectations, incentives, and decision criteria (bias)."},
{sub:"Sensation vs. Perception & Thresholds",q:"'Top-down processing' means that perception is influenced by:",opts:["Raw sensory data building up feature by feature","Prior knowledge, expectations, and context","The intensity of the physical stimulus","Sensory receptor sensitivity"],c:1,e:"Top-down processing involves the brain using existing knowledge, schemas, and context to interpret incoming data. It explains why we can read poorly printed text or hear words in noisy environments."},
{sub:"Sensation vs. Perception & Thresholds",q:"'Bottom-up processing' refers to perception that is driven by:",opts:["Previous experience and expectations","Emotional state and motivation","The raw physical features of the stimulus itself","Memory of similar past stimuli"],c:2,e:"Bottom-up processing builds perception from the basic physical properties of the stimulus — shapes, edges, colors — without relying on prior knowledge. Both top-down and bottom-up processing occur simultaneously."},
{sub:"Sensation vs. Perception & Thresholds",q:"According to Weber's Law, if you need to add 5 grams to a 100-gram weight to notice a difference, how much would you need to add to a 1000-gram weight?",opts:["5 grams","10 grams","50 grams","100 grams"],c:2,e:"Weber's Law: the JND is a constant proportion (5/100 = 5%). For 1000 grams, 5% = 50 grams. The JND scales proportionally with the original stimulus magnitude."},
{sub:"Sensation vs. Perception & Thresholds",q:"Which of the following best distinguishes sensation from perception?",opts:["Sensation occurs in the brain; perception occurs in sensory organs","Sensation is the detection of stimuli; perception is the interpretation of those stimuli","Sensation is conscious; perception is unconscious","There is no meaningful difference between the two"],c:1,e:"Sensation is the initial detection and encoding of physical stimuli by sensory receptors. Perception is the brain's active process of organizing, interpreting, and making sense of those sensory signals."},
{sub:"Sensation vs. Perception & Thresholds",q:"A radiologist learns to spot subtle features in X-rays that untrained people miss entirely. This demonstrates:",opts:["Changes in absolute threshold due to training","The influence of top-down processing on perception","Sensory adaptation to X-ray images","Changes in the JND due to expertise"],c:1,e:"Expert radiologists use extensive top-down knowledge — schemas of what pathology looks like — to guide attention and interpret ambiguous patterns. Training changes how, not whether, stimuli are detected."},
{sub:"Sensation vs. Perception & Thresholds",q:"Which of the following is an example of sensory adaptation?",opts:["A lifeguard noticing a child struggling despite background noise","Seeing a movie as three-dimensional through special glasses","Gradually no longer noticing the smell of your own home","Jumping when a loud unexpected noise occurs"],c:2,e:"Sensory adaptation occurs when continued exposure to an unchanging stimulus reduces neural response. Your nose adapts to your home's odor so you notice new smells but not the constant baseline."},
{sub:"Sensation vs. Perception & Thresholds",q:"A security guard who must stay alert all night is likely to experience what effect on signal detection?",opts:["An elevated absolute threshold, making signals harder to detect","A lower JND, making small differences easier to notice","Improved accuracy due to more time to observe","Increased miss rates due to fatigue affecting attention and criterion"],c:3,e:"Signal detection theory predicts that fatigue raises the criterion (bias), increasing false alarms or misses. A tired observer may miss real signals or respond more cautiously, reducing performance."},
{sub:"Sensation vs. Perception & Thresholds",q:"Which sensory phenomenon explains why you can still feel your seatbelt even though you became aware of it only when someone mentioned it?",opts:["Transduction","Absolute threshold","Sensory adaptation — it was below awareness until attention was directed to it","Signal detection theory"],c:2,e:"Sensory adaptation causes seatbelt pressure to fade from conscious awareness after a few minutes — but the signal is still present. Attention or a top-down cue brings it back to consciousness."},
// ── Vision — The Eye ─────────────────────────────────────────────────────
{sub:"Vision — The Eye",q:"Which photoreceptors are responsible for color vision and fine detail, and are concentrated in the fovea?",opts:["Rods","Bipolar cells","Cones","Ganglion cells"],c:2,e:"Cones provide color vision and high acuity. They are densely packed in the fovea (center of the retina) — the point of sharpest vision — and require bright light."},
{sub:"Vision — The Eye",q:"Rods in the retina are specialized for:",opts:["Color discrimination in bright light","High-acuity central vision","Low-light and peripheral (black & white) vision","Processing high-frequency light wavelengths"],c:2,e:"Rods are highly sensitive to light but don't distinguish colors. They dominate peripheral vision and are crucial for seeing in dim conditions. The fovea has no rods — only cones."},
{sub:"Vision — The Eye",q:"The blind spot in the visual field is caused by:",opts:["Too many rods and not enough cones in the periphery","The absence of photoreceptors at the optic disc where the optic nerve exits","A lack of pigment in the fovea","The overlap between binocular visual fields"],c:1,e:"The optic disc is where the optic nerve and blood vessels exit the eye — there are no photoreceptors here, creating a small blind spot. The brain fills it in automatically."},
{sub:"Vision — The Eye",q:"The process of the lens changing shape to focus on near vs. far objects is called:",opts:["Transduction","Accommodation","Convergence","Adaptation"],c:1,e:"Accommodation is the ciliary muscle's adjustment of lens curvature to focus light on the retina. For near objects, the lens thickens; for far objects, it flattens. Age-related loss of this is presbyopia."},
{sub:"Vision — The Eye",q:"After entering the eye through the cornea and lens, light information is transduced into neural signals by photoreceptors in the:",opts:["Pupil","Iris","Optic nerve","Retina"],c:3,e:"The retina lines the back of the eye and contains rods and cones that perform phototransduction — converting light into neural signals. These travel via the optic nerve to the brain."},
{sub:"Vision — The Eye",q:"The fovea is important because it:",opts:["Contains the highest concentration of rods for night vision","Is where the optic nerve exits the eye","Has the highest concentration of cones, providing sharpest vision","Regulates the amount of light entering the eye"],c:2,e:"The fovea centralis contains only cones — densely packed — and is the point of highest visual acuity. When you focus on something, you're centering it on your fovea."},
{sub:"Vision — The Eye",q:"Visual sensation occurs in the retina, but visual perception primarily occurs in the:",opts:["Frontal lobe","Temporal lobe","Occipital lobe","Parietal lobe"],c:2,e:"The primary visual cortex (V1) in the occipital lobe is where visual information first arrives from the thalamus (LGN) for initial processing. Further 'what' and 'where' processing continues in temporal and parietal streams."},
{sub:"Vision — The Eye",q:"Dark adaptation is the process of:",opts:["Cones becoming more sensitive when lights are turned on","Shifting from cone-dominated to rod-dominated vision in low-light conditions","Pupil constriction in response to bright light","The brain adjusting color perception under different lighting"],c:1,e:"Dark adaptation takes ~20-30 minutes for rods to reach full sensitivity. Rods contain rhodopsin, a photopigment that bleaches in bright light and regenerates in darkness — enabling night vision."},
{sub:"Vision — The Eye",q:"Light enters the eye in which order?",opts:["Retina → lens → cornea → optic nerve","Cornea → pupil → lens → retina → optic nerve","Iris → cornea → retina → optic nerve","Lens → cornea → pupil → fovea"],c:1,e:"Light follows a path: cornea (first refraction) → pupil (amount control by iris) → lens (fine focus/accommodation) → retina (transduction) → optic nerve (signal to brain)."},
{sub:"Vision — The Eye",q:"Which structure controls the amount of light entering the eye by changing the pupil's size?",opts:["Cornea","Lens","Retina","Iris"],c:3,e:"The iris is the colored muscular ring around the pupil. It contracts in bright light (smaller pupil) and dilates in dim light (larger pupil) to regulate the amount of light reaching the retina."},
{sub:"Vision — The Eye",q:"Why is it easier to see a faint star at night by looking slightly to the side rather than directly at it?",opts:["The cornea is most transparent in peripheral regions","Peripheral regions of the retina have higher cone density","Peripheral areas have higher rod density — better for low-light detection","The lens accommodates better for peripheral viewing"],c:2,e:"Rod density is highest in the periphery (away from the fovea). By looking slightly off-center, you project the faint star onto rod-rich peripheral retina, which is much more light-sensitive than the cone-dominated fovea."},
{sub:"Vision — The Eye",q:"Visual information from the retina travels to the brain via the:",opts:["Optic disc","Ciliary muscle","Optic nerve to the LGN of the thalamus","Directly to the occipital cortex without relay"],c:2,e:"The optic nerve carries signals from retinal ganglion cells to the lateral geniculate nucleus (LGN) of the thalamus, which then projects to primary visual cortex (V1) in the occipital lobe."},
{sub:"Vision — The Eye",q:"A person reads fine print easily in bright light but has great difficulty in dim light. This pattern suggests:",opts:["Damaged rods but intact cones","Damaged cones but intact rods","An optic nerve disorder","Damage to the primary visual cortex"],c:0,e:"Fine print requires the high acuity of cones, which work in bright light. If rods are damaged, dim-light vision is impaired. The preserved fine-print ability in bright light points to intact cone function."},
// ── Color Vision ─────────────────────────────────────────────────────────
{sub:"Color Vision",q:"The trichromatic theory of color vision proposes that color perception results from:",opts:["Opponent-process pairs in ganglion cells","Three types of cones sensitive to different wavelengths","The brain comparing signals from rods and cones","A single broad-spectrum photoreceptor adjusting sensitivity"],c:1,e:"The trichromatic (Young-Helmholtz) theory: three cone types — short (blue), medium (green), long (red/yellow) — combine their outputs, with all perceived colors arising from relative activation of these three."},
{sub:"Color Vision",q:"Which color vision theory best explains afterimages?",opts:["Trichromatic theory","Feature detection theory","Opponent-process theory","Place theory"],c:2,e:"Opponent-process theory explains afterimages: staring at red fatigues the red cells in red/green opponent pairs; looking away reveals a green afterimage as the opponent channel rebounds."},
{sub:"Color Vision",q:"At which level of the visual system does opponent-process color coding primarily occur?",opts:["In the cones of the retina","In the rods during dark adaptation","In ganglion cells and the LGN of the thalamus","In the primary somatosensory cortex"],c:2,e:"Trichromatic coding occurs at the receptor (cone) level. Opponent-process coding — where signals are combined into opposing color channels — occurs at the ganglion cell level and continues in the LGN and cortex."},
{sub:"Color Vision",q:"The most common form of color blindness involves difficulty distinguishing:",opts:["Blue and yellow","Red and green","Light and dark","All colors equally"],c:1,e:"Red-green color blindness is most common, caused by deficiency or absence of the long-wavelength (red) or medium-wavelength (green) cone type. It is X-linked recessive, more common in males."},
{sub:"Color Vision",q:"Why is red-green color blindness more common in males than females?",opts:["Males have fewer cones than females","The gene for red-green color blindness is on the X chromosome (X-linked recessive)","Males have lower absolute thresholds for color","Testosterone reduces cone sensitivity"],c:1,e:"Red-green color blindness is X-linked recessive. Males have only one X chromosome, so one copy of the faulty gene causes it. Females need two faulty copies (one on each X) — much less likely."},
{sub:"Color Vision",q:"After staring at a green square for 30 seconds and then looking at a white wall, you would most likely see:",opts:["A green afterimage","A blue afterimage","A red afterimage","A yellow afterimage"],c:2,e:"Staring at green fatigues the green/red opponent cells' green signal. When you look away, the red channel rebounds — producing a red afterimage on the white background (opponent color)."},
{sub:"Color Vision",q:"Both the trichromatic theory and opponent-process theory are accepted in modern science because:",opts:["They apply to different species of animals","Trichromatic coding occurs at the cones; opponent-process coding occurs at ganglion cells and beyond","One explains color vision while the other explains brightness","They were discovered simultaneously and neither has been disproven"],c:1,e:"The two theories operate at different levels of the visual system — they're complementary, not competing. Trichromatic: three cone types. Opponent-process: how cone signals are combined for further processing."},
{sub:"Color Vision",q:"A person with protanopia is missing the long-wavelength (red) cone. They would most likely confuse which pair of colors?",opts:["Blue and yellow","Black and white","Red and green","Orange and purple"],c:2,e:"Without the long-wavelength cone, the person cannot discriminate between wavelengths that would normally stimulate red vs. green differently — causing red-green confusion (protanopia is a type of red-green color blindness)."},
{sub:"Color Vision",q:"Which physical property of light corresponds to the perceived color (hue)?",opts:["Amplitude","Frequency/wavelength","Purity","Intensity"],c:1,e:"Hue (color) is determined by the wavelength of light — red ~700nm, green ~530nm, blue ~470nm. Amplitude (intensity) corresponds to brightness/loudness, not hue."},
{sub:"Color Vision",q:"A painter mixes red and green paint and gets a dark brownish color, but a physicist mixing red and green light gets yellow. This illustrates:",opts:["The trichromatic theory's inconsistency","Subtractive (paint) vs. additive (light) color mixing","The opponent-process theory in action","A difference between rods and cones"],c:1,e:"Mixing paint is subtractive (pigments absorb certain wavelengths). Mixing light is additive (wavelengths combine). Red + green light = yellow because both stimulate medium and long cones together."},
{sub:"Color Vision",q:"Color constancy refers to the tendency to:",opts:["See colors more vividly in the center of the visual field","Perceive object colors as stable across different lighting conditions","Adapt to high contrast environments faster","Prefer warmer colors in dim lighting"],c:1,e:"Color constancy allows us to perceive an apple as red whether seen under sunlight or fluorescent light. The visual system automatically compensates for changes in lighting conditions."},
{sub:"Color Vision",q:"The concept of opponent-process color pairs predicts that there is no such thing as:",opts:["Violet light","Ultraviolet light","Reddish-green or bluish-yellow","Monochromatic white"],c:2,e:"Because red/green and blue/yellow are opponent pairs — one inhibits the other — you cannot perceive a color that's simultaneously reddish AND greenish, or simultaneously bluish AND yellowish."},
// ── Hearing ───────────────────────────────────────────────────────────────
{sub:"Hearing",q:"The physical property of sound waves that corresponds to perceived pitch is:",opts:["Amplitude","Purity","Frequency","Intensity"],c:2,e:"Frequency (Hz) determines pitch — high frequency = high pitch (like a piccolo); low frequency = low pitch (like a bass drum). The human auditory range is roughly 20–20,000 Hz."},
{sub:"Hearing",q:"The perceived loudness of a sound corresponds to the sound wave's:",opts:["Frequency","Wavelength","Amplitude","Purity/timbre"],c:2,e:"Amplitude is the height of a sound wave and corresponds to the intensity/loudness perceived. Larger amplitude = louder sound. Loudness is measured in decibels (dB)."},
{sub:"Hearing",q:"In the ear, the ossicles (malleus, incus, stapes) are found in the:",opts:["Outer ear","Middle ear","Inner ear","Cochlea"],c:1,e:"The three tiny bones (ossicles) — hammer/malleus, anvil/incus, stirrup/stapes — are in the middle ear. They mechanically amplify sound vibrations from the tympanic membrane to the oval window."},
{sub:"Hearing",q:"Sound transduction — the conversion of vibrations into neural signals — occurs when which structures are bent in the cochlea?",opts:["The tympanic membrane","The ossicles","The hair cells on the basilar membrane","The oval window"],c:2,e:"Hair cells sitting on the basilar membrane inside the cochlea are the actual mechanoreceptors of hearing. When sound-driven fluid waves flex the basilar membrane, hair cells bend and generate neural signals."},
{sub:"Hearing",q:"Place theory of pitch perception proposes that:",opts:["The rate of neural firing corresponds to sound frequency","Different locations on the basilar membrane respond maximally to different frequencies","High-pitched sounds stimulate rods rather than cones","Pitch is determined by the pattern of ossicle vibration"],c:1,e:"Place theory: the cochlea is tonotopically organized — high frequencies vibrate the base of the basilar membrane; low frequencies vibrate the apex. The brain reads location as pitch (best for high frequencies)."},
{sub:"Hearing",q:"Frequency theory (volley theory) of pitch perception proposes that:",opts:["Different areas of the basilar membrane correspond to different pitches","The rate of neural firing matches the frequency of the sound wave","Loudness and pitch are processed by the same neural pathway","Hair cells classify sound frequency by their location in the cochlea"],c:1,e:"Frequency/volley theory states that neurons fire at the same rate as the sound frequency — allowing the brain to code pitch from firing rate. Best explains low-frequency sounds (<4,000 Hz)."},
{sub:"Hearing",q:"Sensorineural hearing loss (most common permanent hearing loss) is caused by:",opts:["Blockage of the ear canal","Damage to the eardrum or ossicles","Damage to the hair cells or auditory nerve","Brain damage to Wernicke's area"],c:2,e:"Sensorineural deafness results from damaged hair cells (e.g., from loud noise, aging — presbycusis) or auditory nerve damage. Unlike conduction deafness, it is generally not correctable by amplification alone."},
{sub:"Hearing",q:"The correct pathway of sound through the ear is:",opts:["Oval window → ossicles → tympanic membrane → cochlea","Tympanic membrane → ossicles → oval window → cochlea → auditory nerve","Cochlea → ossicles → tympanic membrane → auditory nerve","Outer ear canal → cochlea → ossicles → auditory nerve"],c:1,e:"Sound waves: ear canal → tympanic membrane (vibrates) → ossicles (amplify) → oval window → cochlear fluid waves → basilar membrane → hair cells → auditory nerve → auditory cortex."},
{sub:"Hearing",q:"Hair cells in the cochlea cannot regenerate after damage. This explains why:",opts:["Noise-induced hearing loss is usually temporary","Prolonged exposure to loud sounds causes permanent sensorineural hearing loss","Conduction deafness is more serious than sensorineural deafness","The absolute threshold for hearing decreases with age"],c:1,e:"Unlike some animals, humans cannot regenerate cochlear hair cells. Once destroyed by loud noise, disease, or aging, the hearing loss is permanent — a key reason hearing protection matters."},
{sub:"Hearing",q:"Conduction deafness differs from sensorineural deafness in that it involves:",opts:["Damage to hair cells in the cochlea","Damage to the auditory nerve","Problems with mechanical transmission in the outer or middle ear","Damage to the auditory cortex in the temporal lobe"],c:2,e:"Conduction deafness involves a problem with the physical transmission of sound (blocked ear canal, ruptured eardrum, damaged ossicles). It is often treatable with surgery or hearing aids."},
