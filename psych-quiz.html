<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psych 100 @ MSU - Practice Exam 3</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161921;
    --surface2: #1e2230;
    --border: #2a2f42;
    --accent: #7c6af7;
    --accent2: #c084fc;
    --green: #4ade80;
    --red: #f87171;
    --text: #e8eaf6;
    --muted: #7c8099;
    --gold: #f9c74f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; line-height: 1.6; }

  header {
    background: linear-gradient(135deg, #161921 0%, #1a1040 100%);
    border-bottom: 1px solid var(--border);
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 1.35rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-right { display: flex; align-items: center; gap: 1.5rem; }

  .score-badge { display: flex; gap: 1.25rem; align-items: center; }
  .stat { text-align: center; }
  .stat-num { font-size: 1.35rem; font-weight: 700; font-family: 'Playfair Display', serif; }
  .stat-num.green { color: var(--green); }
  .stat-num.red { color: var(--red); }
  .stat-num.gold { color: var(--gold); }
  .stat-label { color: var(--muted); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; }

  .history-toggle {
    color: var(--muted); background: none; border: 1px solid var(--border);
    padding: 0.45rem 0.9rem; border-radius: 8px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 0.78rem; font-weight: 500; transition: all 0.2s;
  }
  .history-toggle:hover { border-color: var(--accent); color: var(--text); }

  main { max-width: 860px; margin: 0 auto; padding: 1.75rem 1.5rem 4rem; }

  .topic-section { margin-bottom: 1.75rem; }
  .topic-section h2 {
    font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--muted);
    margin-bottom: 0.9rem; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 400;
  }
  .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 0.65rem; }

  .topic-btn {
    background: var(--surface); border: 2px solid var(--border);
    color: var(--text); padding: 0.85rem 1rem; border-radius: 12px; cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500;
    text-align: left; transition: all 0.2s;
  }
  .topic-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .topic-btn.active { border-color: var(--accent); background: rgba(124,106,247,0.15); }
  .topic-icon { font-size: 1.2rem; display: block; margin-bottom: 0.25rem; }
  .topic-name { display: block; font-weight: 600; }
  .topic-sub { display: block; color: var(--muted); font-size: 0.72rem; margin-top: 0.1rem; }

  .subtopic-bar {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 0.75rem 1.1rem; margin-bottom: 1.4rem;
    display: flex; align-items: center; gap: 0.65rem; font-size: 0.78rem; flex-wrap: wrap;
  }
  .sub-label { color: var(--muted); flex-shrink: 0; }
  .sub-name { color: var(--accent2); font-weight: 600; flex: 1; min-width: 120px; }
  .sub-count { color: var(--muted); font-size: 0.72rem; white-space: nowrap; }

  .progress-bar { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 1.75rem; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 2px; transition: width 0.4s ease; }

  .question-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 1.9rem 1.9rem 1.5rem; margin-bottom: 1.5rem;
    position: relative; overflow: hidden; animation: slideIn 0.28s ease;
  }
  @keyframes slideIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .question-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .q-meta { display:flex; align-items:center; gap:0.55rem; margin-bottom:1.1rem; flex-wrap:wrap; }
  .q-num { font-size:0.72rem; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:0.1em; }
  .q-tag { font-size:0.68rem; padding:0.18rem 0.55rem; border-radius:20px; font-weight:600; letter-spacing:0.04em; }
  .q-sub-tag { font-size:0.68rem; background:rgba(255,255,255,0.05); color:var(--muted); padding:0.18rem 0.55rem; border-radius:20px; }

  .q-text { font-size:1.08rem; font-weight:500; line-height:1.65; margin-bottom:1.6rem; }

  .options { display:flex; flex-direction:column; gap:0.6rem; }
  .opt-btn {
    background:var(--surface2); border:2px solid var(--border); color:var(--text);
    padding:0.85rem 1.2rem; border-radius:10px; cursor:pointer;
    font-family:'DM Sans',sans-serif; font-size:0.93rem; font-weight:400;
    text-align:left; transition:all 0.17s; display:flex; align-items:flex-start; gap:0.7rem; line-height:1.5;
  }
  .opt-btn:hover:not(:disabled) { border-color:var(--accent); background:rgba(124,106,247,0.08); transform:translateX(3px); }
  .opt-btn:disabled { cursor:default; }
  .opt-btn.correct { border-color:var(--green); background:rgba(74,222,128,0.1); color:var(--green); }
  .opt-btn.wrong { border-color:var(--red); background:rgba(248,113,113,0.1); color:var(--red); }
  .opt-btn.reveal { border-color:var(--green); background:rgba(74,222,128,0.06); opacity:0.7; }
  .opt-lbl { font-weight:700; font-size:0.82rem; min-width:1.4rem; color:var(--muted); flex-shrink:0; transition:color 0.17s; }
  .opt-btn.correct .opt-lbl { color:var(--green); }
  .opt-btn.wrong .opt-lbl { color:var(--red); }

  .feedback {
    margin-top:1.1rem; padding:0.9rem 1.1rem; border-radius:10px;
    font-size:0.88rem; line-height:1.6; animation:fadeIn 0.22s ease;
  }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  .feedback.cf { background:rgba(74,222,128,0.08); border:1px solid rgba(74,222,128,0.3); color:#a7f3d0; }
  .feedback.wf { background:rgba(248,113,113,0.08); border:1px solid rgba(248,113,113,0.3); color:#fecaca; }
  .feedback strong { font-weight:700; }

  .next-btn {
    display:flex; align-items:center; gap:0.45rem;
    background:linear-gradient(135deg, var(--accent), var(--accent2)); color:white; border:none;
    padding:0.85rem 1.65rem; border-radius:10px; cursor:pointer;
    font-family:'DM Sans',sans-serif; font-size:0.93rem; font-weight:600;
    margin-top:1.1rem; transition:all 0.2s; box-shadow:0 4px 18px rgba(124,106,247,0.3);
  }
  .next-btn:hover { transform:translateY(-2px); box-shadow:0 6px 26px rgba(124,106,247,0.4); }
  .next-btn:disabled { opacity:0.38; cursor:not-allowed; transform:none; box-shadow:none; }

  .history-panel {
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:1.4rem; margin-bottom:1.4rem; max-height:320px; overflow-y:auto;
  }
  .history-panel h3 {
    font-family:'Playfair Display',serif; font-size:0.9rem; margin-bottom:0.9rem;
    color:var(--muted); text-transform:uppercase; letter-spacing:0.08em;
  }
  .h-item { display:flex; align-items:flex-start; gap:0.7rem; padding:0.55rem 0; border-bottom:1px solid var(--border); font-size:0.82rem; line-height:1.4; }
  .h-item:last-child { border-bottom:none; }
  .h-dot { width:7px; height:7px; border-radius:50%; margin-top:0.3rem; flex-shrink:0; }
  .h-dot.c { background:var(--green); }
  .h-dot.w { background:var(--red); }
  .h-q { color:var(--text); }
  .h-tag { color:var(--muted); font-size:0.72rem; }

  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  @media(max-width:600px){
    header{padding:1rem;}
    .score-badge{gap:0.9rem;}
    .stat-num{font-size:1.1rem;}
    main{padding:1rem 1rem 3rem;}
    .question-card{padding:1.4rem 1.1rem 1.1rem;}
    .topic-grid{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="logo">Psych Exam 3 ✦</div>
  <div class="header-right">
    <div class="score-badge">
      <div class="stat">
        <div class="stat-num green" id="sc">0</div>
        <div class="stat-label">Correct</div>
      </div>
      <div class="stat">
        <div class="stat-num red" id="sw">0</div>
        <div class="stat-label">Wrong</div>
      </div>
      <div class="stat">
        <div class="stat-num gold" id="st">0</div>
        <div class="stat-label">Total</div>
      </div>
    </div>
    <button class="history-toggle" onclick="toggleHistory()">History</button>
  </div>
</header>

<main>
  <div class="history-panel" id="hist-panel" style="display:none">
    <h3>Question History</h3>
    <div id="hist-list"></div>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="prog" style="width:0%"></div></div>

  <div class="topic-section">
    <h2>Choose a Topic</h2>
    <div class="topic-grid">
      <button class="topic-btn active" onclick="setTopic('all')" id="btn-all">
        <span class="topic-icon">🧠</span>
        <span class="topic-name">All Topics</span>
        <span class="topic-sub">Random mix · 141 questions</span>
      </button>
      <button class="topic-btn" onclick="setTopic('biopsychology')" id="btn-biopsychology">
        <span class="topic-icon">🔬</span>
        <span class="topic-name">Biopsychology</span>
        <span class="topic-sub">Ch. 3 · 40 questions</span>
      </button>
      <button class="topic-btn" onclick="setTopic('emotion_motivation')" id="btn-emotion_motivation">
        <span class="topic-icon">❤️‍🔥</span>
        <span class="topic-name">Emotion &amp; Motivation</span>
        <span class="topic-sub">Ch. 10 · 19 questions</span>
      </button>
      <button class="topic-btn" onclick="setTopic('social_psychology')" id="btn-social_psychology">
        <span class="topic-icon">👥</span>
        <span class="topic-name">Social Psychology</span>
        <span class="topic-sub">Ch. 12 · 22 questions</span>
      </button>
      <button class="topic-btn" onclick="setTopic('stress_health')" id="btn-stress_health">
        <span class="topic-icon">🌿</span>
        <span class="topic-name">Stress &amp; Health</span>
        <span class="topic-sub">Ch. 14 · 17 questions</span>
      </button>
      <button class="topic-btn" onclick="setTopic('psychological_disorders')" id="btn-psychological_disorders">
        <span class="topic-icon">🧩</span>
        <span class="topic-name">Psych Disorders</span>
        <span class="topic-sub">Ch. 15 · 24 questions</span>
      </button>
      <button class="topic-btn" onclick="setTopic('therapy_treatment')" id="btn-therapy_treatment">
        <span class="topic-icon">🛋️</span>
        <span class="topic-name">Therapy &amp; Treatment</span>
        <span class="topic-sub">Ch. 16 · 19 questions</span>
      </button>
    </div>
  </div>

  <div class="subtopic-bar" id="sub-bar">
    <span class="sub-label">Subtopic:</span>
    <span class="sub-name" id="sub-name">—</span>
    <span class="sub-count" id="sub-count"></span>
  </div>

  <div id="qa"></div>
</main>

<script>
const QUESTION_BANK = {
  "biopsychology": [
    {
      "q": "The observable physical and behavioral characteristics of an organism, resulting from both its genotype and environmental influences, is called its: ________________.",
      "opts": [
        "Genotype",
        "Phenotype",
        "Allele",
        "Chromosome"
      ],
      "c": 1,
      "sub": "3.1 Human Genetics",
      "e": "The phenotype is the expressed, observable trait \u2014 what you can actually see or measure \u2014 while the genotype is the underlying genetic code."
    },
    {
      "q": "Tasha has blue eyes even though one of her parents has brown eyes. This means the blue eye gene she carries is most likely: ________________.",
      "opts": [
        "Dominant",
        "Codominant",
        "Recessive",
        "Polygenic"
      ],
      "c": 2,
      "sub": "3.1 Human Genetics",
      "e": "Recessive traits are only expressed when two copies of the recessive allele are present, which is why a child can show a trait neither parent visibly displays if both parents are carriers."
    },
    {
      "q": "The full set of genetic material \u2014 all the DNA \u2014 contained in an organism is referred to as its: ________________.",
      "opts": [
        "Phenotype",
        "Genome",
        "Chromosome",
        "Allele"
      ],
      "c": 1,
      "sub": "3.1 Human Genetics",
      "e": "The genome is the complete genetic blueprint of an organism, containing all the information needed to build and maintain that organism."
    },
    {
      "q": "Darwin's theory of natural selection argues that traits that enhance an organism's ability to survive and reproduce will: ________________.",
      "opts": [
        "Become recessive over time",
        "Be passed to offspring and increase in the population",
        "Disappear within a generation",
        "Only appear in dominant alleles"
      ],
      "c": 1,
      "sub": "3.1 Human Genetics",
      "e": "Natural selection favors heritable traits that improve survival and reproduction \u2014 those traits are more likely to be passed on, increasing their frequency over generations."
    },
    {
      "q": "Sickle cell anemia is caused by: ________________.",
      "opts": [
        "A dominant allele on the X chromosome",
        "A single gene mutation affecting red blood cell shape",
        "Multiple polygenic factors interacting",
        "An environmental trigger with no genetic basis"
      ],
      "c": 1,
      "sub": "3.1 Human Genetics",
      "e": "Sickle cell anemia results from a single gene mutation that alters hemoglobin, causing red blood cells to form a rigid sickle shape that can block blood vessels."
    },
    {
      "q": "An individual who carries one copy of a recessive allele for a disease but does not show symptoms is called a: ________________.",
      "opts": [
        "Homozygote",
        "Phenotype carrier",
        "Genetic carrier",
        "Dominant expresser"
      ],
      "c": 2,
      "sub": "3.1 Human Genetics",
      "e": "A genetic carrier has one normal and one recessive allele. They don't show the disorder but can pass the recessive allele to their children."
    },
    {
      "q": "Researchers studying whether genetics or environment plays a larger role in intelligence would most likely conduct: ________________.",
      "opts": [
        "A case study",
        "A twin study",
        "A cross-sectional study",
        "A naturalistic observation"
      ],
      "c": 1,
      "sub": "3.1 Human Genetics",
      "e": "Twin studies compare identical (MZ) twins who share 100% of their DNA with fraternal (DZ) twins who share ~50%, allowing researchers to tease apart genetic and environmental contributions."
    },
    {
      "q": "The field that studies how environmental factors can affect gene expression without changing the underlying DNA sequence is called: ________________.",
      "opts": [
        "Molecular psychology",
        "Epigenetics",
        "Behavioral genetics",
        "Neuroscience"
      ],
      "c": 1,
      "sub": "3.1 Human Genetics",
      "e": "Epigenetics examines how experiences and environments can turn genes on or off, influencing behavior without altering the actual DNA sequence."
    },
    {
      "q": "The part of a neuron that receives incoming signals from other neurons is the: ________________.",
      "opts": [
        "Axon",
        "Terminal button",
        "Dendrite",
        "Myelin sheath"
      ],
      "c": 2,
      "sub": "3.2 Cells of the Nervous System",
      "e": "Dendrites are the branch-like extensions of a neuron that receive incoming chemical signals from neighboring neurons and send them toward the cell body."
    },
    {
      "q": "When a neuron fires an action potential, information travels from the cell body down the: ________________.",
      "opts": [
        "Dendrite",
        "Myelin sheath",
        "Axon",
        "Synapse"
      ],
      "c": 2,
      "sub": "3.2 Cells of the Nervous System",
      "e": "The axon is the long tail-like projection that carries the electrical signal (action potential) away from the cell body toward the terminal buttons."
    },
    {
      "q": "Myelin is a fatty substance that wraps around the axon and functions to: ________________.",
      "opts": [
        "Receive neurotransmitters",
        "Slow down nerve impulses",
        "Speed up the transmission of nerve impulses",
        "Store neurotransmitters"
      ],
      "c": 2,
      "sub": "3.2 Cells of the Nervous System",
      "e": "The myelin sheath acts like insulation on an electrical wire, allowing the action potential to jump between gaps (nodes of Ranvier) and travel much faster along the axon."
    },
    {
      "q": "Neurotransmitters are released from the _________________ and bind to receptors on the _________________.",
      "opts": [
        "Dendrite; axon",
        "Terminal buttons; dendrites of the next neuron",
        "Cell body; myelin sheath",
        "Axon; cell body"
      ],
      "c": 1,
      "sub": "3.2 Cells of the Nervous System",
      "e": "Neurotransmitters are packaged in vesicles at the terminal buttons and released into the synapse, where they float across and bind to receptor sites on the receiving neuron's dendrites."
    },
    {
      "q": "Glial cells differ from neurons primarily in that they: ________________.",
      "opts": [
        "Cannot be found in the brain",
        "Do not fire action potentials and primarily support neurons",
        "Transmit signals faster than neurons",
        "Are only found in the peripheral nervous system"
      ],
      "c": 1,
      "sub": "3.2 Cells of the Nervous System",
      "e": "Glial cells (like astrocytes, microglia, and oligodendrocytes) support, nourish, and protect neurons, but unlike neurons they do not generate or transmit electrical signals."
    },
    {
      "q": "The gap between the terminal button of one neuron and the dendrite of the next is called the: ________________.",
      "opts": [
        "Node of Ranvier",
        "Refractory period",
        "Synapse",
        "Action potential"
      ],
      "c": 2,
      "sub": "3.2 Cells of the Nervous System",
      "e": "The synapse (or synaptic cleft) is the tiny gap between neurons where chemical communication takes place via neurotransmitters."
    },
    {
      "q": "Which neurotransmitter is most associated with reward, motivation, and is heavily implicated in addiction?",
      "opts": [
        "Serotonin",
        "GABA",
        "Dopamine",
        "Acetylcholine"
      ],
      "c": 2,
      "sub": "3.2 Cells of the Nervous System",
      "e": "Dopamine plays a central role in the brain's reward system. Drugs of abuse hijack this system by flooding the synapse with dopamine, producing intense feelings of pleasure."
    },
    {
      "q": "An action potential follows the all-or-none principle, which means: ________________.",
      "opts": [
        "A neuron either fires at full strength or not at all",
        "A neuron fires more strongly when stimulated more strongly",
        "Only some neurons are capable of firing",
        "Neurons can only fire once per minute"
      ],
      "c": 0,
      "sub": "3.2 Cells of the Nervous System",
      "e": "The all-or-none law means that once a neuron reaches its threshold of excitation, it fires at full intensity every time. The neuron cannot fire a 'partial' action potential."
    },
    {
      "q": "Reuptake refers to the process by which: ________________.",
      "opts": [
        "Neurotransmitters are broken down by enzymes",
        "The sending neuron reabsorbs unused neurotransmitters from the synapse",
        "The receiving neuron produces its own neurotransmitters",
        "Myelin is repaired after an action potential"
      ],
      "c": 1,
      "sub": "3.2 Cells of the Nervous System",
      "e": "Reuptake is one way that neurotransmitter action is terminated \u2014 the sending neuron pulls the neurotransmitter molecules back in to be recycled. SSRIs work by blocking this process for serotonin."
    },
    {
      "q": "The central nervous system (CNS) consists of the: ________________.",
      "opts": [
        "Brain and spinal cord",
        "Brain and peripheral nerves",
        "Somatic and autonomic systems",
        "Sympathetic and parasympathetic systems"
      ],
      "c": 0,
      "sub": "3.3 Parts of the Nervous System",
      "e": "The CNS \u2014 the brain and spinal cord \u2014 is the control center for all neural processing. Everything outside of it is part of the peripheral nervous system (PNS)."
    },
    {
      "q": "Maria's heart is racing, her palms are sweating, and her pupils are dilated before a big presentation. Which branch of the autonomic nervous system is responsible?",
      "opts": [
        "Somatic",
        "Parasympathetic",
        "Sympathetic",
        "Central"
      ],
      "c": 2,
      "sub": "3.3 Parts of the Nervous System",
      "e": "The sympathetic nervous system prepares the body for 'fight or flight' by increasing heart rate, redirecting blood to muscles, and suppressing digestion."
    },
    {
      "q": "After the stressful exam is over, Derek feels his heart rate slow down and his appetite return. This is the _________________ nervous system at work.",
      "opts": [
        "Sympathetic",
        "Somatic",
        "Central",
        "Parasympathetic"
      ],
      "c": 3,
      "sub": "3.3 Parts of the Nervous System",
      "e": "The parasympathetic nervous system promotes 'rest and digest' \u2014 it slows the heart rate, stimulates digestion, and helps the body return to a calm baseline state."
    },
    {
      "q": "Sensory neurons carry information _________________ the central nervous system, while motor neurons carry information _________________ it.",
      "opts": [
        "Away from; toward",
        "Toward; away from",
        "Within; outside",
        "Outside; within"
      ],
      "c": 1,
      "sub": "3.3 Parts of the Nervous System",
      "e": "Sensory (afferent) neurons transmit signals TO the CNS from sense organs. Motor (efferent) neurons carry signals FROM the CNS to muscles and glands to produce a response."
    },
    {
      "q": "The branch of the peripheral nervous system that controls voluntary muscle movements is the: ________________.",
      "opts": [
        "Autonomic nervous system",
        "Sympathetic nervous system",
        "Parasympathetic nervous system",
        "Somatic nervous system"
      ],
      "c": 3,
      "sub": "3.3 Parts of the Nervous System",
      "e": "The somatic nervous system controls skeletal muscles and voluntary movement. When you decide to raise your hand, it's the somatic system relaying that command."
    },
    {
      "q": "The _________________ is the brain structure most associated with forming new long-term memories.",
      "opts": [
        "Amygdala",
        "Cerebellum",
        "Hippocampus",
        "Thalamus"
      ],
      "c": 2,
      "sub": "3.4 The Brain and Spinal Cord",
      "e": "The hippocampus is critical for encoding new declarative (explicit) memories. Damage to this structure, as in H.M.'s case, results in the inability to form new long-term memories."
    },
    {
      "q": "Rosa is in a car accident and afterward has difficulty controlling her balance and coordinating her movements. She likely suffered damage to her: ________________.",
      "opts": [
        "Frontal lobe",
        "Cerebellum",
        "Hippocampus",
        "Medulla"

const TOPIC_META = {
  biopsychology:           { label: 'Biopsychology',          color: '#a78bfa' },
  emotion_motivation:      { label: 'Emotion & Motivation',   color: '#fb923c' },
  social_psychology:       { label: 'Social Psychology',      color: '#34d399' },
  stress_health:           { label: 'Stress & Health',        color: '#60a5fa' },
  psychological_disorders: { label: 'Psych Disorders',        color: '#f472b6' },
  therapy_treatment:       { label: 'Therapy & Treatment',    color: '#facc15' }
};

const ALL_TOPICS = Object.keys(TOPIC_META);

let currentTopic = 'all';
let correct = 0, wrong = 0, total = 0;
let answered = false;

const queues = {};
const queueIndices = {};
ALL_TOPICS.forEach(t => {
  queues[t] = shuffle([...QUESTION_BANK[t]]);
  queueIndices[t] = 0;
});

let allCursor = 0;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function getNextQuestion(topicKey) {
  let idx = queueIndices[topicKey];
  if (idx >= queues[topicKey].length) {
    queues[topicKey] = shuffle([...QUESTION_BANK[topicKey]]);
    queueIndices[topicKey] = 0;
    idx = 0;
  }
  const item = queues[topicKey][queueIndices[topicKey]];
  queueIndices[topicKey]++;
  return { item, topicKey };
}

function pickTopic() {
  if (currentTopic !== 'all') return currentTopic;
  const t = ALL_TOPICS[allCursor % ALL_TOPICS.length];
  allCursor++;
  return t;
}

function setTopic(t) {
  currentTopic = t;
  document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + t).classList.add('active');
  nextQ();
}

function toggleHistory() {
  const p = document.getElementById('hist-panel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
}

function updateStats() {
  document.getElementById('sc').textContent = correct;
  document.getElementById('sw').textContent = wrong;
  document.getElementById('st').textContent = total;
  const pct = total > 0 ? (correct / total) * 100 : 0;
  document.getElementById('prog').style.width = pct + '%';
}

function addHistory(q, topicLabel, sub, ok) {
  const list = document.getElementById('hist-list');
  const d = document.createElement('div');
  d.className = 'h-item';
  d.innerHTML = `<div class="h-dot ${ok ? 'c' : 'w'}"></div><div>
    <div class="h-q">${q.substring(0, 88)}${q.length > 88 ? '…' : ''}</div>
    <div class="h-tag">${topicLabel} › ${sub}</div></div>`;
  if (list.firstChild) list.insertBefore(d, list.firstChild);
  else list.appendChild(d);
}

function nextQ() {
  answered = false;
  const topicKey = pickTopic();
  const { item } = getNextQuestion(topicKey);
  const meta = TOPIC_META[topicKey];
  const bankSize = QUESTION_BANK[topicKey].length;

  total++;
  updateStats();

  document.getElementById('sub-name').textContent = item.sub;
  document.getElementById('sub-count').textContent = `${queueIndices[topicKey]}/${bankSize} done in this topic`;

  const labels = ['A', 'B', 'C', 'D'];
  const optsHTML = item.opts.map((o, i) => `
    <button class="opt-btn" onclick="answer(${i},${item.c})" id="o${i}">
      <span class="opt-lbl">${labels[i]}</span><span>${o}</span>
    </button>`).join('');

  document.getElementById('qa').innerHTML = `
    <div class="question-card">
      <div class="q-meta">
        <span class="q-num">Q${total}</span>
        <span class="q-tag" style="background:${meta.color}22;color:${meta.color}">${meta.label}</span>
        <span class="q-sub-tag">${item.sub}</span>
      </div>
      <div class="q-text">${item.q}</div>
      <div class="options">${optsHTML}</div>
      <div id="fb"></div>
      <button class="next-btn" id="nxt" onclick="nextQ()" disabled>Next Question →</button>
    </div>`;

  window._item = item;
  window._meta = meta;
}

function answer(sel, corr) {
  if (answered) return;
  answered = true;
  const labels = ['A', 'B', 'C', 'D'];
  const ok = sel === corr;
  if (ok) correct++; else wrong++;
  updateStats();
  addHistory(window._item.q, window._meta.label, window._item.sub, ok);

  for (let i = 0; i < 4; i++) {
    const b = document.getElementById('o' + i);
    b.disabled = true;
    if (i === corr) b.classList.add(ok && i === sel ? 'correct' : 'reveal');
    if (i === sel && !ok) b.classList.add('wrong');
  }

  document.getElementById('fb').innerHTML = `
    <div class="feedback ${ok ? 'cf' : 'wf'}">
      ${ok
        ? `<strong>✓ Correct!</strong> ${window._item.e}`
        : `<strong>✗ Incorrect.</strong> The correct answer was <strong>${labels[corr]}: ${window._item.opts[corr]}</strong>. ${window._item.e}`
      }
    </div>`;

  document.getElementById('nxt').disabled = false;
}

nextQ();
