{sub:"Hearing",q:"Auditory sensation occurs primarily in the cochlea, while auditory perception occurs in the:",opts:["Frontal lobe","Parietal lobe","Occipital lobe","Temporal lobe's auditory cortex"],c:3,e:"The primary auditory cortex in the temporal lobe (Heschl's gyrus) is where sound information from the cochlea (via thalamus) is first consciously processed — turning raw auditory data into meaningful sound."},
{sub:"Hearing",q:"Which part of the ear amplifies vibrations from the eardrum to the oval window?",opts:["Cochlea","Hair cells","Semicircular canals","Ossicles (malleus, incus, stapes)"],c:3,e:"The three ossicles form a mechanical amplification system, increasing the force of vibrations by concentrating them onto the much smaller oval window — necessary for driving the denser cochlear fluid."},
{sub:"Hearing",q:"A musician's hearing test shows severe high-frequency hearing loss but normal low-frequency hearing. This pattern is most consistent with:",opts:["Damage to the apex of the basilar membrane","Damage to the base of the basilar membrane (place theory)","Damage to the ossicles","Blockage of the ear canal"],c:1,e:"Per place theory, the base of the basilar membrane responds to high frequencies. Noise-induced damage often starts at the base — explaining why high-frequency loss precedes low-frequency loss."},
// ── The Other Senses ──────────────────────────────────────────────────────
{sub:"The Other Senses",q:"Gate-control theory proposes that pain signals can be reduced by:",opts:["Increasing sympathetic nervous system activity","Applying non-painful stimulation to the same area (closing the gate in the spinal cord)","Blocking the thalamus from relaying signals","Increasing neurotransmitter production in the cortex"],c:1,e:"Gate-control theory: non-painful stimulation (rubbing, pressure, acupuncture) activates large-diameter nerve fibers that 'close the gate' in the spinal cord, blocking pain signals from reaching the brain."},
{sub:"The Other Senses",q:"The five basic tastes recognized by human taste receptors are:",opts:["Spicy, sour, sweet, salty, bitter","Sweet, salty, sour, bitter, umami","Sweet, sour, bitter, spicy, savory","Umami, sweet, bitter, astringent, salty"],c:1,e:"The five canonical basic tastes are sweet (sugars), salty (sodium ions), sour (acids), bitter (alkaloids — potential toxins), and umami (glutamate — savory, protein-rich foods)."},
{sub:"The Other Senses",q:"The olfactory system (smell) is unique among sensory systems because it:",opts:["Has the highest absolute threshold of all senses","Projects directly to the amygdala and hippocampus without first relaying through the thalamus","Is processed in the parietal lobe rather than the temporal lobe","Relies on rods and cones like the visual system"],c:1,e:"Olfactory signals travel directly to the amygdala (emotion) and hippocampus (memory) without the thalamic relay used by other senses — explaining the powerful emotional and memory responses to smells."},
{sub:"The Other Senses",q:"Proprioception refers to the sense of:",opts:["Pain from internal organs","Taste and chemical detection","Body position, limb location, and movement","Temperature change on the skin surface"],c:2,e:"Proprioception (from Latin 'one's own') is the sense of the body's position and movement, provided by receptors in muscles, tendons, and joints. It allows coordinated movement without visual feedback."},
{sub:"The Other Senses",q:"The vestibular sense, located in the inner ear, provides information about:",opts:["Air pressure and altitude","Sound frequencies below 20 Hz","Balance, spatial orientation, and head movement","The temperature of the environment"],c:2,e:"The vestibular system (semicircular canals and otolith organs) detects head rotation and linear acceleration, providing crucial information for maintaining balance and coordinating eye movements."},
{sub:"The Other Senses",q:"Motion sickness is caused by:",opts:["Excessive sensitivity of the vestibular system","Conflicting signals between the vestibular system (inner ear) and the visual system","Overstimulation of the olfactory system","Damage to semicircular canals from movement"],c:1,e:"Motion sickness occurs when visual input (seeing a static environment inside a boat) conflicts with vestibular input (feeling motion). The brain interprets this sensory mismatch as potential poisoning, triggering nausea."},
{sub:"The Other Senses",q:"According to gate-control theory, why does rubbing a banged knee help reduce pain?",opts:["It releases endorphins from the brain","It cools the skin, activating temperature receptors that suppress pain","Non-painful touch activates large fibers that close the 'gate' in the spinal cord","It distracts the thalamus from processing pain signals"],c:2,e:"Rubbing activates large-diameter mechanoreceptor fibers. In the dorsal horn of the spinal cord, these signals inhibit the small-diameter pain (nociceptor) fibers from relaying signals upward — 'closing the gate.'"},
{sub:"The Other Senses",q:"Why does food taste different when you have a cold with a blocked nose?",opts:["Cold viruses directly damage taste buds","Mucus blocks taste receptors in the throat","Much of what we call taste is actually smell; blocked olfaction dramatically reduces flavor perception","Inflammation increases the absolute threshold for all chemical senses"],c:2,e:"Roughly 70-80% of flavor perception depends on retronasal olfaction (smell). Taste buds detect only basic tastes; the rich complexity of flavor comes from volatile chemicals detected by the olfactory system."},
{sub:"The Other Senses",q:"Which type of skin receptor is most sensitive to light, feathery touch?",opts:["Free nerve endings (nociceptors)","Pacinian corpuscles","Meissner's corpuscles","Ruffini endings"],c:2,e:"Meissner's corpuscles are especially sensitive to light touch and texture, concentrated in fingertips. Pacinian corpuscles respond to deep pressure and vibration; free nerve endings detect pain and temperature."},
{sub:"The Other Senses",q:"Phantom limb pain — where amputees feel pain in a limb that no longer exists — supports which theory of pain?",opts:["Specific nerve energy theory (each receptor only detects one thing)","Gate-control theory (the spinal gate is disrupted without normal input)","Transduction theory (pain requires a physical stimulus)","Signal detection theory (pain is purely psychological)"],c:1,e:"Gate-control theory: without normal sensory input from the amputated limb, the spinal gate may stay open, allowing spontaneous pain signals to reach the brain — explaining phantom pain despite no physical tissue damage."},
{sub:"The Other Senses",q:"The semicircular canals in the inner ear detect:",opts:["Sound frequencies below 20 Hz","Head rotation in three planes (roll, pitch, yaw)","Changes in gravitational pull on the body","The temperature and pressure of fluids entering the ear"],c:1,e:"The three semicircular canals are oriented in three perpendicular planes, detecting angular acceleration (head rotation). The otolith organs (utricle and saccule) detect linear acceleration and gravity."},
{sub:"The Other Senses",q:"The fact that the smell of a specific perfume can immediately evoke a vivid memory of a deceased grandparent is best explained by:",opts:["The high absolute threshold of the olfactory system","Olfactory signals projecting directly to hippocampus and amygdala without thalamic relay","The parietal lobe's role in integrating sensory memories","Olfactory adaptation reducing attention to other memories"],c:1,e:"Olfaction's direct pathway to the hippocampus and amygdala (without thalamic detour) gives smell uniquely strong and immediate connections to both episodic memories and emotional responses."},
// ── Gestalt Principles of Perception ─────────────────────────────────────
{sub:"Gestalt Principles",q:"The Gestalt principle of proximity states that:",opts:["Objects that look similar are grouped together","Objects moving in the same direction are perceived as a group","Objects near each other tend to be perceived as belonging together","We tend to complete incomplete figures into whole shapes"],c:2,e:"Proximity: the closer objects are to each other, the more likely we are to perceptually group them. This is why dots closer together look like pairs or clusters."},
{sub:"Gestalt Principles",q:"The Gestalt principle of figure-ground refers to the tendency to:",opts:["Group objects that share similar features","Perceive one element as the object (figure) and another as the background (ground)","Perceive smooth continuous lines rather than sharp angles","Fill in missing parts of a figure to see it as whole"],c:1,e:"Figure-ground segregation is fundamental — we automatically parse scenes into objects (figures) and backgrounds (ground). Rubin's vase ambiguously alternates between a vase (figure) and two faces (figure)."},
{sub:"Gestalt Principles",q:"When you perceive a circle as continuous even though parts of it are missing (only three arcs are drawn), you are demonstrating the Gestalt principle of:",opts:["Proximity","Similarity","Common fate","Closure"],c:3,e:"Closure: the brain fills in gaps in incomplete figures to perceive a whole. We don't see three separate arcs — we see a circle, because the brain prefers complete, familiar forms."},
{sub:"Gestalt Principles",q:"The Gestalt principle of similarity means that:",opts:["Objects that are close together are grouped","Elements that look alike — same color, shape, or size — are grouped together","Moving objects are perceived as a unit","We prefer the simplest interpretation of a visual scene"],c:1,e:"Similarity: elements sharing visual properties (color, shape, orientation, size) are grouped perceptually. A row of red dots among blue dots seems to form two separate groups due to color similarity."},
{sub:"Gestalt Principles",q:"A flock of birds all flying in the same direction is perceived as a single unit rather than 300 individual birds. This demonstrates the Gestalt principle of:",opts:["Proximity","Closure","Similarity","Common fate"],c:3,e:"Common fate: elements moving in the same direction and at the same speed are perceived as belonging together. This grouping principle is evolutionarily useful for detecting predators or prey."},
{sub:"Gestalt Principles",q:"The Gestalt principle of good continuation (continuity) predicts that:",opts:["We prefer to perceive things as complete rather than partial","We group elements that are close to each other","We perceive lines as following the smoothest, most continuous path rather than making sharp turns","We complete figures even when parts are missing"],c:2,e:"Continuity: the brain follows smooth, continuous contours rather than abrupt direction changes. Two curved lines crossing are perceived as two crossing curves, not as two angles meeting at a point."},
{sub:"Gestalt Principles",q:"The overarching Gestalt principle called 'Prägnanz' (law of good form) states that:",opts:["We always prefer the most complex possible interpretation","We group similar and close objects together","We perceive the simplest, most regular, and stable interpretation possible","We fill in gaps in figures to see them as complete"],c:2,e:"Prägnanz (German for 'conciseness') is the master principle: the perceptual system seeks the most economical, regular, and symmetrical interpretation — simple and stable over complex and ambiguous."},
{sub:"Gestalt Principles",q:"Looking at overlapping shapes, you automatically know which shape is in front even though you only see the visible portions. Which Gestalt principle is most responsible?",opts:["Proximity","Similarity","Continuity","Figure-ground and closure"],c:3,e:"Figure-ground segregation identifies one shape as the figure (in front) and the other as ground. Closure fills in the hidden portions. Together these Gestalt principles allow perception of overlapping objects."},
{sub:"Gestalt Principles",q:"Gestalt psychologists summarized their view with the saying:",opts:["The mind is a blank slate shaped by experience","The whole is greater than the sum of its parts","Perception is determined by stimulus intensity","Sensation precedes and determines perception"],c:1,e:"'The whole is greater than the sum of its parts' captures Gestalt's core insight: perceptual grouping creates organization that is richer than the individual elements would suggest individually."},
{sub:"Gestalt Principles",q:"Which Gestalt principle explains why soldiers in camouflage are hard to see — they visually blend with the background?",opts:["Proximity","Common fate","Similarity","Closure"],c:2,e:"Camouflage exploits the similarity principle: if the soldier's colors and patterns match the environment, the brain groups them with the background rather than segregating the soldier as a figure."},
{sub:"Gestalt Principles",q:"A visual display shows a row of: ● ● ● ○ ○ ● ● ● ○ ○. Most people see groups of three filled and two empty circles. Which Gestalt principles are at work?",opts:["Common fate and continuity","Proximity and similarity","Closure and figure-ground","Prägnanz and common fate"],c:1,e:"Proximity (dots near each other are grouped) and similarity (filled circles are similar to each other, open circles to each other) both work together to create the perceived groups."},
{sub:"Gestalt Principles",q:"Subjective (illusory) contours — like seeing a bright triangle in the Kanizsa figure even when no triangle is drawn — demonstrate which principle?",opts:["Common fate","Similarity","Closure","Proximity"],c:2,e:"Closure causes the brain to 'fill in' edges between the wedge-shaped gaps to create a complete, solid-appearing triangle. The perceived contours don't physically exist in the stimulus."},
// ── Depth Perception & Perceptual Constancy ───────────────────────────────
{sub:"Depth Perception & Constancy",q:"Retinal disparity is a binocular depth cue because:",opts:["Both eyes focus on the same point identically","Each eye receives a slightly different view, and the brain computes depth from the difference","One eye is dominant and suppresses the other's input","The retina changes shape to adjust for depth"],c:1,e:"Retinal (binocular) disparity: your two eyes are ~6 cm apart, giving each a slightly different view. The brain computes depth from the degree of disparity — larger disparity = closer object."},
{sub:"Depth Perception & Constancy",q:"Which of the following is a monocular (one-eye) depth cue?",opts:["Retinal disparity","Convergence","Linear perspective","Binocular parallax"],c:2,e:"Linear perspective (parallel lines converging in the distance) works with one eye. Retinal disparity and convergence both require two eyes. Monocular cues are used in paintings and photographs."},
{sub:"Depth Perception & Constancy",q:"When you move your head and nearby objects seem to move faster than distant objects, you are experiencing:",opts:["Binocular disparity","Motion parallax","Linear perspective","Texture gradient"],c:1,e:"Motion parallax: during head movement, close objects appear to move rapidly in the opposite direction while distant objects move slowly in the same direction. It's a powerful monocular depth cue."},
{sub:"Depth Perception & Constancy",q:"Size constancy means that we perceive objects as:",opts:["Looking the same size regardless of viewing angle","Maintaining constant size despite changes in their retinal image size with distance","Always being the same physical size as familiar objects","Being larger when attended to and smaller when ignored"],c:1,e:"Size constancy: despite a distant car producing a tiny retinal image, we perceive it as car-sized because the brain compensates for distance. This keeps our perception of object size stable."},
{sub:"Depth Perception & Constancy",q:"The Müller-Lyer illusion (two lines with inward vs. outward arrowheads appearing different lengths) demonstrates:",opts:["A failure of binocular disparity processing","Perceptual constancy in depth perception","How contextual cues (learned depth cues) override actual stimulus properties","A deficiency in the opponent-process color system"],c:2,e:"The Müller-Lyer illusion shows that learned depth/distance cues (arrowheads suggesting corners — inside corner vs. outside corner of a building) can override accurate length perception."},
{sub:"Depth Perception & Constancy",q:"A painting that uses texture gradient to create an impression of depth does so by:",opts:["Drawing distant objects larger than near ones","Making the texture appear coarser and more detailed in the distance","Showing objects appearing less detailed and more densely packed with distance","Blurring near objects and sharpening distant ones"],c:2,e:"Texture gradient: surfaces closer to you appear with coarse, distinct texture; as distance increases, the texture becomes finer and more densely packed. The brain interprets this gradient as depth."},
{sub:"Depth Perception & Constancy",q:"Convergence as a depth cue refers to:",opts:["Eyes moving outward when viewing distant objects","Both eyes rotating inward (crossing) for near objects, with muscle feedback signaling distance","The convergence of parallel lines at a distant vanishing point","Lens accommodation changing for different distances"],c:1,e:"Convergence: for nearby objects, the two eyes rotate inward (medial rotation). Proprioceptive feedback from the eye muscles signals the degree of convergence, allowing the brain to estimate distance."},
{sub:"Depth Perception & Constancy",q:"Interposition (overlap) as a depth cue works because:",opts:["Objects that are farther away appear smaller","An object partially blocking another is perceived as closer than the blocked object","We assume all objects are equal in size unless told otherwise","Overlapping colors create a blending effect that signals depth"],c:1,e:"Interposition: when one object partially occludes (covers) another, the occluding object is unambiguously closer. This is a powerful monocular depth cue available in 2D images."},
{sub:"Depth Perception & Constancy",q:"Shape constancy means that a door viewed at a steep angle is still perceived as rectangular even though its retinal image is a trapezoid. This is an example of:",opts:["Bottom-up processing overriding prior knowledge","The brain correcting for viewing angle to maintain stable object perception","Perceptual set creating an expectation of rectangles","Gestalt closure filling in the missing rectangular shape"],c:1,e:"Shape constancy: the visual system uses knowledge of an object's actual shape and current viewing angle to compensate — ensuring we perceive the door as the same shape regardless of how we view it."},
{sub:"Depth Perception & Constancy",q:"3D movies work by exploiting which depth cue?",opts:["Motion parallax","Texture gradient","Retinal disparity (binocular)","Convergence"],c:2,e:"3D movies present slightly different images to each eye (via polarized or color-filtered glasses), artificially creating retinal disparity. The brain interprets this as depth, creating a stereoscopic effect."},
{sub:"Depth Perception & Constancy",q:"Color constancy — perceiving a green apple as green under both sunlight and indoor lighting — is an example of:",opts:["Sensory adaptation to different wavelengths","Bottom-up processing adjusting to the light source","The visual system correcting for illumination to maintain stable color perception","Opponent-process theory in action"],c:2,e:"Color constancy: the brain automatically compensates for changes in illumination, preserving perceived surface colors despite changes in the physical wavelengths reaching the eye."},
{sub:"Depth Perception & Constancy",q:"Aerial (atmospheric) perspective is the depth cue based on:",opts:["Distant objects appearing larger due to atmospheric magnification","Distant objects appearing hazier, lower in contrast, and more bluish","Nearby objects moving faster during head movements","Parallel lines appearing to converge in the distance"],c:1,e:"Aerial perspective: atmospheric particles scatter light, making distant objects appear hazier, lower in contrast, and shifted toward blue. Landscape painters use this to convey depth on a flat canvas."}
], // END SENSATION

lifespan: [
// ── Research Methods & Domains ────────────────────────────────────────────
{sub:"Research Methods & Domains",q:"The three domains of developmental psychology are:",opts:["Biological, psychological, and social","Physical, cognitive, and socioemotional","Genetic, environmental, and cultural","Prenatal, postnatal, and adult"],c:1,e:"Developmental psychology organizes changes across the lifespan into physical (body/brain), cognitive (thinking/language), and socioemotional (relationships/personality) domains."},
{sub:"Research Methods & Domains",q:"In a cross-sectional study of cognitive aging, a researcher compares 20-, 40-, and 60-year-olds at the same time. A major limitation of this design is:",opts:["The study takes too long to complete","Cohort effects — the age groups grew up in different historical eras and may differ for reasons unrelated to age","The sample is too small for valid conclusions","It cannot assess cognitive ability accurately"],c:1,e:"Cross-sectional studies confound age with cohort (generation) effects. Differences between the groups might reflect different historical experiences (education, technology, nutrition) rather than pure aging."},
{sub:"Research Methods & Domains",q:"Longitudinal research designs are superior to cross-sectional designs in which way?",opts:["They take less time and are less expensive","They eliminate all confounding variables","They track individual change over time, separating age from cohort effects","They allow comparison of multiple age groups simultaneously"],c:2,e:"Longitudinal designs follow the same individuals over time, allowing researchers to observe actual developmental change in the same people. The tradeoff is that they are expensive, time-consuming, and prone to attrition."},
{sub:"Research Methods & Domains",q:"Teratogens are most dangerous during the __________ period of prenatal development.",opts:["Germinal","Fetal","Embryonic","Neonatal"],c:2,e:"The embryonic period (weeks 2-8) is when major organs are forming. This is when teratogens like alcohol, rubella, or certain drugs can most severely disrupt organ development, sometimes fatally."},
{sub:"Research Methods & Domains",q:"Fetal Alcohol Syndrome (FAS), caused by prenatal alcohol exposure, is characterized by:",opts:["Accelerated physical growth but delayed language acquisition","Intellectual disability, distinctive facial features, and behavioral problems","Mild learning disabilities without physical symptoms","A specific pattern of autism-spectrum features"],c:1,e:"FAS is one of the most preventable causes of intellectual disability. Alcohol is a powerful teratogen causing intellectual disability, characteristic facial features (thin upper lip, smooth philtrum), and behavioral problems."},
{sub:"Research Methods & Domains",q:"The nature vs. nurture debate in developmental psychology refers to the question of:",opts:["Whether development follows universal stages or culturally specific patterns","Whether biological maturation or environmental experience shapes development — and the answer is they interact","Whether cognitive development precedes emotional development","Whether children develop similarly across all cultures"],c:1,e:"The debate concerns the relative roles of heredity (nature) and environment (nurture). Modern developmental psychology recognizes these are inseparable — genes and environments continuously interact."},
{sub:"Research Methods & Domains",q:"The continuous vs. discontinuous development debate concerns whether:",opts:["Development is the same in all cultures vs. culture-specific","Development proceeds by smooth, gradual quantitative changes vs. through qualitatively distinct stages","Nature determines development vs. nurture","Development in adulthood continues at the same rate as in childhood"],c:1,e:"Continuity theorists (like behaviorists) see development as gradual quantitative accumulation. Stage theorists (Piaget, Erikson) see it as qualitatively distinct jumps — the child is fundamentally different at different stages."},
{sub:"Research Methods & Domains",q:"A critical/sensitive period in development refers to:",opts:["A time when development is completely determined by genetics","A window of time during which specific experiences are especially necessary or influential for development","A stage when development becomes more important than at other times","The period of most rapid physical growth"],c:1,e:"Critical/sensitive periods are windows when the organism is especially responsive to specific environmental inputs. For language, early childhood is sensitive — exposure to language during this time shapes later linguistic competence."},
{sub:"Research Methods & Domains",q:"Which of the following represents the socioemotional domain of development?",opts:["Learning to walk","Developing logical reasoning ability","Forming attachment bonds with caregivers","Brain myelination during adolescence"],c:2,e:"Socioemotional development includes personality, emotional regulation, relationships, and social understanding. Attachment is a central socioemotional milestone of infancy."},
{sub:"Research Methods & Domains",q:"A stability-vs-change question in development asks whether:",opts:["Prenatal development predicts adult outcomes","Early personality characteristics persist throughout life or can change substantially","Physical development is more stable than cognitive development","Environmental factors are stable or changing influences"],c:1,e:"Stability vs. change: do people's traits, temperaments, and behaviors remain consistent over the lifespan, or can significant change occur? Research shows both stability AND change depending on the characteristic."},
{sub:"Research Methods & Domains",q:"Sequential research designs combine cross-sectional and longitudinal approaches. Their primary advantage is:",opts:["They require fewer participants than either approach alone","They can separate age effects, cohort effects, and time-of-testing effects","They eliminate the need for control groups","They are less expensive than either design alone"],c:1,e:"Sequential designs study multiple cohorts over time, allowing researchers to distinguish true age-related changes from cohort effects (different generations) and time-of-testing effects (historical events)."},
{sub:"Research Methods & Domains",q:"Which of the following best exemplifies a change in the physical domain of development?",opts:["An adolescent discovering their personal values and identity","A toddler beginning to use two-word sentences","A child learning to conserve volume (Piaget)","An infant gaining head and trunk control before leg control"],c:3,e:"Cephalocaudal (head-to-toe) motor development — gaining control from head downward — is a physical domain change involving brain maturation and muscle development."},
// ── Prenatal Development ──────────────────────────────────────────────────
{sub:"Prenatal Development",q:"During which prenatal stage does implantation occur?",opts:["Fetal period","Embryonic period","Germinal period","Neonatal period"],c:2,e:"The germinal period (conception to ~2 weeks) includes rapid cell division (creating a blastocyst) and implantation in the uterine wall. The placenta begins forming during this period."},
{sub:"Prenatal Development",q:"The embryonic period spans approximately:",opts:["Conception to 2 weeks","2 to 8 weeks after conception","8 weeks to birth","3 to 6 months of pregnancy"],c:1,e:"The embryonic period (weeks 2-8) is when the major organs and body systems differentiate and form. By week 8, the embryo has recognizable human features and is about 1 inch long."},
{sub:"Prenatal Development",q:"What is the primary role of the placenta during prenatal development?",opts:["Providing structural support for the growing fetus","Exchanging nutrients and oxygen between mother and fetus while filtering some (but not all) toxins","Producing the hormones that trigger labor","Generating new neurons for the developing brain"],c:1,e:"The placenta is a lifeline — it transfers oxygen, nutrients, and antibodies from mother to fetus and removes waste products. However, it cannot filter out all teratogens, including alcohol."},
{sub:"Prenatal Development",q:"During the fetal period, which development is most prominent?",opts:["Initial organ formation and differentiation","Implantation in the uterine wall","Rapid growth, brain development, and refinement of organ systems","Formation of the heart and limb buds"],c:2,e:"The fetal period (week 8 to birth) involves rapid growth, extensive brain development (including neuronal migration and synaptogenesis), and refinement of previously formed organs — moving from viability to readiness for birth."},
{sub:"Prenatal Development",q:"Why is the embryonic period considered the most critical window of vulnerability to teratogens?",opts:["The placenta has not yet formed to protect the embryo","Major organs are actively differentiating — disruption can cause permanent structural abnormalities","The fetus is large enough to be affected by chemicals","Neural development is not yet occurring"],c:1,e:"Organogenesis occurs during the embryonic period — each organ has a specific sensitive window. A teratogen at week 4 might affect the heart; at week 6, the limbs. This is why early pregnancy is most critical."},
{sub:"Prenatal Development",q:"Fetal viability — the ability to survive outside the womb with medical support — typically begins around:",opts:["16 weeks","22-26 weeks","30 weeks","Term (40 weeks)"],c:1,e:"Viability begins around 22-26 weeks when the lungs and brain are sufficiently developed. Before this, survival outside the womb is not possible even with intensive medical care."},
{sub:"Prenatal Development",q:"Which of the following is NOT a characteristic feature of Fetal Alcohol Syndrome?",opts:["Intellectual disability","Distinctive facial abnormalities (e.g., thin upper lip)","Behavioral and learning problems","Accelerated physical growth"],c:3,e:"FAS is associated with intellectual disability, growth deficiencies (not acceleration), distinctive facial features, and behavioral/learning problems. Alcohol is a growth-restricting, not growth-promoting, teratogen."},
{sub:"Prenatal Development",q:"The zygote is produced when:",opts:["Implantation in the uterine wall is completed","A sperm cell fertilizes an egg cell","The blastocyst differentiates into three cell layers","The placenta begins forming"],c:1,e:"The zygote is the initial single cell formed immediately at fertilization — containing the full complement of 46 chromosomes (23 from each parent). Rapid mitotic cell division then begins."},
{sub:"Prenatal Development",q:"Which statement about teratogens is most accurate?",opts:["All teratogens cause the same type of damage regardless of timing","Teratogen effects depend on timing, dose, and genetic susceptibility","Teratogens only affect neural development, not physical structure","The placenta protects against all environmental teratogens"],c:1,e:"Teratogen effects are dose-dependent, timing-specific (what is affected depends on what's developing), and modulated by genetic vulnerability. There are no universally 'safe' doses of teratogens like alcohol."},
{sub:"Prenatal Development",q:"The germinal period is characterized by:",opts:["Formation of major organs and systems","Rapid cell division and implantation in the uterine wall","Rapid weight gain and final organ maturation","Differentiation into the three primary germ layers"],c:1,e:"The germinal period (first 2 weeks) is about multiplication and implantation: the zygote divides rapidly into a blastocyst, travels down the fallopian tube, and implants in the uterine lining."},
{sub:"Prenatal Development",q:"Neurogenesis (production of new neurons) peaks during which prenatal period?",opts:["Germinal period","Late fetal period","Embryonic period and early fetal period","The perinatal period (just before birth)"],c:2,e:"Most neurogenesis (neuron production) occurs during the embryonic and early fetal periods — neurons form and then migrate to their appropriate locations in the developing brain. Synaptogenesis continues after birth."},
{sub:"Prenatal Development",q:"A pregnant woman is exposed to rubella (German measles) in week 5 of pregnancy. What is the greatest concern?",opts:["Premature birth","Damage to already-formed organs","Interference with early organ formation during a critical sensitive period","The fetal immune system will eliminate the virus"],c:2,e:"Week 5 is during the embryonic period when major organs are forming. Rubella during this window can disrupt organogenesis, causing cataracts, heart defects, and hearing loss — a classic teratogen effect."},
// ── Piaget's Cognitive Development ───────────────────────────────────────
{sub:"Piaget's Cognitive Development",q:"In Piaget's sensorimotor stage, what is the major cognitive milestone?",opts:["Development of conservation","Emergence of abstract reasoning","Achievement of object permanence","Understanding of logical reversibility"],c:2,e:"Object permanence — understanding that objects continue to exist when out of sight — develops around 8-12 months. Before this, infants act as if objects disappear when hidden ('out of sight, out of mind')."},
{sub:"Piaget's Cognitive Development",q:"Egocentrism in Piaget's preoperational stage means:",opts:["Children are selfish and care only about themselves","Children cannot easily take another person's visual or conceptual perspective","Children can only think about their own needs","Children believe the world was created for them"],c:1,e:"Piagetian egocentrism is cognitive, not moral — young children find it difficult to imagine how a scene looks from a different viewpoint (demonstrated in the three-mountains task)."},
{sub:"Piaget's Cognitive Development",q:"In Piaget's classic conservation task, a child who says the taller glass has 'more water' after water is poured from a short wide glass into a tall thin one is demonstrating:",opts:["Object permanence","Transitive inference","A lack of conservation — focusing on height and ignoring width (centration)","Formal operational thinking"],c:2,e:"Conservation failures in preoperational children reflect centration (focus on one dimension — height — while ignoring width) and irreversibility (inability to mentally reverse the pouring). Conservation is mastered in concrete operations."},
{sub:"Piaget's Cognitive Development",q:"A child who can perform logical operations on concrete objects but struggles with purely hypothetical or abstract problems is in Piaget's __________ stage.",opts:["Sensorimotor","Preoperational","Concrete operational","Formal operational"],c:2,e:"Concrete operational children (ages 7-11) can reason logically about tangible objects and events they can see or manipulate, but hypothetical-deductive reasoning requires the formal operational stage."},
{sub:"Piaget's Cognitive Development",q:"According to Piaget, formal operational thinking begins around age 12 and is characterized by:",opts:["Object permanence and sensorimotor exploration","Conservation and reversible mental operations","Egocentrism and animism","Abstract reasoning and hypothetical-deductive thinking"],c:3,e:"Formal operational thinkers can reason about hypothetical scenarios, consider multiple abstract possibilities simultaneously, and use systematic logical reasoning — not just about what is, but what could be."},
{sub:"Piaget's Cognitive Development",q:"Piaget's concept of 'accommodation' refers to:",opts:["Fitting new information into an existing schema","Modifying an existing schema to fit new information that doesn't fit","The state of balance between existing knowledge and new experience","The process of memorizing new factual information"],c:1,e:"Accommodation: when existing schemas don't work for new information, the child modifies or creates new schemas to accommodate the new experience — a more fundamental form of cognitive change than assimilation."},
{sub:"Piaget's Cognitive Development",q:"Which is an example of assimilation?",opts:["A child who called all four-legged animals 'dog' now creates a new category for 'cat'","A child who calls a cow 'dog' because both are four-legged animals fitting their 'dog' schema","A child realizing that tall glasses can hold the same amount as short glasses","A child understanding that objects exist even when hidden"],c:1,e:"Assimilation: applying an existing schema to new experiences. Calling a cow 'dog' fits new input (four-legged animal) into the existing schema without changing it. When the schema is updated, that's accommodation."},
{sub:"Piaget's Cognitive Development",q:"Animism, common in preoperational children, refers to:",opts:["Believing animals have the same cognitive abilities as humans","Attributing life, feelings, or intentions to inanimate objects","Believing they are at the center of the universe","Understanding that objects persist when out of sight"],c:1,e:"Animism is a preoperational characteristic: young children attribute life and feelings to inanimate objects ('the tree is angry,' 'the car is tired'). This reflects their difficulty distinguishing living from non-living."},
{sub:"Piaget's Cognitive Development",q:"A key criticism of Piaget's theory is that:",opts:["He overemphasized biological maturation and ignored learning","He underestimated the cognitive competence of infants and young children","His stages apply only to Western cultures","He failed to identify any stages of cognitive development"],c:1,e:"Research since Piaget has shown infants demonstrate aspects of object permanence earlier than Piaget thought, and younger children show less egocentrism in simpler tasks. Piaget underestimated early cognitive abilities."},
{sub:"Piaget's Cognitive Development",q:"Reversibility, mastered in concrete operations, means a child can:",opts:["Understand that objects persist when out of sight","Mentally reverse a sequence of events or operations (e.g., that clay rolled into a sausage can be rolled back)","Think about hypothetical future scenarios","Take another person's perspective"],c:1,e:"Reversibility is the understanding that operations can be mentally undone — pouring water back, unrolling clay — and is essential for conservation. It is absent in preoperational children."},
{sub:"Piaget's Cognitive Development",q:"Piaget's four stages are proposed to be:",opts:["Culture-specific and variable in sequence","Universal in sequence but variable in age of achievement","Entirely determined by formal education","Dependent on individual personality differences"],c:1,e:"Piaget claimed the sequence is universal (sensorimotor → preoperational → concrete → formal) because it reflects logical prerequisites. But the ages are approximate, and cross-cultural research shows variation in timing."},
{sub:"Piaget's Cognitive Development",q:"A teenager hypothetically argues: 'If all humans are mortal, and Socrates is human, then Socrates must be mortal.' This demonstrates:",opts:["Concrete operational thinking","Animistic thinking","Formal operational thinking — hypothetical-deductive reasoning","Preoperational egocentrism"],c:2,e:"Hypothetical-deductive reasoning — working from premises to logical conclusions about hypothetical scenarios — is the hallmark of Piaget's formal operational stage, emerging around age 12."},
// ── Vygotsky & Language ──────────────────────────────────────────────────
{sub:"Vygotsky & Language Development",q:"Vygotsky's Zone of Proximal Development (ZPD) is best defined as:",opts:["The child's current level of independent performance","The range between what a child can do independently and what they can do with expert guidance","The age range during which children learn most effectively","The gap between a child's emotional and cognitive development"],c:1,e:"The ZPD is Vygotsky's key concept: tasks too hard for a child alone but achievable with skilled guidance. Effective teaching targets the ZPD — the growing edge of learning."},
{sub:"Vygotsky & Language Development",q:"Scaffolding, in Vygotsky's framework, refers to:",opts:["Using physical tools to help children manipulate objects","Temporary support provided by a more knowledgeable person, gradually withdrawn as the learner gains competence","Building on children's prior knowledge without providing new information","The biological structure underlying language acquisition"],c:1,e:"Scaffolding (from construction: temporary support that's removed once the structure can stand alone) describes how teachers/parents provide calibrated support in the ZPD, fading as the child masters the skill."},
{sub:"Vygotsky & Language Development",q:"Vygotsky interpreted children's private speech (talking to themselves) as:",opts:["A sign of egocentrism that disappears in concrete operations (Piaget's view)","A cognitive tool for guiding thinking and problem-solving, which later becomes internalized as inner speech","Evidence of language delay","A form of social imitation without cognitive function"],c:1,e:"Vygotsky viewed private speech as a self-regulatory cognitive tool. Children talk through problems aloud, and this private speech gradually becomes internalized as silent inner speech — still guiding adult thought."},
{sub:"Vygotsky & Language Development",q:"Chomsky proposed that children acquire language so rapidly and universally because of an innate:",opts:["General learning mechanism that applies to all types of learning","Language Acquisition Device (LAD) providing built-in knowledge of universal grammar","Superior imitation ability compared to other species","Conditioning process driven by parental reinforcement"],c:1,e:"Chomsky's LAD hypothesis: children are biologically pre-equipped with knowledge of universal grammatical rules, explaining why they acquire language rapidly and make systematic errors reflecting grammar, not imitation."},
{sub:"Vygotsky & Language Development",q:"Which sequence of language development milestones is correct?",opts:["First words → babbling → cooing → telegraphic speech","Cooing → babbling → first words → telegraphic speech","Babbling → cooing → first words → two-word sentences","First words → cooing → babbling → telegraphic speech"],c:1,e:"Language develops in a predictable sequence: cooing (2 months) → babbling (4-6 months, all languages) → first words (~12 months) → two-word telegraphic speech (~18-24 months) → full sentences (~2-3 years)."},
{sub:"Vygotsky & Language Development",q:"'Telegraphic speech' (e.g., 'Daddy go,' 'More milk') is characteristic of children at approximately:",opts:["6-12 months","12-18 months","18-24 months","3-4 years"],c:2,e:"Telegraphic speech — two-word utterances omitting function words — emerges around 18-24 months. Like a telegram, only the most essential content words are included."},
{sub:"Vygotsky & Language Development",q:"The sensitive period for language acquisition suggests that:",opts:["Children cannot acquire any language after age 5","Language is best and most easily acquired during early childhood; native-like acquisition becomes more difficult after puberty","All language learning must occur before age 2","Language learning ability is entirely determined by genetics"],c:1,e:"The language sensitive period (especially for phonology and syntax) spans early childhood to puberty. Children exposed to language in this window acquire it naturally; second-language learning becomes harder post-puberty."},
{sub:"Vygotsky & Language Development",q:"Behaviorist Skinner argued that language is acquired through:",opts:["An innate Language Acquisition Device","Imitation and reinforcement — children are rewarded for correct language use","A universal grammar shared by all humans","Sensitive periods and biological maturation alone"],c:1,e:"Skinner proposed that children learn language through operant conditioning — imitation of adult speech is reinforced (praised, rewarded), gradually shaping more complex language. Chomsky's LAD hypothesis emerged as a rebuttal."},
{sub:"Vygotsky & Language Development",q:"Vygotsky emphasized social and cultural factors in cognitive development, contrasting with Piaget, who emphasized:",opts:["Emotional factors and attachment","Internal biological maturation and individual interaction with the physical environment","Reinforcement and punishment from caregivers","Formal education as the primary driver of cognitive change"],c:1,e:"Piaget focused on the individual child's independent exploration and biological maturation as driving cognitive stage development. Vygotsky emphasized social interaction, cultural tools (language), and collaborative learning."},
{sub:"Vygotsky & Language Development",q:"In Vygotsky's view, language is not just a communication tool — it is also:",opts:["An obstacle to logical thinking in young children","A cognitive tool that organizes and regulates thought","Separate from and unrelated to higher cognitive functions","A purely social behavior with no cognitive role"],c:1,e:"Vygotsky's central thesis: language is a psychological tool that transforms thinking. Private and inner speech allow self-regulation and complex reasoning — language shapes thought, not just expresses it."},
{sub:"Vygotsky & Language Development",q:"The 'poverty of the stimulus' argument supports Chomsky's nativist view because:",opts:["Children receive too much language input to learn from it all","Children learn correct grammar despite receiving impoverished, incomplete, and error-containing input — suggesting innate knowledge","The environment provides no examples for language learning","Children in poverty show delayed language development"],c:1,e:"Children hear incomplete sentences, errors, and limited input yet acquire complex, systematic grammar. Chomsky argued this is impossible through learning alone — they must have innate grammatical knowledge to 'fill the gaps.'"},
// ── Erikson's Psychosocial Stages ─────────────────────────────────────────
{sub:"Erikson's Psychosocial Stages",q:"According to Erikson, successfully resolving the Trust vs. Mistrust stage in infancy results in:",opts:["A strong sense of personal identity","Confidence in exploring the environment independently","A basic sense of security and trust in the world","The ability to form intimate romantic relationships"],c:2,e:"When caregivers consistently meet an infant's needs, the child develops basic trust — a foundational belief that the world is safe and dependable. This underpins all subsequent psychosocial development."},
{sub:"Erikson's Psychosocial Stages",q:"The psychosocial stage Autonomy vs. Shame & Doubt occurs during:",opts:["Infancy (0–1 year)","Toddlerhood (1–3 years)","Preschool age (3–6 years)","School age (6–12 years)"],c:1,e:"During toddlerhood, children begin asserting independence (toilet training, choosing). When caregivers support these attempts, autonomy develops. Excessive control or ridicule leads to shame and self-doubt."},
{sub:"Erikson's Psychosocial Stages",q:"A 4-year-old who is encouraged to lead games and ask questions about the world is most likely developing a healthy sense of:",opts:["Trust","Autonomy","Industry","Initiative"],c:3,e:"Initiative vs. Guilt (ages 3-6): when children are given opportunities to initiate activities and explore, they develop initiative. Excessive criticism leads to guilt about their desires and ideas."},
{sub:"Erikson's Psychosocial Stages",q:"A teenager who can clearly answer 'Who am I?' and has committed to values and goals after exploration is said to have achieved:",opts:["Role confusion","Foreclosure","Identity achievement","Identity diffusion"],c:2,e:"Erikson's Stage 5 (Identity vs. Role Confusion): adolescents who explore and commit to a stable identity achieve identity. Marcia calls this 'identity achievement' — the most adaptive status."},
{sub:"Erikson's Psychosocial Stages",q:"Middle-aged adults who feel they are making meaningful contributions through parenting, work, or community involvement are experiencing:",opts:["Ego integrity","Intimacy","Generativity","Industry"],c:2,e:"Generativity vs. Stagnation (Erikson Stage 7): generativity is concern for and contribution to the next generation through parenting, mentoring, or social impact. Failure to achieve this leads to stagnation."},
{sub:"Erikson's Psychosocial Stages",q:"An older adult who reflects on their life with a sense of meaning and satisfaction is demonstrating Erikson's:",opts:["Generativity","Ego integrity","Intimacy","Industry"],c:1,e:"Ego Integrity vs. Despair (Stage 8): those who can look back on their life with acceptance and a sense of meaning achieve ego integrity. Those with regret about unlived lives experience despair."},
{sub:"Erikson's Psychosocial Stages",q:"A school-aged child who consistently fails academically and feels incompetent compared to peers is most at risk for developing:",opts:["Role confusion","Shame and doubt","Inferiority","Isolation"],c:2,e:"Industry vs. Inferiority (ages 6-12): mastering skills → industry (competence). Repeated failure or negative comparisons → inferiority. This stage is heavily influenced by school performance and peer comparisons."},
{sub:"Erikson's Psychosocial Stages",q:"According to Erikson, the central task of young adulthood is:",opts:["Developing a stable identity","Achieving a sense of generativity toward the next generation","Forming deep, committed intimate relationships","Reflecting on life with acceptance"],c:2,e:"Intimacy vs. Isolation (Stage 6, young adulthood): the challenge is developing close, committed relationships. Identity (Stage 5) must be established first — you need to know who you are before truly merging with another."},
{sub:"Erikson's Psychosocial Stages",q:"How many psychosocial stages did Erikson propose?",opts:["4","5","6","8"],c:3,e:"Erikson proposed 8 stages spanning the entire lifespan — from Trust vs. Mistrust in infancy to Ego Integrity vs. Despair in late adulthood. This was a major expansion of Freud's focus on only childhood."},
{sub:"Erikson's Psychosocial Stages",q:"A young professional who has a clear career path, values, and sense of self is most likely in which stage?",opts:["Identity vs. Role Confusion","Intimacy vs. Isolation","Generativity vs. Stagnation","Industry vs. Inferiority"],c:1,e:"A young adult with clear identity is in Erikson's Stage 6 (Intimacy vs. Isolation), where the developmental task shifts from knowing oneself to building close relationships — though overlap between stages exists."},
{sub:"Erikson's Psychosocial Stages",q:"Initiative vs. Guilt (preschool stage) differs from Autonomy vs. Shame (toddler stage) in that initiative involves:",opts:["First steps toward independence","Initiating goals and plans — not just independence — and managing associated guilt when things go wrong","Developing trust in the environment","Competing successfully with peers"],c:1,e:"Autonomy is about self-control and independence; initiative is about planning, goal-setting, and moral judgment. Preschoolers begin asking why, planning imaginative play, and making moral decisions — new cognitive territory."},
{sub:"Erikson's Psychosocial Stages",q:"Which Erikson stage is most relevant for understanding a 55-year-old who volunteers extensively, mentors young employees, and raises their children?",opts:["Intimacy vs. Isolation","Identity vs. Role Confusion","Industry vs. Inferiority","Generativity vs. Stagnation"],c:3,e:"Generativity vs. Stagnation is the central challenge of middle adulthood. This person shows classic generativity — contributing to the welfare of the next generation in multiple ways."},
// ── Attachment Theory ─────────────────────────────────────────────────────
{sub:"Attachment Theory",q:"In Ainsworth's Strange Situation, a securely attached toddler would most likely:",opts:["Show no distress at all when the caregiver leaves","Refuse to explore even when the caregiver is present","Be distressed when the caregiver leaves but quickly soothed and return to play when the caregiver returns","Avoid the caregiver when they return after an absence"],c:2,e:"Securely attached children use the caregiver as a secure base for exploration, are upset when separated, and are easily comforted upon reunion — quickly returning to exploration. Associated with sensitive caregiving."},
{sub:"Attachment Theory",q:"An avoidant attachment pattern in Ainsworth's Strange Situation is characterized by:",opts:["Extreme distress when the caregiver leaves and difficulty being comforted","Freely exploring with the caregiver present and comfort-seeking upon reunion","Little distress when the caregiver leaves and ignoring or avoiding the caregiver upon return","Inconsistent behavior — sometimes seeking, sometimes rejecting the caregiver"],c:2,e:"Avoidant children seem indifferent to separation (though physiological measures show stress) and avoid the caregiver upon return. Associated with consistently unresponsive or emotionally distant caregiving."},
{sub:"Attachment Theory",q:"An anxious/resistant (ambivalent) attachment pattern is associated with which caregiving style?",opts:["Consistently warm and responsive","Consistently cold and rejecting","Inconsistent — sometimes responsive, sometimes neglectful","Frightening or abusive caregiving"],c:2,e:"Inconsistent caregiving creates anxiety because the child cannot predict whether the caregiver will respond. This produces hypervigilant, clingy behavior — ambivalent reunion responses reflect simultaneous desire for and anger at the caregiver."},
{sub:"Attachment Theory",q:"Bowlby's evolutionary theory proposes that attachment is:",opts:["Learned through conditioning — the caregiver becomes associated with food reinforcement","An innate biological system that evolved to keep vulnerable infants close to protective caregivers","A cognitive construction based on the infant's understanding of relationships","Primarily determined by the infant's innate temperament"],c:1,e:"Bowlby: attachment is a biologically driven system — not just about food (challenging Harlow's wire mother study and psychoanalytic theory). Proximity to a caregiver provides survival advantages, selecting for attachment behaviors."},
{sub:"Attachment Theory",q:"According to attachment theory, secure attachment in infancy predicts:",opts:["Higher IQ and academic achievement in adulthood","Better social competence, peer relationships, and emotional regulation in later development","Absence of any psychological difficulties throughout life","Strictly physical health advantages but no psychological benefits"],c:1,e:"Securely attached infants develop internal working models of relationships as reliable and supportive. This predicts better peer relationships, emotional regulation, and social competence — though later experiences matter too."},
{sub:"Attachment Theory",q:"Harry Harlow's experiments with infant monkeys separated from their mothers showed that the monkeys preferred contact with a cloth-covered 'mother' over a wire 'mother' that provided milk. This demonstrated that:",opts:["Feeding is the primary basis of attachment","Contact comfort — not just feeding — is a critical component of attachment","Monkeys do not form attachments the way humans do","The visual appearance of the caregiver is the primary attachment trigger"],c:1,e:"Harlow's study was landmark: it refuted the behaviorist view that attachment is about food reinforcement. Contact comfort (warmth, softness) was more important than the food source in forming attachment bonds."},
{sub:"Attachment Theory",q:"The concept of an 'internal working model' in attachment theory refers to:",opts:["The infant's innate reflexes for seeking caregivers","Mental representations of relationships — expectations about whether others will be responsive — that guide future relationships","A brain structure that controls attachment behavior","The infant's emotional regulation strategies"],c:1,e:"Internal working models are cognitive-emotional schemas about relationships that form based on early attachment experiences. Secure models predict others as reliable; insecure models predict unreliability or rejection."},
{sub:"Attachment Theory",q:"Disorganized attachment (a fourth pattern identified after Ainsworth) is most associated with:",opts:["Inconsistent caregiver responsiveness","Consistently emotionally distant caregivers","Abusive, frightening, or traumatized caregivers","Single-parent households"],c:2,e:"Disorganized attachment is produced when the caregiver is the source of both comfort and fear — creating an irresolvable conflict in the infant. It predicts later difficulties in emotional regulation and relationships."},
{sub:"Attachment Theory",q:"A child who clings to the caregiver even before separation, is intensely distressed when the caregiver leaves, and pushes the caregiver away while also seeking comfort upon return best illustrates:",opts:["Secure attachment","Avoidant attachment","Disorganized attachment","Anxious/resistant (ambivalent) attachment"],c:3,e:"The push-pull reunion behavior — seeking comfort but also showing anger/resistance — and pre-separation anxiety are hallmarks of anxious/resistant attachment, resulting from unpredictable caregiver responsiveness."},
{sub:"Attachment Theory",q:"Which of the following best describes the 'Strange Situation' procedure?",opts:["An experiment where infants are placed alone in an unfamiliar room for extended periods","A standardized observational procedure involving caregiver separations and reunions with a stranger present to assess infant attachment","A survey given to parents about their caregiving styles","An EEG study measuring infant brain activity during social interactions"],c:1,e:"Ainsworth's Strange Situation is an 8-episode structured observation in an unfamiliar lab setting. The key observations are the infant's behavior during caregiver absence and during reunion — revealing attachment quality."},
{sub:"Attachment Theory",q:"Bowlby proposed that infants are biologically equipped with 'attachment behaviors' such as crying, clinging, and smiling. The evolutionary purpose of these behaviors is to:",opts:["Develop social skills for peer relationships","Keep the caregiver close for protection and survival","Establish dominance hierarchies in family systems","Signal cognitive development to caregivers"],c:1,e:"Attachment behaviors (crying, reaching, smiling, following) are all evolved proximity-maintaining behaviors that keep vulnerable infants close to protective adults — serving survival functions in the environment of evolutionary adaptedness."},
// ── Adolescence & Moral Development ──────────────────────────────────────
{sub:"Adolescence & Moral Development",q:"The 'emotional accelerator before brakes' metaphor for adolescent brain development refers to:",opts:["Adolescents experiencing faster emotional processing than adults","The limbic system maturing before the prefrontal cortex, explaining risk-taking behavior","Puberty hormones speeding up all brain processes","Adolescents having better emotional control than children but worse than adults"],c:1,e:"The limbic system (emotion/reward) matures earlier than the prefrontal cortex (impulse control), creating a developmental gap that helps explain adolescent risk-taking, impulsivity, and reward-seeking."},
{sub:"Adolescence & Moral Development",q:"In Kohlberg's preconventional level of moral reasoning, decisions are based on:",opts:["Upholding social laws and rules","Applying universal ethical principles","Self-interest — avoiding punishment or seeking rewards","Seeking social approval and maintaining relationships"],c:2,e:"Preconventional moral reasoning (typical of young children) is ego-centric: 'right' is what avoids punishment (Stage 1) or maximizes personal benefit through exchange (Stage 2). No reference to social rules or others' needs."},
{sub:"Adolescence & Moral Development",q:"A person who follows rules primarily to 'be a good person' and maintain relationships is reasoning at Kohlberg's:",opts:["Preconventional level","Conventional level — Stage 3 (good interpersonal relationships)","Postconventional level — Stage 5","Formal operational level"],c:1,e:"Conventional moral reasoning (Stage 3: good-boy/girl; Stage 4: law and order) is rule-and-socially-guided. Stage 3 specifically emphasizes maintaining relationships and being seen as a good person."},
{sub:"Adolescence & Moral Development",q:"Postconventional moral reasoning in Kohlberg's theory involves:",opts:["Strict adherence to societal laws regardless of consequences","Basing moral decisions on self-interest","Reasoning based on abstract principles like justice or human rights that may supersede specific laws","Following rules to gain social approval"],c:2,e:"Postconventional reasoning (Stage 5: social contract; Stage 6: universal principles) recognizes that laws are human constructions that may be unjust. Civil disobedience for justice is postconventional reasoning."},
{sub:"Adolescence & Moral Development",q:"Marcia's identity status of 'Identity Foreclosure' means:",opts:["The person is actively exploring different identities but hasn't committed yet","The person has no sense of identity and shows no interest in developing one","The person has adopted an identity (usually from parents) without personal exploration","The person has explored and committed to a self-defined identity"],c:2,e:"Foreclosure: commitment without exploration. Often the person adopts the religion, career, or values of their parents without questioning — a stable but potentially fragile identity if those values are later challenged."},
{sub:"Adolescence & Moral Development",q:"Identity Moratorium, in Marcia's framework, is characterized by:",opts:["Active identity exploration without commitment — the 'crisis' phase","Commitment without exploration","No exploration and no commitment","Commitment after thorough exploration"],c:0,e:"Moratorium is the active searching phase — the adolescent is exploring multiple possible identities (questioning beliefs, trying different roles) but hasn't yet committed. Erikson's 'psychosocial moratorium.'"},
{sub:"Adolescence & Moral Development",q:"Carol Gilligan criticized Kohlberg's moral development theory because:",opts:["It ignored biological factors in moral development","It was based primarily on studies of males and may undervalue care-and-relationship-oriented moral reasoning more common in females","It overemphasized self-interest at all stages","His stages don't reflect cross-cultural moral reasoning"],c:1,e:"Gilligan argued Kohlberg's model (based on male samples using abstract justice reasoning) undervalued an 'ethic of care' orientation — concern for relationships and responsibilities — more commonly endorsed by women."},
{sub:"Adolescence & Moral Development",q:"The prefrontal cortex — responsible for impulse control, planning, and long-term thinking — is not fully mature until approximately:",opts:["Age 12-13","Age 16-18","Mid-20s","Age 30"],c:2,e:"Neuroimaging studies show the prefrontal cortex continues developing through the mid-20s. This explains why adolescent and young adult behavior often involves more risk-taking, impulsivity, and sensitivity to peer pressure than adult behavior."},
{sub:"Adolescence & Moral Development",q:"Which Erikson stage is most central to adolescence?",opts:["Initiative vs. Guilt","Industry vs. Inferiority","Identity vs. Role Confusion","Intimacy vs. Isolation"],c:2,e:"Identity vs. Role Confusion (Stage 5, ages 12-18): adolescents explore different roles, values, and beliefs to develop a coherent sense of self. Success = stable identity; failure = role confusion about who they are."},
{sub:"Adolescence & Moral Development",q:"A teenager who says 'Stealing is wrong because it's against the law and we need rules to keep society orderly' is reasoning at Kohlberg's:",opts:["Stage 1 (avoid punishment)","Stage 3 (good relationships)","Stage 4 (law and social order) — conventional level","Stage 5 (social contract) — postconventional level"],c:2,e:"Stage 4 reasoning (law and order) focuses on maintaining the social system through rules and authority. 'The law exists for good reasons' characterizes Stage 4 — within the conventional level."},
{sub:"Adolescence & Moral Development",q:"A person who breaks the law to protest an unjust policy, reasoning that the policy violates fundamental human rights, is demonstrating:",opts:["Stage 2 self-interested reasoning","Preconventional reasoning based on self-interest","Conventional Stage 4 law-and-order reasoning","Postconventional Stage 5/6 reasoning based on universal principles"],c:3,e:"Postconventional reasoning recognizes that laws are social agreements that may be unjust. Principled civil disobedience — accepting legal consequences to challenge an unjust law — is a classic postconventional example (like Gandhi or MLK)."},
// ── Adulthood, Aging & Death ──────────────────────────────────────────────
{sub:"Adulthood, Aging & Death",q:"Which type of intelligence tends to remain stable or increase throughout adulthood?",opts:["Fluid intelligence","Processing speed","Reaction time","Crystallized intelligence"],c:3,e:"Crystallized intelligence (accumulated knowledge, vocabulary, expertise built from experience) is maintained or grows into older adulthood. Fluid intelligence (novel problem-solving, processing speed) declines with age."},
{sub:"Adulthood, Aging & Death",q:"Fluid intelligence differs from crystallized intelligence in that fluid intelligence involves:",opts:["Accumulated vocabulary and factual knowledge","Wisdom and life experience","Flexible reasoning, novel problem-solving, and mental processing speed","Long-term memory for learned skills"],c:2,e:"Fluid intelligence is the raw cognitive capacity — reasoning quickly and flexibly in new situations without relying on prior knowledge. It peaks in the 20s-30s and declines. Crystallized intelligence is experience-based."},
{sub:"Adulthood, Aging & Death",q:"The Kübler-Ross model of grief stages begins with which stage?",opts:["Anger","Bargaining","Denial","Depression"],c:2,e:"Kübler-Ross's five stages of grief/dying (DABDA): Denial → Anger → Bargaining → Depression → Acceptance. The model was derived from observations of terminally ill patients but applies to any major loss."},
{sub:"Adulthood, Aging & Death",q:"In Kübler-Ross's model, 'bargaining' refers to:",opts:["Negotiating with medical staff for better treatment","Making deals or asking 'what if' questions in an attempt to regain control or delay loss","Negotiating the acceptance of death with family members","Seeking a second opinion about a terminal diagnosis"],c:1,e:"Bargaining involves attempts to regain control: 'If I pray more, maybe the cancer will go away,' 'If only I had gone to the doctor sooner.' It's a psychological attempt to delay or alter the inevitable."},
{sub:"Adulthood, Aging & Death",q:"A major limitation of Kübler-Ross's stage model of grief is that:",opts:["It only applies to terminally ill patients, not other types of loss","Stages are fixed and must be experienced in order","Not everyone goes through all stages, they don't occur in a fixed order, and some people cycle through stages multiple times","The model has been completely rejected and replaced in modern research"],c:2,e:"Kübler-Ross herself later clarified that stages are not linear, universal, or required. People may skip stages, revisit them, or not experience some at all. Grief is highly individual."},
{sub:"Adulthood, Aging & Death",q:"Research on successful aging suggests which activity pattern is most associated with maintaining cognitive function in older adults?",opts:["Complete rest and reduced stimulation to prevent overstimulation","Reducing social contact to minimize stress","Staying cognitively active (learning new skills), physically active, and socially engaged","Focusing exclusively on crystallized intelligence tasks like crossword puzzles"],c:2,e:"Successful aging research consistently shows that cognitive, physical, and social activity maintain brain function in older adults. Neuroplasticity persists throughout life — 'use it or lose it' applies to aging."},
{sub:"Adulthood, Aging & Death",q:"Menopause refers to:",opts:["Decreased testosterone levels in men during middle age","Cessation of menstruation in women, typically occurring between ages 45-55","Dramatic hormonal fluctuations in early adolescence","The period of reduced sexual interest in both men and women after age 50"],c:1,e:"Menopause is the natural end of menstrual cycles in women (diagnosed after 12 consecutive months without menstruation), typically 45-55 years. It results from declining estrogen production as the ovaries reduce ovum release."},
{sub:"Adulthood, Aging & Death",q:"Which aspect of memory tends to decline the least with normal aging?",opts:["Working memory capacity","Processing speed","Recall of recent events","Semantic memory (vocabulary and general knowledge)"],c:3,e:"Semantic memory (long-term knowledge of facts, language, meanings) is relatively resilient to aging compared to working memory, processing speed, and episodic memory (memory for specific events)."},
{sub:"Adulthood, Aging & Death",q:"A 70-year-old retired professor who teaches community college courses and mentors young faculty is most likely in which Erikson stage?",opts:["Ego Integrity vs. Despair","Industry vs. Inferiority","Generativity vs. Stagnation","Intimacy vs. Isolation"],c:2,e:"Teaching, mentoring, and contributing to the next generation are classic expressions of generativity — Erikson Stage 7. Active generativity in older adults often bridges Stage 7 and Stage 8."},
{sub:"Adulthood, Aging & Death",q:"The 'sandwich generation' refers to middle-aged adults who:",opts:["Are transitioning between youth and adulthood without a clear identity","Must balance responsibilities for both their aging parents AND their own children","Experience both generativity AND despair simultaneously","Are working in two different careers at the same time"],c:1,e:"The sandwich generation describes middle-aged adults (often 40s-50s) simultaneously caring for their own children AND aging parents — caught 'in the middle' with competing demands from two generations."},
{sub:"Adulthood, Aging & Death",q:"Physical changes in early adulthood that signal the beginning of biological aging typically include:",opts:["Dramatic declines in all physical capabilities starting at 25","No physical changes until the 40s","Gradual declines in metabolism, peak muscle mass, and sensory acuity beginning in the late 20s to 30s","Sudden onset of chronic disease in the mid-30s"],c:2,e:"Peak physical performance occurs in the mid-20s; gradual declines in metabolism, skin elasticity, and sensory acuity begin in the late 20s to 30s. These are gradual and may not be noticed until later unless measured."}
], // END LIFESPAN

personality: [
// ── Defining Personality & Early History ─────────────────────────────────
{sub:"Defining Personality",q:"Personality is best defined as:",opts:["A person's emotional state at any given moment","Characteristic patterns of thinking, feeling, and behaving that are relatively stable across time and situations","The sum of a person's skills and abilities","A person's temperament as observed during infancy"],c:1,e:"Personality is defined by stability and consistency — it distinguishes individuals from each other and persists across different contexts, though it can show some change over the lifespan."},
{sub:"Defining Personality",q:"Temperament differs from personality in that temperament:",opts:["Is entirely shaped by cultural and environmental factors","Develops through education and socialization","Is biologically-based, present from birth, and forms the 'raw material' from which personality develops","Refers only to adult behavioral patterns"],c:2,e:"Temperament is the innate, constitutional aspect of personality observable in infancy. Personality develops when temperament interacts with environmental experiences over time."},
{sub:"Defining Personality",q:"The two core facets of temperament identified across research are:",opts:["Openness and conscientiousness","Introversion and extraversion","Emotionality and activity level","Agreeableness and neuroticism"],c:2,e:"Emotionality (intensity/reactivity of emotional responses) and activity level (energy and pace of movement) are the two most consistently identified dimensions of infant temperament across cultures."},
{sub:"Defining Personality",q:"Phrenology, the pseudoscientific practice of 'reading' personality from skull bumps, was proposed by:",opts:["Freud","Jung","Gall","Allport"],c:2,e:"Franz Josef Gall (early 1800s) proposed phrenology — the idea that personality characteristics are reflected in the contours of the skull overlying developed brain regions. It was completely discredited by empirical research."},
{sub:"Defining Personality",q:"Hippocrates' theory of the four humors proposed that personality is determined by:",opts:["Inheritance from parents","The balance of four bodily fluids — blood, phlegm, yellow bile, and black bile","Early childhood experiences with parents","The person's astrological sign"],c:1,e:"Hippocrates proposed four personality types based on dominant body fluid: sanguine (blood: sociable), phlegmatic (phlegm: calm), choleric (yellow bile: irritable), melancholic (black bile: sad). While incorrect, it presaged biological personality theories."},
{sub:"Defining Personality",q:"Thomas and Chess identified three infant temperament types in their New York Longitudinal Study. Which set is correct?",opts:["Introvert, extrovert, ambivert","Secure, anxious, avoidant","Easy, difficult, slow-to-warm-up","Active, passive, reactive"],c:2,e:"Thomas and Chess followed infants longitudinally and identified three main temperament styles: Easy (~40%: regular, adaptable, positive mood), Difficult (~10%: irregular, slow-adapting, negative), Slow-to-warm-up (~15%: initially negative but gradually adapting)."},
{sub:"Defining Personality",q:"A key feature of personality, as opposed to a momentary mood or behavior, is that it is:",opts:["Observable only during stress or crisis","Completely consistent — never varying across any situations","Relatively stable across time and situations, though not perfectly rigid","Determined entirely by biology with no environmental influence"],c:2,e:"Personality is defined by relative cross-situational and cross-temporal consistency. 'Relatively stable' acknowledges that behavior varies somewhat, but underlying patterns persist — contrasting with transient moods or states."},
{sub:"Defining Personality",q:"Which historical personality approach is now considered a pseudoscience?",opts:["The Big Five trait model","The psychodynamic approach","The MMPI assessment","Phrenology"],c:3,e:"Phrenology — reading personality from skull bumps — has been completely discredited. Modern personality science uses empirically validated methods like self-report inventories, structured observations, and brain imaging."},
{sub:"Defining Personality",q:"Galen's four temperaments (sanguine, choleric, phlegmatic, melancholic) were directly derived from:",opts:["Freud's psychosexual theory","Hippocrates' four humors","Early evolutionary psychology","Observational studies of children"],c:1,e:"Galen expanded Hippocrates' four humors theory into four distinct temperament types that correlated with humor balance — an early proto-trait theory that influenced later personality classification."},
{sub:"Defining Personality",q:"The fact that personality predicts behavior across different situations (at work, at home, with friends) better than any single situation-specific assessment best supports which view?",opts:["Situationism — behavior is entirely determined by the environment","Interactionism — both person and situation contribute","Pure biological determinism of personality","The idea that personality doesn't actually exist"],c:1,e:"Interactionism is the current consensus: personality traits predict behavior best when aggregated across many situations. Both the person (traits) and the situation influence behavior — neither alone tells the whole story."},
{sub:"Defining Personality",q:"A child who reacts intensely to new experiences, cries loudly when upset, and is difficult to soothe fits Thomas and Chess's __________ temperament type.",opts:["Easy","Slow-to-warm-up","Difficult","Anxious"],c:2,e:"The 'difficult' temperament child is characterized by negative reactions to new stimuli, irregular biological rhythms, and slow adaptation. This temperament is associated with greater risk for later behavioral problems if caregiving is not responsive."},
{sub:"Defining Personality",q:"Why is studying personality important for applied settings like hiring, clinical treatment, or education?",opts:["Personality predicts future behavior better than any other single variable","Because personality never changes, assessment can replace all other evaluations","Personality completely determines life outcomes regardless of situation","Because trait labels eliminate the need for further assessment"],c:0,e:"Personality traits predict a wide range of outcomes — job performance, relationship success, health behaviors, mental health risk — making personality assessment valuable in many applied contexts, though no single variable predicts all outcomes perfectly."},
// ── Freud & Psychodynamic Theory ──────────────────────────────────────────
{sub:"Freud & Psychodynamic",q:"According to Freud, the id operates on the:",opts:["Reality principle","Pleasure principle","Moral principle","Constancy principle"],c:1,e:"The id is driven by the pleasure principle — it demands immediate gratification of instinctual drives (sexual and aggressive) without regard for reality or consequences."},
{sub:"Freud & Psychodynamic",q:"Which part of Freud's personality structure acts as the mediator between the id and the superego?",opts:["The unconscious","The id","The ego","The preconscious"],c:2,e:"The ego operates on the reality principle, mediating between the id's demands and the superego's prohibitions. It seeks realistic ways to satisfy drives while navigating moral constraints and external reality."},
{sub:"Freud & Psychodynamic",q:"The superego can be thought of as:",opts:["The primitive, instinctual part of the mind","The rational, reality-testing part of the mind","The internalized moral conscience — the voice of societal rules and parental standards","The unconscious storehouse of repressed memories"],c:2,e:"The superego houses the ego-ideal (standards for excellence) and conscience (internalized prohibitions). It develops ~3-6 years through identification with parents and causes guilt when violated."},
{sub:"Freud & Psychodynamic",q:"During Freud's phallic stage (ages 3-6), boys are proposed to experience:",opts:["Oral fixation leading to dependency","The Oedipus complex — unconscious desire for the mother and rivalry/fear of the father","Anal fixation leading to obsessive-compulsive tendencies","Identification with the mother"],c:1,e:"The Oedipus complex: the boy unconsciously desires the mother and sees the father as a rival. Fear of castration anxiety motivates identification with the father and internalization of his values — resolving the complex."},
