<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dicebound — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --pitch:#12100e;      /* ink black-brown */
  --felt:#1c2a24;       /* table felt */
  --felt-2:#152019;
  --stock:#e7dcc4;      /* card stock */
  --stock-2:#d3c5a6;
  --bone:#f4efe3;
  --brass:#c9973f;
  --oxblood:#a03328;
  --verdigris:#4e8c7d;
  --ink:#221c14;
  --ink-soft:#5d5241;
  --slot:44px;          /* touch floor */
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--pitch);
  color:var(--bone);
  font-family:Inter,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;line-height:1.45;
  overflow:hidden;
  user-select:none;-webkit-user-select:none;
}
h1,h2,h3,.num{font-family:Bitter,Georgia,serif;font-weight:700;letter-spacing:.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

#app{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  max-width:520px;margin:0 auto;
  background:
    radial-gradient(120% 70% at 50% 0%, #24332b 0%, var(--felt) 45%, var(--felt-2) 100%);
  overflow:hidden;
}
#app::after{ /* felt grain */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:radial-gradient(rgba(255,255,255,.05) .5px, transparent .5px);
  background-size:3px 3px;
}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}

/* ---------- shared chrome ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:calc(8px + var(--safe-t)) 12px 8px;
  border-bottom:1px solid rgba(201,151,63,.22);
  background:linear-gradient(#0f1613cc,#0f161300);
  position:relative;z-index:3;
}
.stat{display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.stat svg{width:16px;height:16px;flex:none}
.stat b{font-family:Bitter,serif;font-size:15px}
.spacer{flex:1}
.tag{font-size:11px;color:#a9b6ac;letter-spacing:.02em}

.btn{
  min-height:var(--slot);padding:11px 18px;border-radius:3px;
  background:linear-gradient(#2c3a32,#1b2620);
  border:1px solid rgba(201,151,63,.5);
  color:var(--bone);font-weight:600;
  box-shadow:0 2px 0 rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  transition:transform .08s ease, filter .12s ease;
}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,.5)}
.btn.primary{background:linear-gradient(#c9973f,#9c6f24);border-color:#e5c07c;color:#1a1408}
.btn.danger{border-color:rgba(160,51,40,.7);color:#e9b9b3}
.btn.hold{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.btn.hold::before{content:'';position:absolute;inset:0;background:rgba(190,64,50,.75);transform:scaleX(0);transform-origin:left;transition:transform .2s ease-out}
.btn.hold.on::before{transform:scaleX(1);transition:transform 1.5s linear}
.btn.hold span{position:relative}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.wide{width:100%}

/* ---------- camp ---------- */
.camp-body{flex:1;overflow-y:auto;padding:16px 16px calc(20px + var(--safe-b))}
.camp-hero{
  position:relative;border:1px solid rgba(201,151,63,.3);border-radius:4px;
  padding:16px;margin-bottom:14px;overflow:hidden;
  background:linear-gradient(160deg,#233129,#141c17);
}
.camp-hero h1{margin:0 0 4px;font-size:26px;letter-spacing:.03em}
.camp-hero p{margin:0;color:#b3bfb4;max-width:34ch}
.camp-hero .emberfire{position:absolute;right:-10px;bottom:-18px;width:130px;opacity:.5}
.row{display:flex;gap:10px;margin-bottom:10px}
.card-panel{
  border:1px solid rgba(201,151,63,.22);border-radius:4px;padding:12px;
  background:rgba(9,14,11,.5);margin-bottom:12px;
}
.card-panel h3{margin:0 0 8px;font-size:14px;color:var(--brass)}
.shoprow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.07)}
.shoprow:first-of-type{border-top:0}
.skrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid rgba(255,255,255,.07)}
.skrow:first-of-type{border-top:0}
.skinfo{flex:1;min-width:0}
.skname{font:600 15px Inter,sans-serif;color:var(--bone)}
.skdelta{margin-left:6px;font:600 12px Inter,sans-serif;color:#e3c88a;white-space:nowrap}
.skblurb{margin-top:2px;font-size:12px;color:#8f9c92}
.skret{margin-top:4px;font-size:12px;color:#8f9c92}
.skret b{font-weight:600;color:#cdd8cf}
.skret span{opacity:.85}
.skbtn{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;min-width:84px;min-height:48px;padding:6px 10px;line-height:1.15}
.trainchg{display:flex;align-items:baseline;justify-content:center;gap:12px;margin:6px 0 14px;font:700 28px Bitter,serif;color:#8f9c92}
.trainchg b{color:#e5c07c}.trainchg i{font-style:normal;font-size:20px;color:#6f7d73}
.skbtn .skgain{display:block;color:#e5c07c;font-weight:700;font-size:13px}
.skbtn .skcost{font-size:12px;opacity:.95}
.skbtn .skcost .stat{margin:0}
.shoprow p{margin:0;flex:1;font-size:13px;color:#c3cec5}
/* ---------- camp overworld ----------
   The stage keeps a fixed 360x560 shape; buildings are placed in % of it so art you
   drop in via CAMP_ASSETS lines up at any screen size. */
.world{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:hidden;
  background:#3f6a3b;container-type:size;padding-bottom:var(--safe-b)}
.stage{position:relative;width:min(100cqw,calc(100cqh*360/560));aspect-ratio:360/560}
.world-bg{position:absolute;inset:0}
.world-bg svg,.world-bg img{width:100%;height:100%;display:block}
.bld{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;
  transition:transform .1s ease}
.bld .art{width:100%;display:block;filter:drop-shadow(0 4px 3px rgba(0,0,0,.45));transition:filter .15s}
.bld .art svg,.bld .art img{width:100%;height:auto;display:block}
.bld:hover .art,.bld:focus-visible .art{filter:drop-shadow(0 0 7px rgba(229,192,124,.9)) drop-shadow(0 4px 3px rgba(0,0,0,.45))}
.bld:active{transform:translateY(2px) scale(.98)}
.bld:focus-visible{outline:none}
.bld.dim .art{filter:grayscale(.55) brightness(.82) drop-shadow(0 4px 3px rgba(0,0,0,.45))}
.plate{background:rgba(20,16,10,.84);border:1px solid rgba(201,151,63,.55);border-radius:3px;
  padding:3px 7px;text-align:center;line-height:1.15;white-space:nowrap}
.plate b{display:block;font-family:Bitter,serif;font-size:12px;color:var(--stock)}
.plate small{display:block;font-size:10px;color:#c9bfa8}
.bld.go .plate{border-color:#e5c07c;background:rgba(84,54,16,.92)}
.camp-line{position:absolute;left:8px;right:8px;bottom:8px;padding:5px 9px;border-radius:3px;
  background:rgba(20,16,10,.78);border:1px solid rgba(201,151,63,.3);font-size:11px;color:#c9bfa8;
  line-height:1.3;pointer-events:none}
.stat.pr{display:inline-flex;gap:3px;vertical-align:middle;margin-right:5px}
.stat.pr svg{width:13px;height:13px}
.stat.pr b{font-size:inherit}
/* tooltips: anything with data-tip explains itself on hover or tap */
[data-tip]{cursor:help}
.kw{border-bottom:1px dotted currentColor;cursor:help}
#tip{position:absolute;z-index:40;max-width:210px;padding:6px 9px;border-radius:4px;pointer-events:none;
  background:#17120b;border:1px solid rgba(229,192,124,.7);color:var(--stock);font:12px/1.3 Inter,sans-serif;
  box-shadow:0 4px 12px rgba(0,0,0,.6);opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
.estr,.ewk{white-space:nowrap}
.ewk{color:#c9a6ff}
.estr{color:#f0c96b}
.estr svg{width:11px;height:11px;vertical-align:-1px}
.price{font-family:Bitter,serif;color:var(--brass);white-space:nowrap}
.decklist{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  padding:6px 9px;border-radius:2px;font-size:12px;
  background:linear-gradient(#e7dcc4,#cdbe9c);color:var(--ink);font-weight:600;
  border:1px solid #a08f6c;
}
.chip.sel{outline:2px solid var(--oxblood);outline-offset:1px}
.chip.up{background:linear-gradient(#f6e6bb,#dcc389);border-color:var(--brass);box-shadow:0 0 0 1px rgba(201,151,63,.45)}
.chip.dim{opacity:.4;pointer-events:none}
.pcard.upgraded{border-color:var(--brass);box-shadow:0 4px 10px rgba(0,0,0,.55), inset 0 0 0 1px rgba(201,151,63,.55)}
.pcard.upgraded .cname{color:#7a5410}
.pick.upgraded{border-color:var(--brass)}

/* ---------- floor map ---------- */
.map{flex:1;position:relative;margin:10px;border:1px solid rgba(201,151,63,.2);border-radius:4px;overflow:hidden;
  background:
    radial-gradient(70% 28% at 50% 4%, rgba(224,145,58,.22), transparent 70%),
    radial-gradient(130% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.55)),
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 58px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 76px),
    linear-gradient(#1a2620,#101715)}
.map svg.links{position:absolute;inset:0;width:100%;height:100%}
.map .stairs{position:absolute;left:50%;top:2.5%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;font:600 10px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#d9a85a}
.map .stairs i{display:block;width:34px;height:12px;border-radius:17px 17px 0 0;background:linear-gradient(#0a0e0c,#26332b);border:1px solid rgba(217,168,90,.6);border-bottom:0;box-shadow:0 -4px 14px rgba(224,145,58,.45)}
.node{
  position:absolute;transform:translate(-50%,-50%);
  width:74px;min-height:var(--slot);
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.node .disc{
  width:60px;height:60px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #3a4c41, #131c17);
  border:2px solid rgba(201,151,63,.55);
  display:grid;place-items:center;
  box-shadow:0 3px 10px rgba(0,0,0,.6);
}
.node .disc svg{width:40px;height:40px}
.node .disc svg.art{width:46px;height:50px;overflow:visible}
.node.boss .disc svg.art{width:62px;height:68px}
.node .badge{position:absolute;top:-4px;right:6px;min-width:20px;height:20px;border-radius:10px;padding:0 5px;display:grid;place-items:center;font:700 11px Inter,sans-serif;background:#c9973f;color:#1b1500;border:1px solid #f0d79a;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.node.cleared .badge{background:#4a5249;color:#cdd8cf;border-color:#6a736b;filter:none}
.node.boss{width:92px}
.node.boss .disc{width:76px;height:76px;border-width:3px}
.node.boss .disc svg{width:52px;height:52px}
.node.boss small{color:#e0a59d;font-weight:600;letter-spacing:.04em}
.node .disc{position:relative}
.node small{font-size:10.5px;color:#a7b3a8;text-align:center;line-height:1.2}
.node.cleared .disc{filter:grayscale(1) brightness(.5);border-color:#4a5249}
.node.cleared small{color:#5f6a61}
.node.boss .disc{border-color:var(--oxblood);box-shadow:0 0 16px rgba(160,51,40,.45)}
.node.locked .disc{opacity:.45}
.node:not(.cleared):not(.locked) .disc{animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 3px 18px rgba(201,151,63,.35)}}
.mapfoot{padding:0 14px calc(14px + var(--safe-b));display:flex;gap:10px;align-items:center}

/* ---------- battle ---------- */
.field{flex:1;position:relative;display:flex;justify-content:center;align-items:flex-end;gap:14px;padding:6px 12px 0;min-height:0}
.enemy{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding-bottom:6px}
.enemy .art{width:96px;height:104px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.55))}
.enemy.small .art{width:80px;height:88px}
.enemy.targeted::after{
  content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:86px;height:16px;border-radius:50%;
  background:radial-gradient(ellipse, rgba(201,151,63,.5), transparent 70%);
}
.enemy.dead{opacity:0;transform:translateY(10px) scale(.9);transition:.4s}
.hpbar{width:88px;height:7px;border-radius:2px;background:#2a211d;border:1px solid #453a2f;overflow:hidden}
.hpbar i{display:block;height:100%;background:linear-gradient(#c0483c,#7d2a22)}
.enemy .label{font-size:11px;color:#c8d2c9;display:flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.intent{
  display:flex;align-items:center;gap:4px;
  font-family:Bitter,serif;font-size:14px;color:#f0dcbb;
  background:rgba(10,15,12,.75);border:1px solid rgba(201,151,63,.35);
  padding:2px 7px;border-radius:2px;
}
.intent svg{width:14px;height:14px}
.eblock{display:flex;align-items:center;gap:3px;color:#8fd0bd;font-size:11px}

.floattext{position:absolute;font-family:Bitter,serif;font-size:22px;pointer-events:none;
  animation:floatUp .9s ease-out forwards;text-shadow:0 2px 3px #000;z-index:5}
@keyframes floatUp{to{transform:translateY(-46px);opacity:0}}
.shake{animation:shake .28s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* player strip */
.playerbar{display:flex;align-items:center;gap:10px;padding:6px 12px;position:relative;z-index:2}
.hero{width:46px;height:46px;flex:none}
.pstats{flex:1}
.pbar{height:9px;border-radius:2px;background:#241f1a;border:1px solid #453a2f;overflow:hidden;margin-top:3px}
.pbar i{display:block;height:100%;background:linear-gradient(#d9584a,#8c2f26)}
.shield{
  display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;flex:none;position:relative;color:#0d1a16;font-family:Bitter,serif;font-size:14px}
.shield svg{position:absolute;inset:0;width:100%;height:100%}
.shield span{position:relative}


/* first person: no avatar, just the bars you are looking down at. Block is a steel
   plate laid over the health bar, and strikes fly in and fizzle against its edge. */
.field::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(125% 95% at 50% 42%,transparent 58%,rgba(0,0,0,.5))}
.pbar.big{height:20px;position:relative;margin-top:4px;border-radius:3px}
.pbar.big>i{position:absolute;left:0;top:0;bottom:0;transition:width .35s ease}
.blockbar{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .45s cubic-bezier(.3,.8,.3,1);
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.1) 0 2px,transparent 2px 5px),
             linear-gradient(#d3dcda 0,#93a09d 45%,#5f6c6a 55%,#a1aeab 100%);
  border-right:2px solid #eef5f3;box-shadow:2px 0 8px rgba(150,230,210,.5)}
.blockbar.gain{animation:blockgain .5s ease-out}
@keyframes blockgain{0%{filter:brightness(1.9)}100%{filter:none}}
.blocknum{position:absolute;left:6px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:3px;
  font-family:Bitter,serif;font-size:12px;font-weight:700;color:#10201c;text-shadow:0 1px 0 rgba(255,255,255,.5);pointer-events:none}
.blocknum svg{width:13px;height:13px}
.blocknum:empty{display:none}
.pbar.snap *{transition:none!important;animation:none!important}
.pbar.clang{animation:clang .28s}
@keyframes clang{20%{transform:translateX(-4px) scaleY(1.12)}60%{transform:translateX(3px)}}
.bolt{position:absolute;z-index:18;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#fff3c8 0,#f08a3c 45%,rgba(200,50,30,0) 72%);
  box-shadow:0 0 14px 5px rgba(240,120,50,.7);transition:transform .36s cubic-bezier(.55,0,.9,.55)}
.spark{position:absolute;z-index:18;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;pointer-events:none;
  background:#ffe9a8;box-shadow:0 0 6px 2px rgba(255,200,110,.9);animation:sparkfly .5s ease-out forwards}
@keyframes sparkfly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.enemy.lunge .art{animation:lunge .34s ease-in}
@keyframes lunge{50%{transform:translateY(16px) scale(1.12)}}
#hurt{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;z-index:4;opacity:0}
#hurt.on{animation:hurtflash .55s ease-out}
@keyframes hurtflash{0%{opacity:1;box-shadow:inset 0 0 90px 18px rgba(210,40,30,.75)}100%{opacity:0}}

/* dice pouch */
.pouchh{margin:4px 0 8px;font-size:13px;color:var(--brass)}
.dieslots{display:flex;gap:10px;margin-bottom:16px}
.dpick{flex:1;min-width:0;position:relative;text-align:center;font-size:11px;padding:10px 4px 8px;border-radius:6px;
  border:1px solid rgba(201,151,63,.4);background:linear-gradient(#1f2b25,#151e19);color:var(--bone)}
.dpick svg{width:38px;height:38px;display:block;margin:0 auto 4px}
.dpick b{display:block;font-family:Bitter,serif;font-size:12px}
.dpick small{display:block;color:#a9b6ac;font-size:10px;margin-top:2px}
.dpick.k-enchanted svg{filter:drop-shadow(0 0 6px #b98cf0)}
.dpick.k-loaded svg{filter:drop-shadow(0 0 4px #c9973f)}
.dpick.k-fickle svg{filter:drop-shadow(0 0 4px #c0483c)}
.dpick.k-even svg{filter:drop-shadow(0 0 4px #7fb7a6)}
.dpick.k-steady svg{filter:drop-shadow(0 0 4px #9fb4d6)}
.dpick .rune{position:absolute;top:5px;right:5px;width:17px;height:17px;display:block}
.dpick .rune svg{width:17px;height:17px}
.fc svg{width:60%;height:60%}
.dpick.k-flame svg,.dpick.k-ward svg,.dpick.k-heart svg,.dpick.k-spark svg,.dpick.k-scholar svg{filter:none}
.dpick.k-lucky svg{filter:drop-shadow(0 0 4px #7bc47f)}
.dpick .snum{position:absolute;top:3px;left:5px;font-size:9px;color:#a9b6ac}
/* in the pouch: lit, framed, bright. spare: dim, dashed, sitting in the bag */
#pouch-slots{display:flex;flex-direction:column;gap:16px;padding:16px 10px 12px;border:1px solid rgba(201,151,63,.4);border-radius:12px;
  background:rgba(201,151,63,.05)}
#pouch-slots .dpick{border:1px solid #3f5245;background:#1f2b23}
#pouch-slots .traybox,#pouch-slots .restgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
#pouch-slots .traybox{position:relative;padding:22px 6px 8px;border:2px solid rgba(229,192,124,.95);border-radius:12px;background:linear-gradient(180deg,#4a3a1c,#3a2f1a);box-shadow:0 0 16px rgba(201,151,63,.3)}
#pouch-slots .traybox::before{content:'Encounter tray';position:absolute;top:-8px;left:12px;padding:0 6px;background:#1c2a21;color:#e5c07c;font:600 10px/16px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase}
#pouch-slots .restgrid{padding:0 7px}
#pouch-slots .dpick svg{width:40px;height:40px}
#pouch-slots .dpick small{display:none}
#pouch-slots .dpick b{font-size:11px}
#pouch-slots .snum{top:-9px;left:50%;transform:translateX(-50%);padding:0 7px;border-radius:99px;
  background:#26352b;color:#cdbb8a;font-size:10px;font-weight:600}
.trayprev{margin-top:14px;padding:10px 12px 4px;border:1px solid rgba(201,151,63,.35);border-radius:10px;background:rgba(0,0,0,.25)}
.trayhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.trayrow{display:flex;gap:8px;margin:10px 0 4px}
#sheet .trayrow{margin:14px 0 16px}
.tslot{flex:1;aspect-ratio:1;max-width:58px;border:1px dashed rgba(201,151,63,.3);border-radius:6px;display:grid;place-items:center;
  font:700 20px Bitter,serif;color:#e7dcc4}
.tslot{position:relative}
.tslot small{position:absolute;top:2px;left:4px;font:600 9px Inter,sans-serif;opacity:.55}
.tslot.off{border:1px solid #3a4a3e;background:#1c261f;color:#7d8a80;opacity:.8}
.rtgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px;margin:18px 0 16px}
.rt{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border:1px solid #3f5245;border-radius:10px;background:#1f2b23;color:#cdd8cf}
.rt .snum{position:absolute;top:-9px;left:50%;transform:translateX(-50%);padding:0 7px;border-radius:99px;background:#26352b;color:#cdbb8a;font:600 10px Inter,sans-serif}
.rt strong{font:700 26px Bitter,serif;line-height:1.1}
.rt b{font:600 10px Inter,sans-serif;color:#8f9c92}
.rt .rtf{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:6px;width:54px}
.rt .rtf i{font:600 10px/16px Inter,sans-serif;font-style:normal;text-align:center;border-radius:3px;background:rgba(255,255,255,.08);color:#9fb0a3}
.rt .rtf i.f{background:#e5c07c;color:#1b1500}
.rt .rtf i.ic svg{width:12px;height:12px;vertical-align:-2px}
.rt.in .rtf i{background:rgba(42,33,22,.12);color:#6b5a3a}
.rt.in .rtf i.f{background:#2a2116;color:#efe6d0}
.rt.in{border:2px solid #e5c07c;background:#efe6d0;color:#2a2116;box-shadow:0 0 12px rgba(229,192,124,.45)}
.rt.in b{color:#6b5a3a}
.rt.in .snum{background:#c9973f;color:#1b1500}
.rt.out{opacity:.5}
.rlabel{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#a9b6ac;margin:12px 0 -2px}
.tslot.on{border:2px solid var(--brass);background:#efe6d0;color:#2a2116;box-shadow:0 0 10px rgba(201,151,63,.35)}
.tslot.lock{opacity:.35}
#pouch-slots .dpick.picked{box-shadow:0 0 0 3px #fff,0 0 16px rgba(255,235,170,.8);transform:translateY(-3px)}
#pouch-slots .dpick.sel,#pouch-bag .dpick.sel{box-shadow:0 0 0 2px #1b140c,0 0 0 4px #f3d27a;opacity:1}
#pouch-slots .dpick:not(.picked).dim{opacity:.45}
#pouch-bag .dpick{border:1.5px dashed rgba(169,182,172,.45);background:rgba(10,16,13,.55);opacity:.72}
#pouch-bag .dpick svg{width:32px;height:32px;filter:saturate(.6)}
#pouch-bag .dpick:hover{opacity:1}
.diegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.faces{display:flex;gap:6px;margin:10px 0;justify-content:center}
.fc{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;font-family:Bitter,serif;font-weight:700;
  background:#f2ecdf;color:#221c14;border:2px solid transparent}
button.fc{cursor:pointer}
.fc.on{border-color:#b98cf0;box-shadow:0 0 8px #b98cf0}
.faces .fc{width:44px;height:44px}
.net{display:grid;grid-template-columns:repeat(4,44px);grid-auto-rows:44px;gap:3px;justify-content:center;margin:14px 0 16px}
.net .fc{width:44px;height:44px;border-radius:4px}
.cardslot{border-style:dashed;color:#e7dcc4;margin:4px 0 16px;padding:10px 12px;line-height:1.3}
.cardslot small{display:block;margin-top:2px;font-weight:400;font-size:11px;color:#a9b6ac}
#sheet .pickrow{margin:6px 0}
#leave{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(6,10,8,.88)}
#leave.on{display:flex}
ul.rules{margin:0 0 12px;padding-left:18px;font-size:13.5px;line-height:1.5;color:#d3dbd5}
ul.rules li{margin-bottom:6px}

/* dice tray */
.tray{
  display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:8px 12px;
  border-top:1px solid rgba(201,151,63,.2);border-bottom:1px solid rgba(201,151,63,.2);
  background:linear-gradient(#0e1512,#111a15);
}
.trayrow{display:flex;align-items:center;gap:8px}
#dicebox{flex:1;display:flex;gap:7px;min-width:0}
.rollbtn{
  min-width:58px;padding:5px 8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;line-height:1;
}
.rollbtn{position:relative;overflow:hidden}
.rollbtn::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--fill,0%);
  background:rgba(201,151,63,.5);transition:height .9s ease}
.rollbtn>*{position:relative}
.rollbtn.ready::before{background:rgba(229,192,124,.35)}
.rollbtn b{font-family:Bitter,serif;font-size:14px}
.rollbtn small{font-size:9px;opacity:.75;letter-spacing:.02em}
.rollbtn.hot{background:linear-gradient(#c9973f,#9c6f24);border-color:#e5c07c;color:#1a1408}
.rollbtn.hot small{opacity:.85}
.trayempty{
  flex:1;display:flex;align-items:center;justify-content:center;
  height:var(--slot);border:1px dashed rgba(201,151,63,.3);border-radius:6px;
  font-size:11.5px;color:#7f8c82;
}
.cardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.cardgrid .pick{width:100%;height:auto;min-height:142px}
.wheretag{
  position:absolute;right:4px;bottom:4px;padding:1px 5px;border-radius:2px;
  background:rgba(59,50,39,.8);color:var(--stock);font-size:9.5px;
}
.pricetag{
  position:absolute;left:4px;bottom:4px;padding:1px 6px;border-radius:2px;
  background:#3b3227;color:var(--brass);font-family:Bitter,serif;font-size:11px;
}
.pricetag{display:flex;align-items:center;gap:4px;white-space:nowrap}
.pricetag .stat.pr{margin:0}
.updot{display:inline-block;width:8px;height:8px;margin-left:7px;border-radius:50%;vertical-align:1px}
.updot.here{background:var(--brass);box-shadow:0 0 6px rgba(201,151,63,.8)}
.updot.next{border:1.5px solid var(--brass)}
#uplist .pick{padding-bottom:26px}
.pick.tooexpensive{filter:grayscale(.6) brightness(.75)}
.pick .count{
  position:absolute;top:4px;right:4px;padding:1px 5px;border-radius:2px;
  background:#3b3227;color:var(--stock);font-family:Bitter,serif;font-size:10px;
}
.pick.big{width:152px;height:218px;padding:10px}
.pick.big .cname{font-size:14px;padding-left:22px;min-height:30px}
.pick.big .cart svg{width:72px;height:72px}
.pick.big .ctext{font-size:11.5px;line-height:1.3}
.pick.big .cost{width:22px;height:22px;font-size:13px}
.uppath{margin-top:2px}
.uprow{display:flex;gap:10px;align-items:baseline;padding:5px 0;
  border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:#c3cec5}
.uprow:first-child{border-top:0}
.uprow .uplvl{font-family:Bitter,serif;color:#e3c88a;white-space:nowrap;min-width:88px}
.uprow.past{opacity:.45}
.uprow.here{background:rgba(201,151,63,.1)}
.uprow.here .uplvl{color:var(--brass)}
.piptable{margin-top:8px}
.piptable .prow{
  display:flex;gap:9px;align-items:center;font-size:12px;color:#c3cec5;
  padding:5px 0;border-top:1px solid rgba(255,255,255,.07);
}
.piptable .prow b{font-family:Bitter,serif;color:#e3c88a;font-weight:700}
.die.mini{width:24px;height:24px;flex:none;padding:3.5px;border-radius:5px;box-shadow:0 1px 0 #8d836d}
.die.mini i{width:4px;height:4px}
.die{
  width:var(--slot);height:var(--slot);flex:none;position:relative;
  border-radius:8px;
  background:linear-gradient(150deg,#f7f2e6,#cfc4ab);
  box-shadow:0 3px 0 #8d836d, 0 5px 8px rgba(0,0,0,.5), inset 0 1px 0 #fff;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:6px;transition:transform .12s ease;
}
.die i{width:7px;height:7px;border-radius:50%;background:var(--ink);align-self:center;justify-self:center}
.die.armed{transform:translateY(-6px) rotate(-4deg);box-shadow:0 6px 0 #8d836d,0 0 0 2px var(--brass),0 8px 12px rgba(0,0,0,.6)}
.die.spent{opacity:.22;box-shadow:none;transform:none;pointer-events:none}
.die.tight{width:38px;height:38px;padding:5px;border-radius:7px}
.die.tight i{width:6px;height:6px}
.die.heavy{                       /* pushed past a real die face by Weighted Die */
  background:linear-gradient(150deg,#f7e6bd,#dcbe86);
  box-shadow:0 3px 0 #9a7c46, 0 0 0 1px rgba(201,151,63,.75), 0 5px 8px rgba(0,0,0,.5), inset 0 1px 0 #fff;
}
.die.heavy i{background:#4a3410}
.die.mini.heavy{box-shadow:0 1px 0 #9a7c46, 0 0 0 1px rgba(201,151,63,.7)}
.die.rolling{animation:tumble .5s ease-out}
@keyframes tumble{0%{transform:translateY(-14px) rotate(-90deg) scale(.8)}60%{transform:translateY(2px) rotate(12deg)}100%{transform:none}}
.trayhint{flex:1;font-size:11.5px;color:#93a397;line-height:1.25}
.energy{
  width:42px;height:42px;flex:none;display:grid;place-items:center;position:relative;
  font-family:Bitter,serif;font-size:16px;color:#2a1e08;
}
.energy svg{position:absolute;inset:0;width:100%;height:100%}
.energy span{position:relative}

/* hand */
.hand{
  height:208px;position:relative;flex:none;
  display:flex;justify-content:center;align-items:flex-end;
  padding-bottom:calc(6px + var(--safe-b));
}
.pcard{
  position:absolute;bottom:8px;width:104px;height:150px;
  touch-action:none;cursor:grab;
  transform-origin:50% 130%;
  border-radius:5px;padding:7px 7px 6px;
  background:linear-gradient(170deg,var(--stock),var(--stock-2));
  color:var(--ink);
  border:1px solid #8e7d5c;
  box-shadow:0 4px 10px rgba(0,0,0,.55);
  display:flex;flex-direction:column;
  transition:transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .16s;
}
.pcard.raised{box-shadow:0 12px 22px rgba(0,0,0,.65), 0 0 0 2px var(--brass);z-index:6}
.pcard.unaffordable{filter:grayscale(.55) brightness(.8)}
.pcard .cname{font-family:Bitter,serif;font-size:12px;line-height:1.1;padding-left:20px;min-height:26px}
.pcard .cart{flex:1;display:grid;place-items:center;margin:2px 0}
.pcard .cart svg{width:52px;height:52px;opacity:.9}
.pcard .ctext{font-size:10px;line-height:1.25;color:#3b3227;min-height:38px}
.pcard .ctext b{font-family:Bitter,serif;font-size:12px;color:#7a2b1f}
.pcard .cost{
  position:absolute;top:5px;left:5px;width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#e8c176,#9c6f24);
  border:1px solid #6d4c14;color:#22190a;font-family:Bitter,serif;font-size:12px;
  display:grid;place-items:center;
}
.pcard .slot{
  position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:4px;
  border:1.5px dashed #8a7b5c;display:grid;place-items:center;font-size:10px;color:#8a7b5c;
}
.pcard .slot.req{border-style:solid;border-color:var(--oxblood);color:var(--oxblood)}
.pcard .slot.charged{
  background:linear-gradient(150deg,#f7e6bd,#dcbe86);border-color:#a9832f;color:#4a3410;
  box-shadow:0 0 0 2px rgba(201,151,63,.35);
}
.pcard .slot.filled{
  border-style:solid;background:linear-gradient(150deg,#fdfaf2,#d8cdb4);border-color:var(--brass);
  color:var(--ink);font-family:Bitter,serif;font-size:11px;
}
.playhint{
  position:absolute;top:30px;left:50%;transform:translateX(-50%);z-index:12;
  font-size:11px;color:var(--brass);letter-spacing:.04em;
  max-width:92%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
/* The counters sit above the fan, not under it: a full hand covers the whole
   bottom edge of a phone, and the draw and discard counts were hidden behind it. */
.piles{position:absolute;top:3px;z-index:12;width:100%;display:flex;justify-content:space-between;padding:0 10px;pointer-events:none}
.pile:empty{visibility:hidden}
.pile{display:inline-flex;align-items:center;gap:5px;pointer-events:auto}
.pile svg{width:15px;height:15px;flex:none}
.pile b{font-family:Bitter,serif;font-size:13px;color:var(--bone)}
/* End turn sits between the counters so no hand size ever covers it, or is covered by it */
.hand .turnbtn{bottom:auto;top:2px;right:auto;left:50%;transform:translateX(-50%);z-index:13;
  min-height:0;height:24px;padding:0 16px;font-size:12px}
.hand .turnbtn:active{transform:translateX(-50%) translateY(2px)}
.pile{font-size:11px;color:#c3cec5;font-variant-numeric:tabular-nums;padding:1px 8px;border-radius:99px;background:rgba(10,14,12,.72)}
.turnbtn{position:absolute;right:10px;bottom:calc(26px + var(--safe-b));z-index:7}

/* overlay */
#overlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(6,10,8,.82);backdrop-filter:blur(2px)}
#overlay.on{display:flex}
/* keep the wallet bar clear above a sheet so the player always sees what they own */
#app:has(#overlay.on) .screen.on .topbar{z-index:30;background:#0f1613;box-shadow:0 1px 0 rgba(201,151,63,.3)}
.sheet{
  width:100%;max-width:420px;max-height:88%;overflow-y:auto;
  background:linear-gradient(#1d2823,#121a16);
  border:1px solid rgba(201,151,63,.45);border-radius:5px;padding:18px;
}
.sheet h2{margin:0 0 6px;font-size:20px}
.sheet p{margin:0 0 14px;color:#b6c2b7}
.loot{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding:8px 12px;flex-wrap:wrap;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);opacity:.8}
.loot em{font:600 10px Inter,sans-serif;font-style:normal;letter-spacing:.08em;text-transform:uppercase;color:#8f9c92;margin-right:2px}
.loot div{font-family:Bitter,serif;font-size:14px;color:#b9c4bb}
.loot svg{width:18px;height:18px;vertical-align:-4px;margin-right:4px}
.choose{padding:12px 10px 4px;margin:0 -4px 12px;border-radius:8px;border:1px solid rgba(229,192,124,.6);background:linear-gradient(rgba(201,151,63,.14),rgba(201,151,63,.05));box-shadow:0 0 14px rgba(201,151,63,.18)}
.choose p{margin:0 0 10px;font-weight:600;color:#e5c07c}
.choose .btn.diepick{margin-top:2px}
.pickrow{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.btn.diepick{display:flex;align-items:center;gap:12px;text-align:left;margin-bottom:10px;border-style:dashed}
.btn.diepick svg{width:30px;height:30px;flex:none}
.btn.diepick span{display:flex;flex-direction:column}
.btn.diepick small{font-weight:400;font-size:11.5px;color:#a9b6ac}
.pick{width:96px;height:138px;position:relative;border-radius:5px;padding:7px;
  background:linear-gradient(170deg,var(--stock),var(--stock-2));color:var(--ink);border:1px solid #8e7d5c;
  display:flex;flex-direction:column;text-align:left}
.pick:active{transform:translateY(2px)}
.pick .cname{font-family:Bitter,serif;font-size:11.5px;padding-left:18px;min-height:24px}
.pick .cart{flex:1;display:grid;place-items:center}
.pick .cart svg{width:44px;height:44px}
.pick .ctext{font-size:9.5px;line-height:1.2;min-height:34px;color:#3b3227}
.pick .cost{position:absolute;top:4px;left:4px;width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#e8c176,#9c6f24);border:1px solid #6d4c14;
  display:grid;place-items:center;font-family:Bitter,serif;font-size:11px}
.stack{display:flex;flex-direction:column;gap:9px}

#toast{
  position:absolute;left:50%;bottom:210px;transform:translateX(-50%);
  background:rgba(10,15,12,.94);border:1px solid rgba(201,151,63,.5);
  padding:9px 14px;border-radius:3px;font-size:13px;z-index:30;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:80%;text-align:center;
}
#toast.on{opacity:1}
#toast{pointer-events:none}
/* --- slotting a die: the cues that make the mechanic legible --- */
.die.armed::after{
  content:"";position:absolute;inset:-6px;border-radius:12px;
  border:1px solid rgba(201,151,63,.6);animation:pulsering 1.5s ease-out infinite;
}
@keyframes pulsering{0%{opacity:.85;transform:scale(1)}100%{opacity:0;transform:scale(1.22)}}
.flydie{                            /* the ghost die that travels tray → card */
  position:absolute;z-index:40;pointer-events:none;margin:0;
  transition:transform .22s cubic-bezier(.3,.85,.35,1), opacity .22s;
}
.pcard.candidate .slot{border-color:var(--brass);color:#7a5410;animation:slotcall .85s ease-in-out 2}
@keyframes slotcall{50%{transform:scale(1.2);box-shadow:0 0 0 4px rgba(201,151,63,.28)}}
.pcard.inert{filter:grayscale(.45) brightness(.86)}   /* can't take the armed die */
.pcard.commit{animation:commit .34s ease-out}
@keyframes commit{45%{filter:brightness(1.3) drop-shadow(0 0 9px rgba(201,151,63,.8))}}
.slot.filled{animation:seat .3s ease-out}
@keyframes seat{0%{transform:scale(1.7);box-shadow:0 0 0 7px rgba(201,151,63,.35)}}

/* --- aiming --- */
.aimmark{display:inline-flex;width:13px;height:13px;vertical-align:-2px}
.aimmark svg{width:13px;height:13px}
.field.aiming .enemy{transition:filter .18s, opacity .18s}
.field.aiming .enemy.dim{filter:grayscale(.6) brightness(.68);opacity:.6}
.field.aiming .enemy.targeted::after{animation:aimpulse 1.2s ease-in-out infinite}
@keyframes aimpulse{50%{transform:translateX(-50%) scale(1.3);opacity:.7}}
.enemy.struck .art{animation:struck .3s ease-out}
@keyframes struck{0%{filter:brightness(2.2) saturate(.3)}45%{transform:translateX(3px)}100%{filter:none}}
/* Phones get the real thing: #app fills the screen and the layout flexes.
   On a mouse-driven screen the same layout runs at a fixed logical size and
   is scaled up to fit — see layout(). Scaling rather than stretching is what
   makes a bigger window mean bigger cards and text instead of a taller empty
   arena, which is what a fluid frame gave. CSS here is only the framing;
   width, height and scale are set inline. */
@media (min-width:700px) and (pointer:fine){
  body{background:#070a08}
  body::before{
    content:"";position:fixed;inset:0;
    background:radial-gradient(60% 55% at 50% 28%, #18211b, #070a08 72%);
  }
  #app{
    inset:auto;left:50%;top:50%;max-width:none;margin:0;
    transform-origin:50% 50%;
    border-radius:20px;
    border:1px solid rgba(201,151,63,.26);
    box-shadow:0 24px 60px rgba(0,0,0,.75), 0 0 0 9px #0b0f0c, 0 0 0 10px rgba(201,151,63,.14);
  }
}
/* A wide canvas is answered by the layout, not just by bigger pixels.
   Container queries, not media queries: what matters is how wide #app itself
   is, which on desktop is a computed logical width, not the viewport. */
#app{container-type:inline-size}

@container (min-width:720px){
  .camp-body{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;align-content:start;
  }
  .camp-body > .card-panel{margin-bottom:0}
  .camp-hero{grid-column:1/-1;margin-bottom:0}
  #go-dungeon{grid-column:1/-1;margin-bottom:0 !important}
  #show-rules{grid-column:1/-1;margin-bottom:0 !important}
  .camp-body > .shoprow{grid-column:1/-1}
  /* combat stays a column — a hand of cards spread over 1400px is unreadable */
  .playerbar,.tray,.hand{max-width:760px;margin-left:auto;margin-right:auto;width:100%}
  .map{max-width:920px;margin-left:auto;margin-right:auto;width:100%}
}
@container (min-width:1080px){
  .camp-body{grid-template-columns:repeat(3,minmax(0,1fr))}
  #go-dungeon{grid-column:1/3}
  #show-rules{grid-column:3/-1}
  .cardgrid{grid-template-columns:repeat(4,1fr)}
}
@container (min-width:1460px){
  .camp-body{grid-template-columns:repeat(4,minmax(0,1fr))}
  #go-dungeon{grid-column:1/4}
  #show-rules{grid-column:4/-1}
  .cardgrid{grid-template-columns:repeat(6,1fr)}
}
/* --- a copy travelling into the draw pile --- */
.copyfly{
  position:absolute;width:44px;height:62px;border-radius:4px;z-index:30;pointer-events:none;
  background:linear-gradient(170deg,var(--stock),var(--stock-2));
  border:1px solid #8e7d5c;box-shadow:0 6px 14px rgba(0,0,0,.6);
  display:grid;place-items:center;
  transition:transform .55s cubic-bezier(.3,.8,.3,1), opacity .55s ease-in;
}
.copyfly svg{width:26px;height:26px;opacity:.85}
.pile.bump{animation:pilebump .45s ease-out}
@keyframes pilebump{35%{color:var(--brass);transform:scale(1.35)}}

/* --- the player's own roll --- */
#rollsplash{
  position:absolute;inset:0;z-index:26;display:none;
  align-items:center;justify-content:center;
  background:rgba(6,10,8,.72);backdrop-filter:blur(3px);
}
#rollsplash.on{display:flex}
.rollbox{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px;text-align:center}
.rolltitle{margin:0;font-family:Bitter,serif;font-size:17px;color:var(--bone);max-width:15ch;line-height:1.25}
.rollnote{margin:0;font-size:13px;color:#b6c2b7;min-height:19px;max-width:22ch}
.rollnote b{color:var(--brass);font-family:Bitter,serif}
.die.huge{
  width:104px;height:104px;padding:14px;border-radius:18px;cursor:pointer;
  box-shadow:0 7px 0 #8d836d, 0 12px 22px rgba(0,0,0,.6), inset 0 2px 0 #fff;
}
.die.huge i{width:16px;height:16px}
.die.huge.waiting{animation:rollbob 1.6s ease-in-out infinite}
@keyframes rollbob{50%{transform:translateY(-7px) rotate(-3deg)}}
.die.huge.spin{animation:rollspin .07s linear}
@keyframes rollspin{to{transform:rotate(22deg) scale(1.04)}}
.die.huge.landed{animation:rollland .35s ease-out}
@keyframes rollland{0%{transform:scale(1.18)}60%{transform:scale(.96)}}

/* --- the die's path into a card's slot --- */
#slotarrow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:13;display:none}
#slotarrow.on{display:block}
#slotpath{
  stroke:rgba(201,151,63,.5);stroke-width:2.5;stroke-linecap:round;
  stroke-dasharray:5 6;animation:slotflow .9s linear infinite;
}
@keyframes slotflow{to{stroke-dashoffset:-22}}
#slothead{fill:rgba(201,151,63,.75)}

/* --- drag to target --- */
#aimarrow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:14;display:none}
#aimarrow.on{display:block}
#aimpath{stroke:rgba(201,151,63,.9);stroke-width:5;filter:drop-shadow(0 2px 4px rgba(0,0,0,.7))}
#aimhead{fill:rgba(201,151,63,.95);filter:drop-shadow(0 2px 4px rgba(0,0,0,.7))}
#aimarrow.valid #aimpath{stroke:#e8c176;stroke-width:6}
#aimarrow.valid #aimhead{fill:#f2d79c}
#aimarrow.dud #aimpath{stroke:rgba(150,160,152,.55);stroke-dasharray:9 8}
#aimarrow.dud #aimhead{fill:rgba(150,160,152,.6)}
.pcard.dragging{transition:none;z-index:22;box-shadow:0 18px 30px rgba(0,0,0,.7), 0 0 0 2px var(--brass)}
.hand.armedrop::before{                 /* where an untargeted card can be dropped */
  content:"";position:absolute;left:8px;right:8px;top:-2px;height:2px;
  background:linear-gradient(90deg,transparent,rgba(201,151,63,.55),transparent);
}
.enemy.hover .art{filter:drop-shadow(0 0 12px rgba(240,168,159,.6)) brightness(1.12)}
.enemy.hover::after{
  content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  width:94px;height:18px;border-radius:50%;
  background:radial-gradient(ellipse, rgba(217,72,63,.5), transparent 70%);
}
body.grabbing{cursor:grabbing}
/* --- deck and collection --- */
.segwrap{display:flex;gap:8px;padding:10px 12px 6px}
.seg{
  flex:1;min-height:var(--slot);border-radius:3px;font-weight:600;
  border:1px solid rgba(201,151,63,.35);background:rgba(9,14,11,.5);color:#a9b6ac;
}
.seg.on{background:linear-gradient(#c9973f,#9c6f24);border-color:#e5c07c;color:#1a1408}
#collection-hint{margin:0;padding:0 14px 8px;font-size:11.5px;color:#93a397}
.collection-body{flex:1;overflow-y:auto;padding:0 12px calc(16px + var(--safe-b))}
.collection-body .pick{cursor:pointer}
.infodot{
  position:absolute;right:4px;bottom:4px;width:20px;height:20px;border-radius:50%;
  border:1px solid #8e7d5c;background:rgba(255,255,255,.5);color:#3b3227;
  font-family:Bitter,serif;font-size:11px;line-height:18px;text-align:center;
}
.emptynote{padding:22px 6px;color:#8b978c;font-size:13px;text-align:center}
/* --- mana gauge and spend telegraphing --- */
.energy{width:46px;height:46px}
.energy svg{position:absolute;inset:0;width:100%;height:100%}
/* the mana well: a full circle that drains downward, not a pie chart */
.ewell{fill:#101a26}
.eliquid{fill:#4f7fc4;transition:y .18s ease-out, height .18s ease-out}
.edrain{fill:#d9483f;animation:penpulse .85s ease-in-out infinite}
.esurface{fill:#a9cdf5}
.erim{fill:none;stroke:rgba(201,151,63,.75);stroke-width:2}
@keyframes penpulse{50%{opacity:.4}}
.energy span{position:relative;font-family:Bitter,serif;font-size:13px;color:#f7f2e6;
  text-shadow:0 1px 3px rgba(0,0,0,.85)}
.energy.short{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pcard.raised .cost, .pcard.dragging .cost{box-shadow:0 0 0 3px rgba(217,72,63,.4)}
.costtag{
  position:absolute;font-family:Bitter,serif;font-size:15px;color:#f0a89f;
  pointer-events:none;z-index:30;animation:floatUp .8s ease-out forwards;
  text-shadow:0 2px 3px #000;
}
#playconfirm{
  position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 4px);
  display:none;min-height:var(--slot);padding:9px 18px;border-radius:4px;
  background:linear-gradient(#c9973f,#9c6f24);border:1px solid #e5c07c;color:#1a1408;
  font-weight:600;font-size:13px;white-space:nowrap;z-index:9;
  box-shadow:0 4px 12px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.25);
}
#playconfirm.on{display:block}
#playconfirm:active{transform:translateX(-50%) translateY(2px)}
#playconfirm b{font-family:Bitter,serif}
#playbanner{
  position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 4px);
  background:rgba(10,15,12,.9);border:1px solid rgba(201,151,63,.4);
  padding:5px 12px;border-radius:3px;font-size:12px;color:#e7dcc4;white-space:nowrap;
  opacity:0;transition:opacity .18s;pointer-events:none;z-index:8;
}
#playbanner.on{opacity:1}
#playbanner b{font-family:Bitter,serif;color:var(--brass)}
#playbanner .drain{color:#f0a89f}
.hand{position:relative}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">

  <!-- ============ CAMP ============ -->
  <section class="screen" id="scr-camp">
    <div class="topbar">
      <div class="stat" id="camp-hp"></div>
      <div class="stat" id="camp-gold"></div>
      <div class="stat" id="camp-xp"></div>
      <div class="spacer"></div>
      <div class="tag" id="camp-depth"></div>
    </div>
    <div class="world">
      <div class="stage">
        <div class="world-bg" data-asset="bg"></div>
      <button class="bld go" id="go-dungeon" style="left:33%;top:3%;width:34%" aria-label="Enter the dungeon"><span class="art" data-asset="dungeon"></span><span class="plate"><b>Enter the dungeon</b><small id="note-dungeon"></small></span></button>
      <button class="bld" id="show-rules" style="left:5%;top:23%;width:21%" aria-label="How the dice work"><span class="art" data-asset="rules"></span><span class="plate"><b>How the dice work</b><small id="note-rules"></small></span></button>
      <button class="bld" id="go-skills" style="left:5%;top:38%;width:32%" aria-label="Skills"><span class="art" data-asset="skills"></span><span class="plate"><b>Skills</b><small id="note-skills"></small></span></button>
      <button class="bld" id="go-market" style="left:62%;top:25%;width:32%" aria-label="Market"><span class="art" data-asset="market"></span><span class="plate"><b>Market</b><small id="note-market"></small></span></button>
      <button class="bld" id="buy-up" style="left:62%;top:49%;width:32%" aria-label="Cardsmith"><span class="art" data-asset="training"></span><span class="plate"><b>Cardsmith</b><small id="note-training"></small></span></button>
      <button class="bld" id="view-deck" style="left:7%;top:62%;width:30%" aria-label="Deck"><span class="art" data-asset="deck"></span><span class="plate"><b>Deck</b><small id="note-deck"></small></span></button>
      <button class="bld" id="wipe" style="left:69%;top:73%;width:20%" aria-label="Erase save"><span class="art" data-asset="wipe"></span><span class="plate"><b>Erase save</b><small id="note-wipe"></small></span></button>
        <div class="camp-line" id="camp-line"></div>
      </div>
    </div>
  </section>

  <!-- ============ FLOOR ============ -->
  <section class="screen" id="scr-floor">
    <div class="topbar">
      <div class="stat" id="f-hp"></div>
      <div class="stat" id="f-carry"></div>
      <div class="spacer"></div>
      <div class="tag" id="f-depth"></div>
    </div>
    <div class="map" id="map"></div>
    <div class="mapfoot">
      <div class="tag" style="flex:1" id="f-hint">Clear every fight to open the way out.</div>
      <button class="btn danger" id="abandon">Abandon</button>
    </div>
  </section>

  <!-- ============ BATTLE ============ -->
  <section class="screen" id="scr-battle">
    <div class="topbar">
      <div class="tag" id="b-where"></div>
      <div class="spacer"></div>
      <div class="stat" id="b-carry"></div>
    </div>
    <div class="field" id="field"></div>
    <div id="hurt"></div>
    <div class="playerbar">
      <div class="pstats">
        <div class="stat" id="b-hp"></div>
        <div class="pbar big" id="b-bars" data-tip="Block: the steel bar soaks up damage before your health does.">
          <i id="b-hpfill"></i><div class="blockbar" id="b-blockfill"></div><span class="blocknum" id="b-blocknum"></span>
        </div>
      </div>
    </div>
    <div class="tray">
      <div class="trayrow">
        <div class="energy" id="b-energy"></div>
        <div id="dicebox"></div>
        <button class="btn rollbtn" id="rollbtn"></button>
      </div>
      <div class="trayhint" id="trayhint"></div>
    </div>
    <div id="playbanner"></div>
    <button id="playconfirm"></button>
    <div class="hand" id="hand">
      <div class="piles">
        <span class="pile" id="p-draw"></span>
        <span class="pile" id="p-scroll"></span>
        <span class="pile" id="p-disc"></span>
      </div>
      <button class="btn turnbtn" id="endturn">End turn</button>
    </div>
  </section>

  <!-- ============ MARKET ============ -->
  <section class="screen" id="scr-market">
    <div class="topbar">
      <div class="stat" id="market-gold"></div>
      <div class="spacer"></div>
      <button class="btn" id="market-done">Done</button>
    </div>
    <p class="tag" id="market-hint"></p>
    <div class="collection-body">
      <div class="cardgrid" id="market-grid"></div>
      <div style="height:12px"></div>
      <button class="btn wide" id="market-restock"></button>
    </div>
  </section>

  <!-- ============ POUCH / DECK ============ -->
  <section class="screen" id="scr-collection">
    <div class="topbar">
      <div class="stat" id="collection-count"></div>
      <div class="spacer"></div>
      <button class="btn" id="collection-done">Done</button>
    </div>
    <div class="segwrap">
      <button class="seg" data-tab="deck" id="tab-deck"></button>
      <button class="seg" data-tab="collection" id="tab-collection"></button>
    </div>
    <div style="padding:0 12px 6px"><button class="btn wide" id="to-pouch"></button></div>
    <p class="tag" id="collection-hint"></p>
    <div class="collection-body"><div class="cardgrid" id="collection-grid"></div></div>
  </section>

  <!-- ============ DICE POUCH ============ -->
  <section class="screen" id="scr-pouch">
    <div class="topbar">
      <div class="stat" id="pouch-count"></div>
      <div class="spacer"></div>
      <button class="btn" id="pouch-done">Done</button>
    </div>
    <p class="tag" id="pouch-hint">Your pouch holds 6 dice. Each roll puts 3 of them on the tray, picked at random. Tap a die to change it.</p>
    <div class="collection-body">
      <h3 class="pouchh">In your pouch</h3>
      <div class="dieslots" id="pouch-slots"></div>
      <button class="btn wide" id="pouch-sim" style="margin-top:14px">Preview the encounter tray</button>
      <h3 class="pouchh" style="margin-top:22px;color:#a9b6ac">Dice in your collection</h3>
      <div class="diegrid" id="pouch-bag"></div>
    </div>
  </section>

  <div id="rollsplash"></div>

  <svg id="slotarrow" xmlns="http://www.w3.org/2000/svg">
    <path id="slotpath" fill="none"/>
    <polygon id="slothead"/>
  </svg>

  <svg id="aimarrow" xmlns="http://www.w3.org/2000/svg">
    <path id="aimpath" fill="none" stroke-linecap="round"/>
    <polygon id="aimhead"/>
  </svg>

  <div id="overlay"><div class="sheet" id="sheet"></div></div>
  <div id="leave"><div class="sheet" id="leavesheet"></div></div>
  <div id="toast"></div>
</div>

<script>
/* =========================================================================
   Dicebound — prototype
   Loop: Camp -> floor of encounters -> extract to bank, or lose it all.
   Dice: each turn you roll a small pool. A die can be slotted into one card
   to scale its effect. Unspent dice are lost at end of turn.
   ========================================================================= */

const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random()*n);
/* Dice rolls use the browser's cryptographic generator. Rejection sampling keeps every
   value exactly equally likely (a plain % would favour the low ones), and the pick of
   which pouch dice go to the tray is a Fisher-Yates shuffle, which is unbiased. */
function secureInt(n){
  if(n<=1) return 0;
  const c=window.crypto;
  if(!c || !c.getRandomValues) return Math.floor(Math.random()*n);
  const lim=Math.floor(4294967296/n)*n, a=new Uint32Array(1);
  do{ c.getRandomValues(a); }while(a[0]>=lim);
  return a[0]%n;
}
function shuffled(list){
  const a=list.slice();
  for(let i=a.length-1;i>0;i--){ const j=secureInt(i+1); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  ember:`<svg class="emberfire" viewBox="0 0 100 100"><path d="M50 8c6 18 22 22 22 42a22 22 0 1 1-44 0c0-12 8-16 12-26 3 6 6 8 6 14 4-8 4-20 4-30z" fill="#c9973f" opacity=".55"/></svg>`,

const tri = n => n*(n+1)/2;
/* Tinder's whole curve in one place: damage grows every level, the die slot
   opens at 3, the second copy only at 5, and the last level pays 3 a pip. */
const tinderDmg = (p,l) => 3 + l + (l>=3 ? (l>=6?3:2)*p : 0);
const REWARD_POOL=['cleave','bulwark','whetstone','siphon','fortune','gambit','loaded',
                   'snakeeyes','weighted','cairn','press','hamstring','tally','tinder'];

/* Deck entries are ids, and each trailing '+' is one level of sharpening.
   Most cards stop at one; a card can declare maxLvl to keep going, which is
   how Tinder hides its die slot behind three levels of training. The level is
   passed to text() and play() as the same argument the old boolean used, so
   `u?7:5` still reads correctly for a one-level card. */
/* A key can carry a baked pip: 'tinder+++#6' is a copy that was made by a
   card slotted with a six, and it keeps that six. Baked copies only ever live
   in a fight's draw and discard piles, never in the deck or the collection,
   so nothing durable is ever written in this form. */
const bakedPip = k => { const m=/#(\d+)$/.exec(k); return m ? +m[1] : 0; };
const stripPip = k => String(k||'').replace(/#\d+$/,'');
const lvl    = k => (stripPip(k).match(/\+/g)||[]).length;
const baseId = k => stripPip(k).replace(/\+/g,'');
const isUp   = k => lvl(k)>0;
const def    = k => CARDS[baseId(k)];
const maxLvl = k => def(k).maxLvl || 1;
/* Sharpening is priced per card and per level: a cheap card starts cheap, and
   every level you put into one makes its next level dearer. Nothing a card
   costs here makes any other card cost more, so training a Tinder to ++++++
   never taxes the first sharpening of a Strike. */
const sharpenCost = k => (11 + 3.4*def(k).cost) * Math.pow(1.55, lvl(k));
/* Sharpening is paid in both things the resource bar shows: xp and gold.
   SHARPEN_GOLD_PER_XP is the dial — gold dropped per fight is roughly twice the xp. */
const SHARPEN_GOLD_PER_XP = 2;
const sharpenGold = k => Math.round(sharpenCost(k) * SHARPEN_GOLD_PER_XP);
const canSharpen = k => S.xp >= sharpenCost(k) && S.bank >= sharpenGold(k);
const xpHTML = v => `<span class="stat pr">${A.xp}<b>${f2(v)}</b></span>`;
const goldHTML = v => `<span class="stat pr">${A.coin}<b>${v}</b></span>`;
const costHTML = k => xpHTML(sharpenCost(k)) + goldHTML(sharpenGold(k));
const needText = k => [S.xp<sharpenCost(k) ? `${f2(sharpenCost(k)-S.xp)} more xp` : '',
                       S.bank<sharpenGold(k) ? `${sharpenGold(k)-S.bank} more gold` : ''].filter(Boolean).join(' and ');
const cardName = k => def(k).name + '+'.repeat(lvl(k));
/* a card's die slot depends on its level — and a copy that already carries a
   baked pip has no slot left to fill */
const dieOf = k => {
  if(bakedPip(k)) return 'none';
  const d=def(k).die; return typeof d==='function' ? d(lvl(k)) : d;
};
const fmt = n => { const r=Math.round(n*10)/10; return Number.isInteger(r)? String(r) : r.toFixed(1); };
/* f1 and f2 keep the decimal even when it is a zero — the point is that the
   player can see these are real numbers, not integers that happen to be round */
const f1 = n => (+n).toFixed(1);
const f2 = n => (+n).toFixed(2);

/* ---------------- enemies ---------------- */
const BESTIARY = {
  slime:{name:'Rot Slime',hp:38,art:'slime',small:true,pattern:[{atk:8},{atk:8},{blk:9}]},
  wretch:{name:'Grave Wretch',hp:30,art:'wretch',small:true,pattern:[{atk:11},{buff:2},{atk:11}]},
  brute:{name:'Stone Brute',hp:64,art:'brute',pattern:[{blk:11},{atk:16},{atk:10}]},
  wraith:{name:'Dicewraith',hp:120,art:'wraith',boss:true,pattern:[{atk:11},{hex:1},{atk:21},{blk:15}]}

/* ---------------- the dice economy ----------------
   Dice are not handed out each turn any more. A roll is a resource with a
   budget for the whole floor, you decide when to spend one, and whatever you
   don't use stays in the tray — through the rest of the turn, the rest of the
   fight, and into the next fight on that floor. So the question stops being
   "what do I do with these dice" and becomes "is this fight worth a roll, or
   do I want to meet the deep one holding a six?"                          */
const MIN_DECK = 8;           /* a deck can be thinned, not emptied */
/* A roll is a handful, not a die: it starts at 3 dice and the Wide Tray skill adds a
   whole die only after many ranks (the value is fractional, the tray counts whole dice). */
const rollSize = () => Math.floor(skillVal('tray') + 1e-9);
const POUCH_SIZE = 6;         /* dice carried in the pouch; each roll draws rollSize() of them at random */
const trayMax  = () => rollSize() + 2;      /* the tray only holds so much — two spare places beyond one roll */
const MAX_PIP       = 8;      /* a rolled die stops at 6; Weighted Die pushes past it */
/* The Roll button is a meter, not a counter. S.rollCharge runs 0..1, a roll
   needs it full and empties it, and every turn start fills 1/refillTurns of
   it — across fights, not per fight. The Bonesetter skill shortens refillTurns. */
const rollReady = () => S.rollCharge >= 1 - 1e-9;
const refillTurns = () => skillVal('bonesetter');
const turnsToRoll = () => Math.ceil((1 - S.rollCharge) * refillTurns() - 1e-9);

/* ---------------- player skills ----------------
   Every skill's value follows sqrt(rank): rank 1 moves the number a lot,
   rank 20 barely moves it, and it never stops moving. Cost climbs linearly
   while the payoff climbs as a square root, so the ratio keeps getting worse.
   Nothing is capped — it just stops being worth the xp, which is the cap that
   matters. Mana and stamina have to land on whole numbers, so their ranks
   bank fractional progress until the next point tips over.                 */
const SKILLS = {
  health:{name:'Health', blurb:'Maximum health', cost:11.4,
    value:r=>60+12*Math.sqrt(r)},
  mana:{name:'Mana', blurb:'Mana each turn', cost:18.6,
    value:r=>3+0.32*Math.sqrt(r)},
  stamina:{name:'Stamina', blurb:'Cards drawn each turn', cost:17.3,
    value:r=>5+0.34*Math.sqrt(r)},
  defense:{name:'Defense', blurb:'Block you start each turn with', cost:13.7,
    value:r=>2.5*Math.sqrt(r)},         /* rank 0 is 0, always */
  /* The Roll button refills a fraction each turn; this is how many turns a
     full refill takes. It starts at 5 and every rank shaves a little off. */
  bonesetter:{name:'Bonesetter', blurb:'Turns for the Roll button to refill', cost:15.2,
    value:r=>5/(1+0.3*Math.sqrt(r))},
  /* Dice a roll puts on the tray. 3 at rank 0, 4 at rank 16 (about 340 xp for that
     rank alone), 5 at rank 64. Deliberately very slow. */
  tray:{name:'Wide Tray', blurb:'Dice per roll (whole dice count)', cost:20,
    value:r=>3+0.25*Math.sqrt(r)}
};
/* Everything the game reads is the rounded value; the raw curve is what the
   camp screen shows you when a rank buys less than a whole point. */
/* Every skill is a real number, never rounded. A rank is worth a fraction of
   a point and the fraction is kept: mana carries inside a turn, health and
   block simply are fractional, and cards drawn accumulate a carry across
   turns (see B.drawCarry) so a stamina of 5.34 really does deal a sixth card
   every third turn. Nobody rounds their way to five mana in two delves. */
const skillVal  = k => SKILLS[k].value(S.skills[k]);
/* Prices are floats like the xp that pays them: rounding a cost to a whole
   number is what made a float economy read as an integer one. */
const skillCost = k => SKILLS[k].cost * (S.skills[k]+1) * (1 + 0.04*S.skills[k]);
function skillStep(k){                      /* what the next rank actually buys */
  const s=SKILLS[k], r=S.skills[k];
  return {now:s.value(r), then:s.value(r+1)};
}

/* ---------------- saving ----------------
   Three backends, best first. window.storage is what works inside Claude's
   artifact viewer, which blocks localStorage outright; localStorage is what
   works when this file is opened from disk or served anywhere normal; memory
   is the honest fallback where neither exists, and the camp screen says so
   rather than pretending the game saved.
   Saves happen at safe points only — camp, floor map, and entering a fight —
   so there is never a half-serialized battle to restore. */
const Store = (()=>{
  const KEY='dicebound:v1';
  let mode='memory', mem=null;
  function init(){
    if(typeof window!=='undefined' && window.storage && typeof window.storage.get==='function'){ mode='cloud'; return mode; }
    try{ localStorage.setItem('__dbtest','1'); localStorage.removeItem('__dbtest'); mode='local'; }
    catch(e){ mode='memory'; }
    return mode;
  }
  async function load(){
    try{
      if(mode==='cloud'){ const r=await window.storage.get(KEY); return r&&r.value?JSON.parse(r.value):null; }
      if(mode==='local'){ const v=localStorage.getItem(KEY); return v?JSON.parse(v):null; }
      return mem;
    }catch(e){ return null; }          /* a missing key throws on window.storage */
  }
  async function save(obj){
    try{
      const str=JSON.stringify(obj);
      if(mode==='cloud') await window.storage.set(KEY,str);
      else if(mode==='local') localStorage.setItem(KEY,str);
      else mem=JSON.parse(str);
    }catch(e){ /* a full or unavailable store must never break a turn */ }
  }
  async function wipe(){
    try{
      if(mode==='cloud') await window.storage.delete(KEY);
      else if(mode==='local') localStorage.removeItem(KEY);
    }catch(e){}
    mem=null;
  }
  return {init,load,save,wipe,get mode(){return mode}};
})();

const emptyCarry = () => ({gold:0,cards:[],xp:0,dice:[]});
const SAVE_VERSION = 2;      /* 1 called the collection a pouch */
function saveGame(){ Store.save({v:SAVE_VERSION, s:S}); }
function applySave(data){
  if(!data || !data.s) return false;
  if(data.v!==SAVE_VERSION && data.v!==1) return false;
  const d=data.s;
  if(data.v===1 && d.pouch && !d.collection) d.collection=d.pouch;   /* renamed in 2 */
  Object.keys(S).forEach(k=>{ if(d[k]!==undefined) S[k]=d[k]; });
  S.skills = Object.assign({health:0,mana:0,stamina:0,defense:0,bonesetter:0,tray:0}, d.skills||{});
  if(!S.carried.dice) S.carried.dice=[];
  S.maxHP = skillVal('health');        /* derived, never trusted from the file */
  S.hp = Math.min(S.hp, S.maxHP);
  normalizePouch();
  return true;
}
/* The pouch holds POUCH_SIZE dice; a roll throws rollSize() of them. Older saves
   had 3, so top them up with plain bone dice. */
function normalizePouch(){
  if(!Array.isArray(S.dicebag)) S.dicebag=[];
  S.pouch=(Array.isArray(S.pouch)?S.pouch:[]).filter((id,i,a)=>S.dicebag.some(d=>d.id===id)&&a.indexOf(id)===i).slice(0,POUCH_SIZE);
  const spare=S.dicebag.filter(d=>!S.pouch.includes(d.id));
  while(S.pouch.length<POUCH_SIZE){
    const d=spare.shift()||(S.dicebag.push({id:S.dieSeq++,kind:'bone'}),S.dicebag[S.dicebag.length-1]);
    S.pouch.push(d.id);
  }
}

/* The tray is the dive's, not the fight's — every change writes straight back
   to S.tray so leftovers survive the battle scene being torn down. */
function syncTray(){ S.tray = B.dice.filter(d=>!d.spent).map(d=>({v:d.v})); }
function liveDice(){ return B.dice.filter(d=>!d.spent) }
function addDie(v){
  if(liveDice().length>=trayMax()) return false;
  B.dice.push({v:v||(1+rnd(6)),spent:false,id:B_dieSeq++,fresh:true});

const DIE_KINDS = {
  bone:{name:'Bone Die', faces:[1,2,3,4,5,6], text:'A plain six-sided die.'},

  enchanted:{name:'Enchanted Die', faces:[1,2,3,4,5,6], text:'Put a card on one face. When the die lands on that face, the card is played.'}
};
const dieById = id => S.dicebag.find(d=>d.id===id);
/* The die's card is played the moment its face lands: free, never enters the hand
   or the discard pile, and the die keeps the card for next time. */
function conjure(d, v){
  const id=d.card, c=def(id), u=lvl(id), dslot=dieOf(id), baked=bakedPip(id);
  const pip = baked || (dslot!=='none' ? v : 0);
  toast(`${cardName(id)} played!`);
  c.play(pip,u,id);
}
/* One roll, used by the battle and by the pouch preview alike: every pouch die gets a
   face, then a random rollSize() of them are the ones that land on the tray. */
function rollPouch(){
  const n=rollSize();
  return shuffled(S.pouch.map((_,i)=>i)).map((i,k)=>{ const d=dieById(S.pouch[i]), f=DIE_KINDS[d.kind].faces;
    return {i,d,v:f[secureInt(f.length)],landed:k<n}; });
}
function rollDice(){
  if(!B || B.busy || B.over) return;
  if(!rollReady()) return toast(`Roll is ready in ${turnsToRoll()} turn${turnsToRoll()===1?'':'s'}.`);
  const room = trayMax() - liveDice().length;
  if(room<=0) return toast('Tray is full. Use a die first.');
  S.rollCharge=0;
  let got=0;
  /* every pouch die is rolled; a random rollSize() of them land on the tray */
  for(const r of rollPouch().filter(x=>x.landed)){
    if(addDie(r.v)){ got++; if(r.d.kind==='enchanted' && r.d.card && r.v===r.d.face) conjure(r.d,r.v);
      const K=DIE_KINDS[r.d.kind]; if(K.fx && r.v===6){ toast(`${K.name}: ${K.fxText.toLowerCase()}`); K.fx(); } }
  }
  if(got<rollSize()) toast(`Tray is full. ${rollSize()-got} dice lost.`);
  syncTray(); renderBattle(); checkEnd();
}

/* ---------------- presentation ----------------
   Phones: #app fills the screen, one column, exactly as authored.

   Desktop: the canvas takes the whole window. Zoom is for legibility only —
   capped, and never below 1:1 — and everything left over becomes *more
   canvas*, not more empty margin. A wide canvas then triggers the container
   queries in the stylesheet, which lay camp out in columns so it fits without
   scrolling. Holding phone proportions on a 2560px monitor was the mistake:
   it guaranteed a narrow column no matter how the window changed.

   Driven by a ResizeObserver on the document element rather than the resize
   event, because inside an iframe the inner window never fires resize when
   the frame's box changes; the observer sees it either way.

   VIEW_SCALE is the zoom, and every place that turns a screen rect into #app
   coordinates divides by it: a scaled parent reports scaled rects but
   positions its children in unscaled pixels. */
const DESIGN_W = 400, DESIGN_H = 840;      /* the shape everything is authored at */
const MIN_W = 360, MAX_W = 1900;           /* logical canvas bounds */
const MIN_H = 520, MAX_H = 1400;
const MAX_ZOOM = 1.35, HARD_ZOOM = 2.2, MARGIN = 24;
let VIEW_SCALE = 1;
function layout(){
  const app=$('#app'), el=document.documentElement;
  const desktop = window.matchMedia('(min-width:700px) and (pointer:fine)').matches;
  if(!desktop){
    VIEW_SCALE = 1;
    app.style.width=''; app.style.height=''; app.style.transform='';
    return;
  }
  const availW = el.clientWidth - MARGIN, availH = el.clientHeight - MARGIN;

  /* 1. zoom: enough to be comfortable, never enough to waste the screen */
  let s = Math.min(MAX_ZOOM, Math.max(1, Math.min(availW/DESIGN_W, availH/DESIGN_H)));
  if(availH/s < MIN_H) s = Math.max(0.5, availH/MIN_H);   /* very short window */

  /* 2. canvas: everything the zoom didn't take */
  let w = Math.min(MAX_W, Math.max(MIN_W, availW/s));
  let h = Math.min(MAX_H, Math.max(MIN_H, availH/s));

  /* 3. a screen so large the canvas maxed out — spend the rest on zoom */
  if(w>=MAX_W && h>=MAX_H) s = Math.min(HARD_ZOOM, availW/w, availH/h);

  VIEW_SCALE = s;
  app.style.width = Math.round(w)+'px';
  app.style.height = Math.round(h)+'px';
  app.style.transform = `translate(-50%,-50%) scale(${s})`;
}
if(typeof ResizeObserver!=='undefined')
  new ResizeObserver(()=>layout()).observe(document.documentElement);
window.addEventListener('pointerup', ev=>{ if(drag) dragEnd(ev); });
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', layout);
if(window.visualViewport) window.visualViewport.addEventListener('resize', layout);

const KW = {
  ethereal:'Ethereal: vanishes if you do not play it this turn.',
  exhaust:'Exhaust: gone for the rest of this fight once played.',
  retain:'Retain: stays in your hand at end of turn.',

  strength:'Strength: adds to every attack it makes.',

  block:'Block: soaks up damage before health does.'
};
const _kwRe = new RegExp('\\b(' + Object.keys(KW).sort((a,b)=>b.length-a.length).join('|') + ')\\b','gi');
function kwify(html){
  return String(html).split(/(<[^>]*>)/).map(part =>
    part.startsWith('<') ? part
      : part.replace(_kwRe, m => `<span class="kw" data-tip="${KW[m.toLowerCase()]}">${m}</span>`)).join('');
}
const tipEl = document.createElement('div'); tipEl.id='tip'; $('#app').appendChild(tipEl);
let tipTimer=0, tipAt=0;
function showTip(el){
  const text = el.dataset.tip; if(!text) return;
  tipEl.textContent = text; tipEl.classList.add('on'); tipAt = Date.now();
  const app=$('#app').getBoundingClientRect(), k=VIEW_SCALE||1;
  const host = el.classList.contains('kw') ? (el.closest('.pcard,.pick')||el) : el;
  const r = host.getBoundingClientRect(), w=tipEl.offsetWidth, h=tipEl.offsetHeight;
  const W=app.width/k, H=app.height/k;
  let x=(r.left+r.width/2-app.left)/k - w/2; x=Math.max(6,Math.min(W-w-6,x));
  let y=(r.bottom-app.top)/k + 6; if(y+h>H-6) y=(r.top-app.top)/k - h - 6;
  tipEl.style.left=x+'px'; tipEl.style.top=Math.max(6,y)+'px';
  clearTimeout(tipTimer); tipTimer=setTimeout(hideTip,2800);
}
function hideTip(){ tipEl.classList.remove('on'); }

/* ---------------- dice pouch ----------------

   a card on one face: when it lands there, the card is played. */
function dieIconHTML(d){ return A.dice; }
const runeTag=d=>{ const k=DIE_KINDS[d.kind]; return k.icon?`<span class="rune">${A[k.icon]}</span>`:''; };

let pouchSel=null;     /* die picked on the pouch screen, waiting for a second tap to swap */

let trayRoll=null, trayRolling=false;
function previewRoll(){

function swapDice(a,b){

/* The pip table is the thing a card face can't say: what this card is worth
   at each die, which is the whole question when you're deciding where a six
   goes. Cards with no slot skip it. */
function pipTable(key){
  const c=def(key), u=lvl(key);
  if(dieOf(key)==='none') return '';
  const rows=[];
  for(let p=1;p<=MAX_PIP;p++) rows.push(
    `<div class="prow"><span class="die mini ${p>6?'heavy':''}">${pipLayout(p)}</span>`
    + `<span>${c.text(p,u)}${p===7?' <span class="tag">Weighted Die only</span>':''}</span></div>`);
  return `<div class="piptable">${rows.join('')}</div>`;
}
function openCardDetail(key){

                                 : `Sharpen needs ${needText(key)}`}</button>`
          : ''}

/* Every level a card can reach, spelled out, with the one you are on marked
   and the next one named. A card that gains something other than numbers —
   Tinder's die slot at 3, its second copy at 5 — says so on that row. */
function upgradePath(key){
  const c=def(key), here=lvl(key), top=maxLvl(key);
  const rows=[];
  for(let l=0;l<=top;l++){
    const name = c.name + '+'.repeat(l);
    const gain = l>0 && c.step ? c.step(l) : '';
    const die  = (typeof c.die==='function' ? c.die(l) : c.die);
    rows.push(`<div class="uprow ${l===here?'here':''} ${l<here?'past':''}">
      <span class="uplvl">${name}${l===here?'<i class="updot here" title="Current level" aria-label="Current level"></i>':l===here+1?'<i class="updot next" title="Next level" aria-label="Next level"></i>':''}</span>
      <span class="uptext">${c.text(0,l)}${gain?` <span class="tag">${gain}</span>`:''}
        ${die==='none'?'<span class="tag">no die slot</span>':''}</span>
    </div>`);
  }
  return `<div class="uppath">${rows.join('')}</div>` +
    (here>=top ? '<p class="tag" style="margin:8px 0 0">Fully sharpened.</p>'
               : `<p class="tag" style="margin:8px 0 0">${top-here} level${top-here===1?'':'s'} left · next costs ${costHTML(key)}</p>`);
}

/* Taking a card out of the deck is free and lives one tap away on the collection
   screen. Burning is the other thing: it destroys the copy for good, costs
   gold, and so it sits behind a confirmation on the card itself. */
function burnCard(key, done){
  if(S.bank < S.burnCost) return toast(`Burning costs ${S.burnCost}g.`);
  const inCollection=S.collection.indexOf(key), inDeck=S.deck.indexOf(key);
  if(inCollection<0 && inDeck<0) return;
  if(inCollection<0 && S.deck.length<=MIN_DECK) return toast(`Your deck needs at least ${MIN_DECK} cards.`);
  sheet(`<h2>Burn ${cardName(key)}?</h2>
    <p>This costs ${S.burnCost}g and destroys this copy for good.
       To simply take it out of the deck, close this and tap it in the Deck tab; that costs nothing.</p>
    <div class="stack">
      <button class="btn danger" id="burn-yes">Burn it</button>
      <button class="btn" id="burn-no">Keep it</button>
    </div>`);
  $('#burn-no').onclick=()=>{ closeSheet(); openCardDetail(key); };
  $('#burn-yes').onclick=()=>{
    if(inCollection>=0) S.collection.splice(inCollection,1); else S.deck.splice(inDeck,1);
    S.bank-=S.burnCost; S.burnCost+=25;
    done(); toast(`${cardName(key)} burned.`);
  };
}
/* ---------------- market ----------------
   Stock is cut once per delve and sits there until you buy it or come back
   from another one, so a visit is a decision about what is on the table
   rather than a reroll. Everything bought lands in the collection, like everything
   else you acquire — the deck is still only ever changed on purpose. */
function priceOf(key){
  const c=def(key);
  return Math.round((46 + 20*c.cost + 8*lvl(key)) * (1 + 0.12*lvl(key)));
}
function cutStock(n){
  const keys=pickN(REWARD_POOL, n);
  return keys.map(k=>{
    /* the odd sharpened copy shows up, at a price */
    const key = (Math.random()<0.18 && maxLvl(k)>0) ? k+'+' : k;
    return {key, price:priceOf(key)};
  });
}
function ensureStock(){
  if(S.market.stamp!==S.delves){ S.market.stock=cutStock(4); S.market.stamp=S.delves; }
}

/* ---- sharpening ----
   Shown as cards, the same faces as the deck and the collection, because
   picking which card to train is the same act as picking which card to slot
   and a row of names made it feel like a different game. */
function sharpenable(){
  const rows=[...S.deck.map((id,i)=>({id,i,where:'deck'})),
              ...S.collection.map((id,i)=>({id,i,where:'collection'}))]
             .filter(r=>lvl(r.id)<maxLvl(r.id));
  /* fold identical copies in the same place into one face with a count */
  const seen=new Map();
  for(const r of rows){
    const k=r.where+'|'+r.id;
    if(seen.has(k)) seen.get(k).n++;
    else seen.set(k, {...r, n:1});
  }
  return [...seen.values()].sort((a,b)=>
    def(a.id).cost-def(b.id).cost || cardName(a.id).localeCompare(cardName(b.id)));
}
function openSharpen(){
  const rows=sharpenable();
  const face=r=>cardFaceHTML(r.id,'pick'+(canSharpen(r.id)?'':' tooexpensive'),r.n)
    .replace('</button>',`<span class="pricetag">${costHTML(r.id)}</span></button>`);
  const sect=(title,w)=>{ const rs=rows.filter(r=>r.where===w); return rs.length?`<h3 class="pouchh">${title}</h3><div class="cardgrid">${rs.map(face).join('')}</div>`:''; };
  sheet(`<h2>The Cardsmith</h2>
    <p>Each upgrade costs more than the last.</p>
    ${rows.length?`<div id="uplist">${sect('In your deck','deck')}${sect('In your collection','collection')}</div>`
      : '<div class="emptynote">Everything you own is fully sharpened.</div>'}

function pickN(arr,n){const a=[...arr];const out=[];while(out.length<n&&a.length)out.push(a.splice(rnd(a.length),1)[0]);return out}
function cardFaceHTML(key,cls,count){
