<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Family Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: one full-screen parchment map you pan and pinch. People are ink-ruled cards joined by
   genealogy lines (* born, † died, rings for a marriage); details slide up in a cozy sheet. */
:root{
  /* one deliberate light look: pale map paper, soft sepia ink */
  --paper:#f6eedb; --paper-edge:#e6d5ad; --card:#fcf8ee; --sheet:#fbf6ea;
  --ink:#4d3f30; --ink-soft:#a99172; --muted:#93806a; --line:rgba(77,63,48,.15);
  --dot:rgba(140,110,70,.12); --dot2:rgba(140,110,70,.07);
  --accent:#a2614a; --accent-ink:#fdf8ee; --shadow:rgba(110,85,50,.28);
  --display:"IM Fell English","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --font:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}

html,body{height:100%;overflow:hidden;overflow:clip;overscroll-behavior:none}
/* body is pinned so the browser can't scroll the whole app to reveal a text field */
body{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);height:auto;
  background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{position:relative;height:100%;overflow:hidden;overflow:clip}

/* ---- the map ---- */
#view{position:absolute;inset:0;touch-action:none;cursor:grab;
  background-color:var(--paper);
  background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.7px),radial-gradient(circle,var(--dot2) 1.4px,transparent 2.3px);
  background-size:16px 16px,37px 37px;background-position:0 0,7px 11px}
#view.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#world.glide{transition:transform .65s var(--ease)}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#links .ln{fill:none;stroke:var(--ink-soft);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
#links .wed{fill:none;stroke:var(--accent);stroke-width:1.3;stroke-linecap:round}
#links .rings circle{fill:var(--card);stroke:var(--accent);stroke-width:1.7}
#links .sibl{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#links .yrs{fill:var(--muted);font-family:var(--font);font-size:11.5px;letter-spacing:.05em;font-variant-numeric:tabular-nums;opacity:.85}
#links .dec{fill:var(--muted);font-family:var(--display);font-size:19px;letter-spacing:.02em}
#links .decl{stroke:var(--ink-soft);stroke-width:1;opacity:.4}
#links .genl{stroke:var(--line);stroke-width:1;stroke-dasharray:2 5}
#links .yrl{stroke:var(--ink-soft);stroke-width:1;opacity:.35}

.card{position:absolute;left:0;top:0;width:190px;height:96px;outline:none}
.face{box-sizing:border-box;height:100%;padding:9px 13px 9px;display:flex;flex-direction:column;justify-content:center;gap:3px;
  background:var(--card);border:1px solid var(--ink-soft);border-radius:10px;cursor:pointer;
  box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--line),0 2px 0 var(--line),0 10px 20px -16px var(--shadow);
  transition:transform .4s var(--spring),box-shadow .25s,border-color .25s}
.card:hover .face{transform:translateY(-2px)}
.card.sel .face{border-color:var(--accent);transform:translateY(-3px);
  box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px color-mix(in srgb,var(--accent) 40%,transparent),0 0 0 5px color-mix(in srgb,var(--accent) 16%,transparent),0 14px 24px -12px var(--shadow)}
.card:focus-visible .face{outline:2px solid var(--accent);outline-offset:3px}
/* long names wrap onto a second line instead of being cut off; very long ones get a smaller face and up to
   three lines, with the place left for the details sheet */
.card.long .nm{font-size:15.5px;line-height:1.08;-webkit-line-clamp:3}
.card.long .pl{display:none}
.nm{font-family:var(--display);font-size:17px;line-height:1.12;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;flex:none}
.yr{display:flex;gap:12px;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.yr .sym{font-family:var(--display);color:var(--muted);margin-right:4px;font-size:14px}
.yr .none{color:var(--muted);font-style:italic;font-family:var(--display);font-size:13px}
.face{position:relative}
.card.sib .face{background:linear-gradient(170deg,color-mix(in srgb,var(--sib) 9%,var(--card)),var(--card) 60%)}
.card.sib .face::after{content:"";position:absolute;top:10px;right:11px;width:7px;height:7px;border-radius:1.5px;background:var(--sib);transform:rotate(45deg);opacity:.85}
.card.sib .nm{padding-right:14px}
.pl{font-family:var(--display);font-style:italic;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.pop .face{animation:pop .6s var(--spring) both}
.card.leaving .face{animation:leave .28s ease forwards}
@keyframes pop{from{transform:scale(.45);opacity:0}}
@keyframes leave{to{transform:scale(.7);opacity:0}}

/* ---- old-map dressing ---- */
.vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 110px 6px color-mix(in srgb,var(--paper-edge) 60%,transparent)}
.frame{position:absolute;inset:8px;pointer-events:none;border:1px solid var(--line);border-radius:6px;outline:1px solid var(--line);outline-offset:-5px}
.compass{position:absolute;width:86px;height:86px;left:max(22px,calc(env(safe-area-inset-left,0px) + 14px));bottom:22px;opacity:.4;pointer-events:none}
.compass .a{fill:var(--ink-soft)} .compass .b{fill:var(--card)} .compass .r{fill:none;stroke:var(--ink-soft);stroke-width:1.2}
.compass text{fill:var(--ink-soft);font-family:var(--display);font-size:13px;text-anchor:middle}

/* ---- header ---- */
.bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding-top:16px;padding-left:max(18px,calc(env(safe-area-inset-left,0px) + 14px));padding-right:max(18px,calc(env(safe-area-inset-right,0px) + 14px));pointer-events:none}
.bar>*{pointer-events:auto}
.cartouche{background:var(--card);border:1px solid var(--ink-soft);border-radius:12px;padding:8px 18px 9px;min-width:0;
  box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--line),0 8px 18px -12px var(--shadow)}
.cartouche h1{margin:0;font-family:var(--display);font-weight:400;font-size:25px;line-height:1.1;letter-spacing:.01em}
.cartouche p{margin:2px 0 0;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-variant-numeric:tabular-nums}
.round{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid var(--ink-soft);background:var(--card);
  box-shadow:0 2px 0 var(--line),0 8px 16px -12px var(--shadow);transition:transform .3s var(--spring)}
.round:active{transform:scale(.9)}
.round svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round}
.round:focus-visible,.btn:focus-visible,.chip:focus-visible,.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.ribbon{position:absolute;top:94px;left:max(18px,calc(env(safe-area-inset-left,0px) + 14px));display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  max-width:calc(100% - 36px);padding:7px 8px 7px 14px;border-radius:999px;background:color-mix(in srgb,var(--card) 88%,transparent);
  border:1px dashed var(--line);font-size:13px;color:var(--ink);transition:opacity .3s,transform .4s var(--spring)}
.ribbon i{font-family:var(--display);font-size:15px}
.ribbon button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600}
.ribbon .dismiss{background:transparent;color:var(--muted);padding:5px 8px;font-size:15px;line-height:1}

/* ---- controls ---- */
.zoom{position:absolute;right:max(18px,calc(env(safe-area-inset-right,0px) + 14px));bottom:24px;display:flex;flex-direction:column;gap:10px;transition:right .45s var(--ease)}
.fab{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;height:50px;padding:0 22px 0 18px;
  border-radius:999px;border:0;background:var(--ink);color:var(--card);font-weight:600;font-size:15px;
  box-shadow:0 3px 0 color-mix(in srgb,var(--ink) 60%,#000),0 14px 24px -14px var(--shadow);transition:transform .45s var(--spring)}
.fab svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.fab:active{transform:translateX(-50%) scale(.94)}
.sheet-open .fab{transform:translateX(-50%) translateY(170%)}

.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(100% - 48px),320px);text-align:center;
  padding:26px 22px;background:var(--card);border:1px solid var(--ink-soft);border-radius:16px;box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--line)}
.empty h2{margin:0 0 6px;font-family:var(--display);font-weight:400;font-size:24px}
.empty p{margin:0 0 16px;color:var(--muted);line-height:1.45}

/* ---- sheet ---- */
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:76%;overflow:auto;overscroll-behavior:contain;box-sizing:border-box;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  background:var(--sheet);border-top:1px solid var(--line);border-radius:22px 22px 0 0;box-shadow:0 -18px 40px -24px var(--shadow);
  transform:translateY(105%);visibility:hidden;transition:transform .5s var(--spring),visibility 0s .5s}
#sheet.open{transform:none;visibility:visible;transition:transform .5s var(--spring),visibility 0s}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 6px}
.x{position:absolute;top:12px;right:max(14px,env(safe-area-inset-right,0px));width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;display:grid;place-items:center}
.x svg{width:14px;height:14px;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
/* on phones the form takes the full height, so the keyboard only shortens it instead of shoving it around */
@media (max-width:759px){#sheet.tall{top:12px;max-height:none;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px) + var(--kb,0px))}}
@media (min-width:760px){
  #sheet{left:auto;top:14px;right:14px;bottom:14px;width:380px;max-height:none;border:1px solid var(--line);border-radius:20px;padding:20px 22px;transform:translateX(112%)}
  .grab{display:none}
  .sheet-open .zoom{right:412px}
  .sheet-open .fab{transform:translateX(calc(-50% - 197px)) translateY(170%)}
}
.eyebrow{margin:0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#sheet h2{margin:4px 44px 4px 0;font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1;text-wrap:balance}
.nee{font-size:15px;color:var(--ink);margin:0 0 6px;display:flex;align-items:baseline;gap:8px}
.nee .lbl{font-family:var(--display);font-style:italic;font-size:17px;color:var(--muted)}
.pl .reg{font-family:var(--font);font-style:normal;font-size:12.5px;color:var(--ink)}
.dates{margin:0;font-size:15px;font-variant-numeric:tabular-nums}
.dates .sym{font-family:var(--display);color:var(--muted);margin-right:4px}
.place{margin:4px 0 0;font-family:var(--display);font-style:italic;font-size:16px;color:var(--muted)}
.note{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--card) 70%,transparent);border:1px solid var(--line);line-height:1.5;font-size:14.5px;white-space:pre-wrap}
.rels{margin:16px 0 0;display:grid;gap:10px}
.rels>div{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:start}
.rels dt{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:7px}
.rels dd{margin:0;display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-family:var(--display);font-size:15px;transition:transform .3s var(--spring)}
.chip:active{transform:scale(.94)}
.hint{color:var(--muted);font-size:13.5px;margin:14px 0 0;line-height:1.45}
.acts{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:14.5px;transition:transform .3s var(--spring)}
.act svg{width:16px;height:16px;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;flex:none}
.act:active{transform:scale(.96)}
.act:disabled{opacity:.4;cursor:default}
.row2{margin-top:10px;display:flex;gap:8px}
.btn{flex:1;height:46px;border-radius:14px;border:1px solid var(--line);background:transparent;font-weight:600;font-size:15px;transition:transform .25s var(--spring)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border:0}
.btn.danger{color:var(--accent)}

form{display:grid;gap:12px;margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:5px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:0}
input,select,textarea{box-sizing:border-box;width:100%;min-width:0;height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px;letter-spacing:0;text-transform:none;color:var(--ink)}
textarea{height:auto;min-height:84px;padding:10px 12px;line-height:1.45;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:1px}
.err{color:var(--accent);font-size:13px;margin:-4px 0 0}
.menu{display:grid;gap:8px;margin-top:14px}
.menu .act{justify-content:flex-start}
.small{font-size:13px;color:var(--muted);line-height:1.45;margin:4px 0 0}

/* ---- toast + leave dialog ---- */
#toast{position:absolute;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:14px;padding:10px 10px 10px 16px;border-radius:14px;background:var(--ink);color:var(--card);font-size:14px;max-width:calc(100% - 40px);
  box-shadow:0 14px 30px -14px var(--shadow);transition:transform .45s var(--spring),opacity .25s}
#toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#toast button{border:0;background:var(--card);color:var(--ink);border-radius:10px;padding:6px 12px;font-weight:600}
#leaveBack{position:absolute;inset:0;z-index:60;background:rgba(77,63,48,.22);opacity:0;pointer-events:none;transition:opacity .25s}
#leaveBack.open{opacity:1;pointer-events:auto}
#leave{position:absolute;left:50%;top:50%;z-index:61;width:min(calc(100% - 40px),340px);box-sizing:border-box;padding:22px 20px 18px;border-radius:20px;background:var(--sheet);
  border:1px solid var(--line);box-shadow:0 24px 60px -20px rgba(0,0,0,.45);transform:translate(-50%,-46%) scale(.92);opacity:0;visibility:hidden;
  transition:transform .38s var(--spring),opacity .22s,visibility 0s .38s}
#leave.open{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible;transition:transform .38s var(--spring),opacity .22s,visibility 0s}
#leave h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
#leave p{margin:6px 0 18px;font-size:14px;line-height:1.45;color:var(--muted)}
#leave .row2{margin:0}

#links .brn{fill:var(--ink-soft);stroke:none;opacity:.92}
#links .knots circle{fill:var(--ink-soft)}
/* ---- zooming out: lines thicken, cards simplify to what reads at a distance ---- */
#links .ln{stroke-width:calc(1.4px * var(--ls,1))}
#links .sibl{stroke-width:calc(1.6px * var(--ls,1))}
#links .wed{stroke-width:calc(1.3px * var(--ls,1))}
#links .rings circle{stroke-width:calc(1.7px * var(--ls,1))}
#links .decl{stroke-width:calc(1px * var(--ls,1))}
#links .dec{font-size:calc(19px * var(--ls,1))}
#world.far .pl{display:none}
#world.far .face{justify-content:center;gap:4px;border-width:1.5px;box-shadow:0 3px 0 var(--line),0 10px 20px -16px var(--shadow)}
#world.far .nm{font-size:22px}
#world.far .yr{font-size:16px}
#world.far .yr .sym{font-size:18px}
#world.far .card.sib .face{background:color-mix(in srgb,var(--sib) 12%,var(--card))}
#world.farther .yr{display:none}
#world.farther .face{align-items:center;text-align:center;border-width:2px}
#world.farther .nm{font-size:27px;line-height:1.05;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#world.farther .card.sib .nm{padding-right:0}
#world.farther .card.long .nm{font-size:21px;-webkit-line-clamp:3}
.sn{display:none}
#world.distant .nm,#world.distant .yr,#world.distant .pl,#world.distant .sn{display:none}
#ruler{position:absolute;left:0;top:0;bottom:0;width:96px;overflow:hidden;pointer-events:none}
#ruler span{position:absolute;top:0;left:max(18px,calc(env(safe-area-inset-left,0px) + 14px));padding:0 6px 3px 2px;font-family:var(--display);font-size:16px;line-height:1.2;color:var(--muted);font-variant-numeric:tabular-nums;
  border-bottom:1px solid color-mix(in srgb,var(--ink-soft) 45%,transparent);background:color-mix(in srgb,var(--paper) 85%,transparent)}
#ruler.glide span,#view.glide #yearLines i{transition:transform .65s var(--ease)}
#yearLines{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#yearLines i{position:absolute;left:0;right:0;top:0;height:1px;background:color-mix(in srgb,var(--ink-soft) 16%,transparent)}
#world.distant .sn{display:none;font-family:var(--display);font-size:58px;line-height:1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#world.distant .face{border:4px solid var(--sur);background:color-mix(in srgb,var(--sur) 40%,var(--card));box-shadow:none}
#world.distant .card.sib .face{background:color-mix(in srgb,var(--sur) 40%,var(--card))}
#world.distant .face::after{display:none}
#world.tiny .sn{display:none}
#world.tiny .face{--node:min(150px,calc(15px * var(--inv,8)));width:var(--node);height:var(--node);margin-left:calc((190px - var(--node)) / 2);margin-top:calc((96px - var(--node)) / 2);
  border-radius:50%;border:calc(var(--node) * .08) solid var(--card);background:var(--sur);box-shadow:0 0 0 calc(var(--node) * .06) var(--sur)}
#surLabels{display:none}
#world.distant #surLabels{display:block}
#surLabels text{font-family:var(--display);text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-linejoin:round}
#world.tiny .card.sib .face{background:var(--sur)}
#world.distant .card.nofam .face,#world.tiny .card.nofam .face{background:var(--card)}
#world.tiny .card.sel .face{box-shadow:0 0 0 4px var(--sur),0 0 0 14px color-mix(in srgb,var(--accent) 45%,transparent)}
.check{display:flex;gap:12px;align-items:flex-start;text-transform:none;letter-spacing:0;font-size:14.5px;color:var(--ink);cursor:pointer}
.check input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.check small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.btn.ask{display:block;width:100%;flex:none;margin-top:18px;padding:0 14px;height:auto;min-height:48px;line-height:1.3;background:var(--card);border-color:var(--ink-soft)}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
.btn.wide{width:100%;margin-top:12px;flex:none}
.mailbox{display:flex;align-items:center;gap:10px;margin-top:16px;padding:8px 8px 8px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.mailbox span{flex:1;min-width:0;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all;font-size:15px}
.mailbox .btn{flex:none;height:38px;padding:0 14px}

// tree.json is AES-256-GCM encrypted with a key derived from the family password (PBKDF2-SHA256, 600k rounds).

}

/* ---------- keyboard: keep the app still, scroll only inside the sheet ---------- */
// overflow: clip on html, body and #app means the browser has nothing to scroll except the sheet,
// so there's no scroll-then-snap-back fight when a field is focused.
function revealField() {
  const el = document.activeElement;
  if (!el || !sheet.contains(el) || !/INPUT|TEXTAREA|SELECT/.test(el.tagName)) return;
  const r = el.getBoundingClientRect(), sr = sheet.getBoundingClientRect();
  const bottom = Math.min(sr.bottom, window.visualViewport ? visualViewport.height + visualViewport.offsetTop : innerHeight);
  if (r.bottom > bottom - 16) sheet.scrollTop += r.bottom - bottom + 28;
  else if (r.top < sr.top + 16) sheet.scrollTop -= sr.top + 16 - r.top;
}

// at least as new as what's published; otherwise the published tree wins (it was edited on another device).

    treeIsLocked = true;

}

  else if (published && published.people.length) S = published;
  else S = template();
  if (!canEdit() && prefs.lineStyle) S.lineStyle = prefs.lineStyle;
  if (!canEdit() && typeof prefs.hideMiddle === 'boolean') S.hideMiddle = prefs.hideMiddle;
  if (!canEdit() && typeof prefs.hideSuffix === 'boolean') S.hideSuffix = prefs.hideSuffix;
  loading = false; sel = null;
  for (const id in cur) delete cur[id];
  render(); applyRole();
  requestAnimationFrame(() => fit(false, innerWidth < 760 ? .55 : .06));
  if (msg) toast(msg);
  if (location.hash === '#tests') setTimeout(showChecks, 300);
}
function showLock(file, msg) {
  lockFile = file;
  const mail = CONFIG.contactEmail.trim();
  $('lockAsk').innerHTML = mail ? `Don't have it? Ask ${esc(CONFIG.ownerName)} at <span style="user-select:all;-webkit-user-select:all">${esc(mail)}</span>.` : '';
  $('lockErr').hidden = true; $('lockPass').value = '';
  app.classList.add('locked'); $('lock').hidden = false;
  setTimeout(() => { try { $('lockPass').focus({ preventScroll: true }); } catch {} }, 50);
  if (msg) toast(msg);
}
$('lockForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pass = $('lockPass').value, err = $('lockErr'), go = $('lockGo');
  const fail = m => { err.textContent = m; err.hidden = false; go.disabled = false; go.textContent = 'Open the tree'; };
  if (!pass) return fail('Enter the password first.');
  if (!cryptoReady()) return fail('This browser can\u2019t open the tree here. Try a current version of Chrome, Safari, Firefox or Edge.');
  go.disabled = true; go.textContent = 'Opening…';
  try {
    const { tree, key } = await openWithPassword(lockFile, pass);
    await storeKey(key, lockFile.salt, $('lockRemember').checked);
    $('lock').hidden = true; app.classList.remove('locked');
    go.disabled = false; go.textContent = 'Open the tree';
    finishBoot(clean(tree), null);
  } catch { fail('That password didn\u2019t work. Check for typos and try again.'); }
});
applyRole();
boot();
// Only refit when the width changes (rotation, window resize). A phone keyboard only changes the height,
// and refitting then made the whole map jump while typing.
// The app's height is frozen in pixels. When the keyboard opens, the frame gets shorter but nothing inside
// re-lays out; the keyboard simply covers the bottom, and the sheet gains extra scroll room to match.
let rz = 0, kbT = 0, lastW = innerWidth, baseH = innerHeight;
function freezeHeight() {
  app.style.height = '';
  app.style.height = app.getBoundingClientRect().height + 'px';
  baseH = innerHeight;
  app.style.setProperty('--kb', '0px');
}
freezeHeight();
addEventListener('resize', () => {
  if (Math.abs(innerWidth - lastW) < 2) {
    // wait for the keyboard to finish sliding before adding scroll room, so the form reflows once
    clearTimeout(kbT);
    kbT = setTimeout(() => app.style.setProperty('--kb', Math.max(0, baseH - innerHeight) + 'px'), 180);
    return;
  }
  lastW = innerWidth; clearTimeout(rz);
  rz = setTimeout(() => { freezeHeight(); fit(false); }, 150);
});
})();
</script>
