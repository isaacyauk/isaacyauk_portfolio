<!DOCTYPE html>
<html lang="en">
<head>
<script src="/scripts/siteload.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSCI 466 Study Hub</title>
<style>
:root{
  --bg:#ffffff; --surface:#f6f6f4; --surface-2:#ffffff; --border:#e2e0da;
  --text:#1c1c1a; --text-sec:#5f5e5a; --text-muted:#8a8880;
  --accent:#185fa5; --accent-bg:#e6f1fb; --accent-text:#0c447c;
  --green:#3b6d11; --green-bg:#eaf3de; --amber:#854f0b; --amber-bg:#faeeda;
  --coral:#993c1d; --coral-bg:#fae3da; --radius:10px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
/* Dark palette is driven by the site-wide `.dark-mode` class set by /scripts/siteload.js */
:root[data-theme="dark"],
:root.dark-mode{
  --bg:#1c1c1a; --surface:#242422; --surface-2:#2c2c2a; --border:#3d3d39;
  --text:#f1efe8; --text-sec:#b4b2a9; --text-muted:#888780;
  --accent:#85b7eb; --accent-bg:#0c447c; --accent-text:#e6f1fb;
  --green:#97c459; --green-bg:#27500a; --amber:#efaf27; --amber-bg:#633806;
  --coral:#f0997b; --coral-bg:#4a1b0c;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);}
.wrap{max-width:760px;margin:0 auto;padding:1.5rem 1.25rem 4rem;}
h1{font-size:1.4rem;font-weight:600;margin:0 0 .15rem;}
.sub{color:var(--text-sec);font-size:.9rem;margin:0 0 1.25rem;}
.tabbar{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:1.25rem;padding-bottom:0;}
.tabbtn{background:none;border:none;padding:.6rem .9rem;font-size:.9rem;color:var(--text-sec);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-family:var(--font);}
.tabbtn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.deckbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem;}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:.35rem .8rem;font-size:.82rem;color:var(--text-sec);cursor:pointer;font-family:var(--font);}
.chip.active{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent-bg);font-weight:600;}
.view{display:none;}
.view.active{display:block;}

/* stats row */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.25rem;}
.stat{background:var(--surface);border-radius:var(--radius);padding:.75rem;text-align:center;}
.stat .n{font-size:1.3rem;font-weight:700;}
.stat .l{font-size:.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}

/* flashcard */
.cardzone{display:flex;flex-direction:column;align-items:center;gap:1rem;}
.progress-track{width:100%;height:6px;background:var(--surface);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);width:0%;transition:width .25s;}
.flip-outer{width:100%;max-width:560px;height:280px;perspective:1200px;cursor:pointer;}
.flip-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s;}
.flip-outer.flipped .flip-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--border);border-radius:16px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.75rem;}
.face .tag{position:absolute;top:14px;left:16px;font-size:.7rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;}
.face .txt{font-size:1.2rem;line-height:1.5;font-weight:500;}
.face.back{transform:rotateY(180deg);}
.face.back .txt{font-size:1.02rem;font-weight:400;color:var(--text-sec);}
.hint{font-size:.78rem;color:var(--text-muted);}
.rowbtns{display:flex;gap:10px;width:100%;max-width:560px;}
.btn{flex:1;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);color:var(--text);padding:.7rem;font-size:.88rem;cursor:pointer;font-family:var(--font);font-weight:500;}
.btn:hover{background:var(--surface-2);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.know{background:var(--green-bg);color:var(--green);border-color:var(--green-bg);}
.btn.dontknow{background:var(--coral-bg);color:var(--coral);border-color:var(--coral-bg);}
.btn.small{flex:none;padding:.45rem .9rem;font-size:.8rem;}
.toolrow{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:560px;}
.iconbtn{background:none;border:none;color:var(--text-sec);font-size:.82rem;cursor:pointer;font-family:var(--font);}
.donebox{text-align:center;padding:2.5rem 1rem;}
.donebox h2{margin:0 0 .5rem;}

/* quiz */
.qcard{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:1.5rem;}
.qmeta{display:flex;justify-content:space-between;color:var(--text-muted);font-size:.78rem;margin-bottom:.6rem;}
.qtext{font-size:1.08rem;font-weight:500;margin-bottom:1.1rem;}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.7rem .9rem;margin-bottom:8px;font-size:.92rem;cursor:pointer;font-family:var(--font);color:var(--text);}
.opt:hover{border-color:var(--text-muted);}
.opt.correct{background:var(--green-bg);border-color:var(--green);color:var(--green);font-weight:600;}
.opt.wrong{background:var(--coral-bg);border-color:var(--coral);color:var(--coral);font-weight:600;}
.opt[disabled]{cursor:default;}
.scoreline{text-align:center;color:var(--text-sec);font-size:.85rem;margin-bottom:.75rem;}

/* videos */
.vform{display:flex;flex-direction:column;gap:8px;background:var(--surface);border-radius:var(--radius);padding:1rem;margin-bottom:1.25rem;}
.vform input,.vform select{padding:.55rem .7rem;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:.88rem;font-family:var(--font);}
.vform .row{display:flex;gap:8px;}
.vform .row > *{flex:1;}
.err{color:var(--coral);font-size:.78rem;display:none;}
.vlist{display:flex;flex-direction:column;gap:1.25rem;}
.vitem{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface-2);}
.vitem .frame{position:relative;width:100%;padding-top:56.25%;background:#000;}
.vitem iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.vitem .vinfo{padding:.7rem .9rem;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.vitem .vinfo .t{font-size:.9rem;font-weight:500;}
.vitem .vinfo .d{font-size:.75rem;color:var(--text-muted);margin-top:2px;}
.removeV{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.78rem;font-family:var(--font);}
.empty{text-align:center;color:var(--text-muted);padding:2rem 1rem;font-size:.9rem;}

/* notes */
.notewrap{display:flex;flex-direction:column;gap:.6rem;}
.notehead{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.notehead .lbl{font-size:.8rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;}
.notehead .saved{font-size:.78rem;color:var(--text-muted);}
#noteArea{width:100%;min-height:340px;resize:vertical;padding:1rem;border-radius:14px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:.95rem;line-height:1.6;font-family:var(--font);}
#noteArea:focus{outline:none;border-color:var(--accent);}
.notefoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
.notefoot .tip{font-size:.75rem;color:var(--text-muted);}

/* site header row */
.siterow{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;}
.siterow a,.siterow button{color:var(--text-sec);font-size:.82rem;text-decoration:none;background:none;border:none;cursor:pointer;font-family:var(--font);padding:0;}
.siterow a:hover,.siterow button:hover{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <div class="siterow">
    <a href="/">← yauk.dev</a>
    <button id="themeToggle">Toggle theme</button>
  </div>
  <h1>CSCI 466 Study Hub</h1>
  <p class="sub">Networks — flashcards, quizzes, and lecture videos</p>

  <div class="tabbar">
    <button class="tabbtn active" data-view="flash">Flashcards</button>
    <button class="tabbtn" data-view="quiz">Quiz</button>
    <button class="tabbtn" data-view="videos">Videos</button>
    <button class="tabbtn" data-view="notes">Notes</button>
  </div>

  <div class="deckbar" id="deckbar"></div>

  <!-- FLASHCARDS -->
  <div class="view active" id="view-flash">
    <div class="stats">
      <div class="stat"><div class="n" id="stat-total">0</div><div class="l">Cards</div></div>
      <div class="stat"><div class="n" id="stat-known">0</div><div class="l">Known</div></div>
      <div class="stat"><div class="n" id="stat-remaining">0</div><div class="l">To review</div></div>
    </div>
    <div class="cardzone" id="flashzone"></div>
  </div>

  <!-- QUIZ -->
  <div class="view" id="view-quiz">
    <div class="scoreline" id="quizscore"></div>
    <div id="quizzone"></div>
  </div>

  <!-- VIDEOS -->
  <div class="view" id="view-videos">
    <div class="vform">
      <div class="row">
        <input id="v-url" type="text" placeholder="Paste a YouTube link (youtube.com/watch?v=... or youtu.be/...)">
      </div>
      <div class="row">
        <input id="v-title" type="text" placeholder="Video title (optional)">
        <select id="v-deck"></select>
      </div>
      <div class="row">
        <button class="btn primary" id="v-add">Add video</button>
      </div>
      <div class="err" id="v-err">Enter a valid YouTube link first.</div>
    </div>
    <div class="vlist" id="vlist"></div>
  </div>

  <!-- NOTES -->
  <div class="view" id="view-notes">
    <div class="notewrap">
      <div class="notehead">
        <span class="lbl" id="note-scope">Notes</span>
        <span class="saved" id="note-saved"></span>
      </div>
      <textarea id="noteArea" placeholder="Jot anything down &mdash; it saves automatically and stays here."></textarea>
      <div class="notefoot">
        <span class="tip">Saved in this browser. Notes are kept separately for each lecture chip above.</span>
        <button class="btn small" id="note-download">Download all notes</button>
      </div>
    </div>
  </div>
</div>

<script>

const DECKS = [
  {

    name: "L2: Network Structure",
    cards: [
      {q:"What is a 'host' or 'end system'?", a:"A device connected to a network (e.g. laptop, phone, server).",
       qv:["Define the term 'end system' as used for networks.","What do we call a device that is connected to a network?","In networking terms, what is a 'host'?","Give the definition of a network 'host.'","What is meant by 'host' or 'end system' in a network?","How would you describe an 'end system'?"]},
      {q:"What is a packet switch, and what is the most common example?", a:"A device that takes a packet arriving on one incoming link and forwards it out on one of its outgoing links. The most common packet switch is a router.",
       qv:["Describe what a packet switch does, and name its most common form.","What device forwards a packet from an incoming link to an outgoing link?","Explain the function of a packet switch and give its most common example.","What is a router in terms of packet switching?","How does a packet switch handle an arriving packet?","What's the most common example of a packet switch, and what does it do?"]},

       qv:["Define the 'network core.'","What does the network core consist of?","Describe the path a packet takes through the network core.","What is meant by 'network core' in the internet's structure?","How would you explain the network core to someone new to networking?"]},
      {q:"What is an access network?", a:"The network that physically connects an end system to its first router.",
       qv:["Define 'access network.'","What does an access network physically connect?","What role does an access network play for a host?","How would you describe an access network?"]},
      {q:"What does an 'edge router' do?", a:"Acts as the boundary between a private network and a public network.",
       qv:["Define the role of an edge router.","What is an edge router responsible for?","Where does an edge router sit in a network, functionally?","What boundary does an edge router represent?"]},

      {q:"How does Cable Internet Access work, and what is the shared-medium issue?", a:"It uses existing TV cable lines; homes need a modem connected via Ethernet to a PC. It's a shared broadcast medium, so users compete for bandwidth. HFC (Hybrid Fiber-Coax) brings fiber to the neighborhood, then coax for the final connection.",

      {q:"How does Fiber Internet Access (FTTH) work?", a:"Connects homes to a shared fiber cable. The link is shared, but ONTs (Optical Network Terminals) take very quick turns transmitting.",

      {q:"What's the key infrastructure difference between the Internet Network and the Cellular Network?", a:"The Internet Network uses wired infrastructure + WiFi (Comcast, AT&T, Spectrum) with smaller range; the Cellular Network uses radio infrastructure connecting to cell towers (Verizon, T-Mobile) with larger range (3G/4G/5G). Both usually connect to the same internet backbone.",
       qv:["Compare the infrastructure used by the Internet Network vs. the Cellular Network.","How does a cellular network's range compare to the internet network's range?","What infrastructure do providers like Comcast and Spectrum use vs. providers like Verizon and T-Mobile?","Do the Internet Network and Cellular Network usually connect to the same backbone?"]},
      {q:"What does it mean for a smaller network to 'piggyback' on a larger one (e.g. Trump Mobile on T-Mobile)?", a:"A smaller ISP or wireless provider uses an existing larger network's infrastructure (towers, cabling) rather than building its own, to get coverage and speed cheaply.",

      {q:"Compare signal type and material: twisted pair vs coaxial vs fiber.", a:"Twisted pair: electrical signal, copper. Coaxial: electrical signal, copper. Fiber: light signal, glass/plastic.",

      {q:"Which physical medium has the highest bandwidth and longest distance capability?", a:"Fiber optic cable — extremely high bandwidth, very long distance, and immune to EMI.",
       qv:["Which guided medium offers the best bandwidth and distance performance?","What guided medium is immune to electromagnetic interference (EMI)?","Which cable type supports the longest transmission distance?"]},
      {q:"Which guided medium can carry electrical power (PoE), and which cannot carry power at all?", a:"Twisted pair can carry power (Power over Ethernet). Fiber cannot carry electrical power (it carries light).",
       qv:["Which cable type supports Power over Ethernet (PoE)?","Why can't fiber optic cable deliver electrical power?","Which guided medium can carry both data and electrical power?"]},
      {q:"Name four examples of unguided (wireless) transmission media.", a:"Radio, microwave, infrared, and satellite.",
       qv:["List the unguided (wireless) media covered in the lecture.","What are examples of unguided transmission media?","Name four wireless media types used for network signals."]},
      {q:"How does Starlink provide internet access?", a:"A wired connection to a ground terminal pointed at the sky sends data via satellite to thousands of low-orbit satellites — useful in rural areas lacking wired infrastructure.",

  {
    id: "l3",

    cards: [
      {q:"What is a protocol?", a:"A protocol defines the format and order of messages exchanged between two or more communicating entities, plus the actions taken on transmission or receipt of a message/event.",
       qv:["Define 'protocol' in networking.","What does a network protocol specify?","How would you explain what a protocol is?","What two things does a protocol define about communication?","What is meant by 'protocol' between communicating entities?"]},
      {q:"List all 7 layers of the OSI model, top to bottom.", a:"Application, Presentation, Session, Transport, Network, Data Link, Physical.",
       qv:["Name the seven layers of the OSI model in order.","What are the OSI model's layers, from top to bottom?","List the OSI layers from Application down to Physical.","Put the seven OSI layers in the correct order."]},

      {q:"What is a routing table used for?", a:"It maps destination networks to the correct outgoing interface on a router, so incoming packets are forwarded out the correct link.",
       qv:["Explain the purpose of a routing table.","What information does a routing table map?","How does a router decide which interface to forward a packet out of?"]},
      {q:"What is circuit switching, and how does it differ from packet switching?", a:"In circuit switching, the path and resources between A and B are reserved ahead of time (divided into circuits for concurrent use); unused reserved capacity creates 'silent periods.' It was common in old cellular/telephone networks; most networks now use packet switching instead.",
       qv:["Define circuit switching.","Why does circuit switching create 'silent periods'?","Where was circuit switching commonly used, and what replaced it?","How does circuit switching reserve resources compared to packet switching?"]},
      {q:"What does traceroute do?", a:"A network diagnostic tool that displays the route (hops) taken to a destination and the round-trip time (RTT) for each hop.",
       qv:["Explain the purpose of the traceroute tool.","What information does traceroute display about each hop?","Why would you use traceroute?"]},
      {q:"What does the whois tool provide?", a:"Registration data for a domain name or IP address.",
       qv:["Explain what the whois command is used for.","What kind of information does whois look up?","What does whois tell you about a domain or IP address?"]},
      {q:"What does RTT stand for in the context of traceroute?", a:"Round-Trip Time — the time for a packet to travel to a hop and back.",
       qv:["What does the abbreviation RTT mean in traceroute output?","Define Round-Trip Time (RTT).","What does RTT measure for each hop in a traceroute?"]}
    ]
  }
];

// Hardcoded lecture videos (Claude adds these here as links come in).
// User-added videos via the form are merged in from localStorage.
const SEED_VIDEOS = [];

// ---------- State ----------
const STORAGE_KEY = "csci466_study_v1";
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {known:{}, videos:[], quizScore:{correct:0,total:0}};
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
let state = loadState();
if(!state.known) state.known = {};
if(!state.videos) state.videos = [];
if(!state.quizScore) state.quizScore = {correct:0,total:0};
if(!state.notes) state.notes = {};

let currentDeck = "all";
let currentView = "flash";

function allCards(){
  return DECKS.flatMap(d => d.cards.map((c,i)=>({...c, deckId:d.id, deckName:d.name, cardId:d.id+"-"+i})));
}
function cardsForDeck(){
  if(currentDeck === "all") return allCards();
  return allCards().filter(c => c.deckId === currentDeck);
}

// ---------- Deck bar ----------
function renderDeckBar(){
  const bar = document.getElementById("deckbar");
  bar.innerHTML = "";
  const chips = [{id:"all", name:"All lectures"}].concat(DECKS.map(d=>({id:d.id,name:d.name})));
  chips.forEach(c=>{
    const b = document.createElement("button");
    b.className = "chip" + (currentDeck===c.id ? " active":"");
    b.textContent = c.name;
    b.onclick = ()=>{ currentDeck=c.id; flashIndex=0; flashOrder=null; renderDeckBar(); renderCurrentView(); };
    bar.appendChild(b);
  });
  const vsel = document.getElementById("v-deck");
  vsel.innerHTML = DECKS.map(d=>`<option value="${d.id}">${d.name}</option>`).join("");
}

// ---------- Tabs ----------
document.querySelectorAll(".tabbtn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tabbtn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentView = btn.dataset.view;
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    document.getElementById("view-"+currentView).classList.add("active");
    renderCurrentView();
  });
});
function renderCurrentView(){
  if(currentView==="flash") renderFlash();
  else if(currentView==="quiz") renderQuiz();
  else if(currentView==="videos") renderVideos();
  else if(currentView==="notes") renderNotes();
}

// ---------- Flashcards ----------
let flashOrder = null;
let flashIndex = 0;
let flipped = false;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function renderFlash(){
  const cards = cardsForDeck();
  if(!flashOrder || flashIndex >= flashOrder.length){
    flashOrder = cards.map((_,i)=>i);
    flashIndex = 0;
  }
  const known = cards.filter(c=>state.known[c.cardId]).length;
  document.getElementById("stat-total").textContent = cards.length;
  document.getElementById("stat-known").textContent = known;
  document.getElementById("stat-remaining").textContent = cards.length - known;

  const zone = document.getElementById("flashzone");
  zone.innerHTML = "";

  if(cards.length === 0){
    zone.innerHTML = '<div class="empty">No cards in this deck yet.</div>';
    return;
  }

  if(flashIndex >= cards.length){
    zone.innerHTML = `<div class="donebox"><h2>Deck complete</h2><p style="color:var(--text-sec)">You reviewed all ${cards.length} cards.</p></div>`;
    const again = document.createElement("button");
    again.className = "btn primary";
    again.style.maxWidth="200px";
    again.textContent = "Study again";
    again.onclick = ()=>{ flashOrder=shuffle(cards.map((_,i)=>i)); flashIndex=0; flipped=false; renderFlash(); };
    zone.appendChild(again);
    return;
  }

  const idx = flashOrder[flashIndex];
  const card = cards[idx];
  const pct = Math.round((flashIndex/cards.length)*100);

  const track = document.createElement("div");
  track.className = "progress-track";
  track.innerHTML = `<div class="progress-fill" style="width:${pct}%"></div>`;
  zone.appendChild(track);

  const outer = document.createElement("div");
  outer.className = "flip-outer" + (flipped ? " flipped":"");
  outer.innerHTML = `
    <div class="flip-inner">
      <div class="face front">
        <div class="tag">${card.deckName} • Term</div>
        <div class="txt">${escapeHtml(card.q)}</div>
      </div>
      <div class="face back">
        <div class="tag">Answer</div>
        <div class="txt">${escapeHtml(card.a)}</div>
      </div>
    </div>`;
  outer.onclick = ()=>{ flipped = !flipped; outer.classList.toggle("flipped"); };
  zone.appendChild(outer);

  const hint = document.createElement("div");
  hint.className = "hint";
  hint.textContent = "Tap the card to flip";
  zone.appendChild(hint);

  const toolrow = document.createElement("div");
  toolrow.className = "toolrow";
  toolrow.innerHTML = `<span></span>`;
  const shuffleBtn = document.createElement("button");
  shuffleBtn.className = "iconbtn";
  shuffleBtn.textContent = "Shuffle deck";
  shuffleBtn.onclick = ()=>{ flashOrder = shuffle(cards.map((_,i)=>i)); flashIndex=0; flipped=false; renderFlash(); };
  toolrow.querySelector("span").replaceWith(shuffleBtn);
  const counter = document.createElement("span");
  counter.style.color = "var(--text-muted)";
  counter.style.fontSize = ".8rem";
  counter.textContent = `${flashIndex+1} / ${cards.length}`;
  toolrow.appendChild(counter);
  zone.appendChild(toolrow);

  const rowbtns = document.createElement("div");
  rowbtns.className = "rowbtns";
  const dontknow = document.createElement("button");
  dontknow.className = "btn dontknow";
  dontknow.textContent = "Still learning";
  dontknow.onclick = ()=>{ delete state.known[card.cardId]; saveState(); nextCard(); };
  const know = document.createElement("button");
  know.className = "btn know";
  know.textContent = "I know this";
  know.onclick = ()=>{ state.known[card.cardId]=true; saveState(); nextCard(); };
  rowbtns.appendChild(dontknow);
  rowbtns.appendChild(know);
  zone.appendChild(rowbtns);
}
function nextCard(){ flashIndex++; flipped=false; renderFlash(); }
function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

// ---------- Quiz ----------
let quizPool = [];
let quizIdx = 0;
let quizAnswered = false;

function buildQuizPool(){
  const cards = cardsForDeck();
  quizPool = shuffle(cards).slice(0, Math.min(10, cards.length));
  quizIdx = 0;
  quizAnswered = false;
}
function renderQuiz(){
  if(quizPool.length === 0) buildQuizPool();
  const zone = document.getElementById("quizzone");
  const scoreEl = document.getElementById("quizscore");
  const cards = cardsForDeck();
  if(cards.length < 4){
    zone.innerHTML = '<div class="empty">Add at least 4 cards to this deck to unlock quiz mode.</div>';
    scoreEl.textContent = "";
    return;
  }
  if(quizIdx >= quizPool.length){
    scoreEl.textContent = "";
    zone.innerHTML = `<div class="donebox"><h2>Quiz complete</h2><p style="color:var(--text-sec)">Score this round: ${roundScore.correct} / ${roundScore.total}</p></div>`;
    const again = document.createElement("button");
    again.className = "btn primary";
    again.style.maxWidth="200px";
    again.textContent = "New quiz";
    again.onclick = ()=>{ buildQuizPool(); roundScore={correct:0,total:0}; renderQuiz(); };
    zone.appendChild(again);
    return;
  }
  scoreEl.textContent = `Question ${quizIdx+1} of ${quizPool.length} — lifetime score: ${state.quizScore.correct}/${state.quizScore.total}`;

  const q = quizPool[quizIdx];
  const others = shuffle(cards.filter(c=>c.cardId!==q.cardId)).slice(0,3).map(c=>c.a);
  const options = shuffle([q.a, ...others]);
  const phrasingPool = [q.q, ...(q.qv || [])];
  const phrasing = phrasingPool[Math.floor(Math.random()*phrasingPool.length)];

  const card = document.createElement("div");
  card.className = "qcard";
  card.innerHTML = `
    <div class="qmeta"><span>${q.deckName}</span><span>${quizIdx+1}/${quizPool.length}</span></div>
    <div class="qtext">${escapeHtml(phrasing)}</div>
    <div class="opts"></div>
  `;
  const optsWrap = card.querySelector(".opts");
  options.forEach(opt=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = opt;
    b.onclick = ()=>{
      if(quizAnswered) return;
      quizAnswered = true;
      const correct = opt === q.a;
      state.quizScore.total++; roundScore.total++;
      if(correct){ state.quizScore.correct++; roundScore.correct++; }
      saveState();
      optsWrap.querySelectorAll(".opt").forEach(o=>{
        o.disabled = true;
        if(o.textContent === q.a) o.classList.add("correct");
        else if(o === b && !correct) o.classList.add("wrong");
      });
      const nextBtn = document.createElement("button");
      nextBtn.className = "btn primary";
      nextBtn.style.marginTop="12px";
      nextBtn.textContent = quizIdx+1 < quizPool.length ? "Next question" : "See results";
      nextBtn.onclick = ()=>{ quizIdx++; quizAnswered=false; renderQuiz(); };
      card.appendChild(nextBtn);
      renderQuizScoreLine();
    };
    optsWrap.appendChild(b);
  });
  zone.innerHTML = "";
  zone.appendChild(card);
}
function renderQuizScoreLine(){
  document.getElementById("quizscore").textContent = `Question ${quizIdx+1} of ${quizPool.length} — lifetime score: ${state.quizScore.correct}/${state.quizScore.total}`;
}
let roundScore = {correct:0,total:0};

// ---------- Videos ----------
function extractYouTubeId(url){
  if(!url) return null;
  const patterns = [
    /(?:youtube\.com\/watch\?v=|youtube\.com\/embed\/|youtu\.be\/|youtube\.com\/shorts\/)([a-zA-Z0-9_-]{11})/
  ];
  for(const p of patterns){
    const m = url.match(p);
    if(m) return m[1];
  }
  return null;
}
document.getElementById("v-add").addEventListener("click", ()=>{
  const urlInput = document.getElementById("v-url");
  const titleInput = document.getElementById("v-title");
  const deckSel = document.getElementById("v-deck");
  const err = document.getElementById("v-err");
  const id = extractYouTubeId(urlInput.value.trim());
  if(!id){
    err.style.display = "block";
    return;
  }
  err.style.display = "none";
  state.videos.push({
    id,
    title: titleInput.value.trim() || "Lecture video",
    deckId: deckSel.value,
    added: Date.now()
  });
  saveState();
  urlInput.value = ""; titleInput.value = "";
  renderVideos();
});
document.getElementById("v-url").addEventListener("input", ()=>{
  document.getElementById("v-err").style.display = "none";
});

function renderVideos(){
  const list = document.getElementById("vlist");
  const combined = [...SEED_VIDEOS, ...state.videos];
  const filtered = currentDeck === "all" ? combined : combined.filter(v=>v.deckId===currentDeck);
  if(filtered.length === 0){
    list.innerHTML = '<div class="empty">No videos yet. Paste a YouTube link above to add one for this deck.</div>';
    return;
  }
  list.innerHTML = "";
  const deckNameById = Object.fromEntries(DECKS.map(d=>[d.id,d.name]));
  filtered.slice().reverse().forEach(v=>{
    const item = document.createElement("div");
    item.className = "vitem";
    item.innerHTML = `
      <div class="frame"><iframe src="https://www.youtube.com/embed/${v.id}" title="${escapeHtml(v.title)}" allowfullscreen></iframe></div>
      <div class="vinfo">
        <div>
          <div class="t">${escapeHtml(v.title)}</div>
          <div class="d">${deckNameById[v.deckId] || v.deckId}</div>
        </div>
      </div>
    `;
    if(v.added){
      const rm = document.createElement("button");
      rm.className = "removeV";
      rm.textContent = "Remove";
      rm.onclick = ()=>{
        state.videos = state.videos.filter(x=>x.added!==v.added);
        saveState();
        renderVideos();
      };
      item.querySelector(".vinfo").appendChild(rm);
    }
    list.appendChild(item);
  });
}

// ---------- Notes ----------
let noteTimer = null;
function renderNotes(){
  const area = document.getElementById("noteArea");
  const scope = document.getElementById("note-scope");
  const deckName = currentDeck === "all"
    ? "General notes"
    : (DECKS.find(d => d.id === currentDeck) || {}).name || currentDeck;
  scope.textContent = deckName;
  area.value = state.notes[currentDeck] || "";
  document.getElementById("note-saved").textContent = area.value ? "Saved" : "";
}
document.getElementById("noteArea").addEventListener("input", ()=>{
  const saved = document.getElementById("note-saved");
  const deckAtEdit = currentDeck;
  // Keep the in-memory copy current immediately so switching decks mid-type never loses text;
  // only the localStorage write is debounced.
  state.notes[deckAtEdit] = document.getElementById("noteArea").value;
  saved.textContent = "Saving\u2026";
  clearTimeout(noteTimer);
  noteTimer = setTimeout(()=>{
    saveState();
    if(currentDeck === deckAtEdit) saved.textContent = "Saved";
  }, 400);
});
// Never lose a pending write if the tab is closed mid-debounce.
window.addEventListener("beforeunload", ()=>{ if(noteTimer){ clearTimeout(noteTimer); saveState(); } });
document.getElementById("note-download").addEventListener("click", ()=>{
  const order = ["all", ...DECKS.map(d=>d.id)];
  const nameOf = id => id === "all"
    ? "General notes"
    : ((DECKS.find(d=>d.id===id) || {}).name || id);
  const parts = order
    .filter(id => (state.notes[id] || "").trim())
    .map(id => "## " + nameOf(id) + "\n\n" + state.notes[id].trim());
  const body = "# " + document.title + "\n\n"
    + "Exported " + new Date().toLocaleString() + "\n\n"
    + (parts.length ? parts.join("\n\n---\n\n") : "_No notes yet._") + "\n";
  const blob = new Blob([body], {type:"text/markdown"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = document.title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") + "-notes.md";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
});

// ---------- Theme (matches the portfolio's site-wide toggle) ----------
document.getElementById("themeToggle").addEventListener("click", ()=>{
  const dark = document.documentElement.classList.toggle("dark-mode");
  try{ localStorage.setItem("theme", dark ? "dark" : "light"); }catch(e){}
});

// ---------- Init ----------
renderDeckBar();
renderFlash();
</script>
